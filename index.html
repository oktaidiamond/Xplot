<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>χplot</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c1f25; }
body { font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="app">
  <!-- Top toolbar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">χ</span>
      <span class="brand-name">plot</span>
    </div>
    <div class="tool-cluster" id="toolCluster">
      <button class="tool" data-tool="pen" title="Pen (P)">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 17 L13 7 L15 9 L5 19 Z M14 6 L16 4 L18 6 L16 8 Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">P</span>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser (E)">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 14 L10 4 L17 8 L13 16 L7 16 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">E</span>
      </button>
      <button class="tool" data-tool="select" title="Select (S)">
        <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="3" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/></svg>
        <span class="tool-key">S</span>
      </button>
      <button class="tool" data-tool="text" title="Text / LaTeX (T)">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 5 L16 5 M10 5 L10 16" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">T</span>
      </button>
      <button class="tool" id="imageUploadBtn" title="Insert image — also drop a file or paste with ⌘V / Ctrl+V">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="14" height="12" rx="1"/>
          <circle cx="7.5" cy="8.5" r="1.3"/>
          <path d="M3 14 L7 10 L11 13 L14 10 L17 13"/>
        </svg>
        <span class="tool-key">I</span>
      </button>
      <button class="tool" data-tool="graph" title="Plot equation (1)">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 17 L3 3 M3 17 L17 17 M5 14 Q9 6 16 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">1</span>
      </button>
      <button class="tool" data-tool="axes2d" title="Insert 2D axes (2)">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <!-- vertical axis with arrowheads -->
          <line x1="10" y1="2" x2="10" y2="18"/>
          <path d="M8.6 3.4 L10 2 L11.4 3.4"/>
          <path d="M8.6 16.6 L10 18 L11.4 16.6"/>
          <!-- horizontal axis with arrowheads -->
          <line x1="2" y1="10" x2="18" y2="10"/>
          <path d="M3.4 8.6 L2 10 L3.4 11.4"/>
          <path d="M16.6 8.6 L18 10 L16.6 11.4"/>
        </svg>
        <span class="tool-key">2</span>
      </button>
      <button class="tool" data-tool="axes3d" title="Insert 3D axes (3)">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <!-- origin around (10, 10). z up, x down-left, y nearly horizontal-right -->
          <!-- z axis up, with arrowhead -->
          <path d="M10 10 L10 2 M8.8 3.2 L10 2 L11.2 3.2"/>
          <!-- x axis down-left at 215°, with arrowhead -->
          <path d="M10 10 L3 15 M4.9 14.7 L3 15 L3.7 13.4"/>
          <!-- y axis horizontal-right with very slight down, with arrowhead -->
          <path d="M10 10 L18 11 M16.5 9.7 L18 11 L16.4 12.3"/>
        </svg>
        <span class="tool-key">3</span>
      </button>
    </div>

    <div class="control-cluster">
      <label class="control" title="Pen color">
        <span class="control-label">Color</span>
        <input type="color" id="penColor" value="#1a1a1a">
      </label>
      <label class="control" title="Background">
        <span class="control-label">Paper</span>
        <input type="color" id="bgColor" value="#ffffff">
      </label>
      <label class="control slider-control" title="Stroke width">
        <span class="control-label">Size</span>
        <select id="penSize" class="size-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4" selected>4</option>
          <option value="8">8</option>
          <option value="16">16</option>
          <option value="32">32</option>
          <option value="64">64</option>
        </select>
        <button class="size-reset-btn" id="sizeResetBtn" title="Reset size to default" type="button">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
        <button class="size-reset-btn" id="sizeLockBtn" title="Lock stroke size to current zoom (L)" type="button">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sizeLockIcon">
            <!-- Default: open padlock -->
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11 V7 a4 4 0 0 1 8 0"/>
          </svg>
        </button>
      </label>
    </div>

    <div class="action-cluster">
      <button class="ctrl-btn icon-only" id="openBoardBtn" title="Open a board file">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-2.5H5a2 2 0 0 0-2 2z"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="saveBoardBtn" title="Download board file">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11"/><path d="M7 10.5 12 15.5l5-5"/><path d="M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="undoBtn" title="Undo (⌘Z)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="redoBtn" title="Redo (⌘⇧Z)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14 20 9l-5-5"/>
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="resetBtn" title="Clear everything">Reset</button>
    </div>
  </div>

  <!-- Main work area -->
  <div class="work-area">
    <aside class="side-panel">
      <div class="panel-header">
        <span class="panel-title">Layers</span>
        <button class="icon-btn" id="addLayerBtn" title="Add layer">+</button>
      </div>
      <div class="layer-list" id="layerList"></div>

      <div class="history-panel" id="historyPanel">
        <div class="panel-header">
          <span class="panel-title">History</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="panel-footer">
        <div class="zoom-bar-wrap">
          <div class="zoom-bar-row">
            <span class="zoom-label">Zoom</span>
            <input type="text" id="zoomReadout" class="zoom-readout" value="100%" title="Click to enter a zoom percentage" spellcheck="false">
          </div>
          <input type="range" id="zoomSlider" class="zoom-slider" min="0" max="1000" value="500" step="1">
          <div class="zoom-bar-row zoom-range-labels">
            <span>1%</span>
            <span>4000%</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
      <div class="embed-layer" id="embedLayer"></div>
      <div class="graph-interact-bar" id="graphInteractBar" style="display:none">
        <span class="gib-hint" id="gibHint"></span>
        <button class="ctrl-btn" id="gibEdit" type="button">Edit equation</button>
        <button class="ctrl-btn primary" id="gibDone" type="button">Done</button>
      </div>
      <!-- Top-right floating toolbar: grid + reset view (always visible) -->
      <div class="canvas-view-toolbar">
        <button class="ctrl-btn icon-only" id="gridBtn" title="Toggle grid">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="1"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
        </button>
        <button class="ctrl-btn icon-only" id="resetViewBtn" title="Reset view">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12 L12 3 L21 12"/>
            <path d="M5 10 L5 21 L19 21 L19 10"/>
            <path d="M10 21 L10 14 L14 14 L14 21"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Graph modal -->
  <div class="modal-backdrop" id="graphModal" style="display:none;">
    <div class="modal graph-modal">
      <div class="modal-head">
        <span>Insert Plot</span>
        <button class="modal-close" data-close="graphModal">×</button>
      </div>
      <div class="modal-body graph-body">
        <label class="g-input-row">
          <span class="g-label">equation</span>
          <input type="text" id="g1d_fn" value="" autocomplete="off" spellcheck="false">
          <div class="latex-render" id="g1d_render"></div>
        </label>
        <div class="graph-settings">
          <div class="gs-row gs-row-ranges">
            <label class="gs-field gs-range">
              <span class="gs-label">x domain</span>
              <input type="number" id="gs_xMin" value="-10" step="any">
              <span class="gs-sep">to</span>
              <input type="number" id="gs_xMax" value="10" step="any">
            </label>
            <label class="gs-field gs-range">
              <span class="gs-label"><span class="only-2d-inline">y range</span><span class="only-3d-inline">y domain</span></span>
              <input type="number" id="gs_yMin" value="-6" step="any">
              <span class="gs-sep">to</span>
              <input type="number" id="gs_yMax" value="6" step="any">
            </label>
          </div>
          <div class="gs-row gs-row-ranges only-3d">
            <label class="gs-field gs-range">
              <span class="gs-label">z range</span>
              <input type="number" id="gs_zMin" value="-10" step="any">
              <span class="gs-sep">to</span>
              <input type="number" id="gs_zMax" value="10" step="any">
            </label>
            <div class="gs-half"></div>
          </div>
          <div class="gs-row gs-row-labels">
            <div class="gs-half gs-labels-group">
              <label class="gs-field gs-label-field">
                <span class="gs-label">x label</span>
                <input type="text" id="gs_xLabel" value="x" autocomplete="off" spellcheck="false">
              </label>
              <label class="gs-field gs-label-field" id="gs_yLabelField">
                <span class="gs-label">y label</span>
                <input type="text" id="gs_yLabel" value="y" autocomplete="off" spellcheck="false">
              </label>
              <label class="gs-field gs-label-field only-3d" id="gs_zLabelField">
                <span class="gs-label">z label</span>
                <input type="text" id="gs_zLabel" value="z" autocomplete="off" spellcheck="false">
              </label>
            </div>
            <div class="gs-half gs-actions-half">
              <div class="gs-row-actions">
                <button type="button" class="gs-action" id="gs_autoFitBtn" title="Fit y range to function values">Fit y to plot</button>
                <label class="gs-toggle">
                  <input type="checkbox" id="gs_showBox" checked>
                  <span class="gs-toggle-track"><span class="gs-toggle-thumb"></span></span>
                  <span class="gs-toggle-label">Show box</span>
                </label>
                <label class="gs-toggle">
                  <input type="checkbox" id="gs_showTicks">
                  <span class="gs-toggle-track"><span class="gs-toggle-thumb"></span></span>
                  <span class="gs-toggle-label">Show ticks</span>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="graph-preview-wrap">
          <div class="graph-preview" id="graphPreview_box"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="ctrl-btn" data-close="graphModal">Cancel</button>
        <button class="ctrl-btn primary" id="graphPlace">Place</button>
      </div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-backdrop" id="confirmModal" style="display:none;">
    <div class="modal confirm-modal">
      <div class="modal-head">
        <span id="confirmTitle">Confirm</span>
      </div>
      <div class="modal-body">
        <div id="confirmMessage" class="confirm-message"></div>
      </div>
      <div class="modal-foot">
        <button class="ctrl-btn" id="confirmCancel">Cancel</button>
        <button class="ctrl-btn primary warn" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap');

:root {
  --paper: #ffffff;
  --ink: #1a1a1a;
  --chrome-bg: #1f2127;
  --chrome-bg-2: #272a31;
  --chrome-line: #353841;
  --chrome-line-strong: #454853;
  --chrome-text: #d8d6d0;
  --chrome-text-soft: #8a8c93;
  --accent: #6b8cce;
  --accent-soft: #2c3548;
  --warn: #d97765;
  --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.18);
  --serif: 'Fraunces', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --hand: 'Caveat', cursive;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #15171b;
  font-family: var(--serif);
  color: var(--chrome-text);
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
/* Re-enable text selection only inside actual editable fields */
input, textarea, [contenteditable="true"], .embed.editing {
  user-select: text !important;
  -webkit-user-select: text !important;
}
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--chrome-bg);
  border-bottom: 1px solid var(--chrome-line); flex-wrap: nowrap; min-width: 0;
}
.brand { display: flex; align-items: center; gap: 6px; }
.brand-mark { font-family: var(--serif); font-size: 22px; font-weight: 500; font-style: italic; color: var(--accent); line-height: 1; transform: translateY(-5px); }
.brand-name { font-family: var(--serif); font-size: 14px; letter-spacing: 0.02em; color: var(--chrome-text-soft); font-weight: 500; }

.tool-cluster, .control-cluster, .action-cluster { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.action-cluster { margin-left: auto; }
.tool-cluster { padding: 0 12px; border-left: 1px solid var(--chrome-line); border-right: 1px solid var(--chrome-line); }

.tool {
  position: relative; width: 36px; height: 36px;
  border: 1px solid transparent; background: transparent; border-radius: 6px;
  cursor: pointer; color: var(--chrome-text-soft);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.tool:hover { background: var(--chrome-line); color: var(--chrome-text); }
.tool.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(107,140,206,0.3); }
.tool-key {
  position: absolute; bottom: 1px; right: 2px;
  font-family: var(--mono); font-size: 8px; color: var(--chrome-text-soft); opacity: 0.7;
}
.tool.active .tool-key { color: var(--accent); opacity: 1; }

.control { display: flex; align-items: center; gap: 6px; padding: 4px 6px; }
.control-label { font-size: 11px; letter-spacing: 0.05em; color: var(--chrome-text-soft); font-family: var(--mono); }
.control input[type="color"] { width: 22px; height: 22px; border: 1px solid var(--chrome-line-strong); border-radius: 4px; cursor: pointer; padding: 0; background: none; }
.control input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.control input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

.size-select {
  font-family: var(--mono); font-size: 12px;
  background: var(--chrome-bg-2); color: var(--chrome-text);
  border: 1px solid var(--chrome-line-strong); border-radius: 4px;
  padding: 3px 22px 3px 8px;
  cursor: pointer; outline: none;
  /* Custom caret instead of native chevron */
  -webkit-appearance: none; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><path d='M1 3 L4 6 L7 3' fill='none' stroke='%23888' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 6px center;
  background-size: 8px;
}
.size-select:focus { border-color: var(--accent); }
.size-reset-btn { width: 20px; height: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--chrome-text-soft); cursor: pointer; transition: color 0.12s, border-color 0.12s; margin-left: 2px; }
.size-reset-btn:hover { color: var(--chrome-text); border-color: var(--chrome-line-strong); }
.size-reset-btn:active { color: var(--accent); }
.size-reset-btn.locked { color: var(--accent); border-color: rgba(107,140,206,0.3); background: var(--accent-soft); }

.ctrl-btn {
  padding: 6px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
  background: transparent; border: 1px solid var(--chrome-line-strong);
  color: var(--chrome-text); border-radius: 5px; cursor: pointer; transition: all 0.12s;
}
.ctrl-btn:hover { background: var(--chrome-line); border-color: var(--chrome-text-soft); }
.ctrl-btn.primary { background: var(--accent); color: #0d0e11; border-color: var(--accent); }
.ctrl-btn.primary:hover { background: #82a0d8; border-color: #82a0d8; }
.ctrl-btn.full { width: 100%; }
.ctrl-btn.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(107,140,206,0.3); }
.ctrl-btn.icon-only { padding: 6px 8px; display: inline-flex; align-items: center; justify-content: center; }
.ctrl-btn.icon-only svg { display: block; }
.ctrl-btn.disabled { opacity: 0.32; pointer-events: none; }

.work-area { flex: 1; display: flex; overflow: hidden; }
.side-panel { width: 220px; background: var(--chrome-bg); border-right: 1px solid var(--chrome-line); display: flex; flex-direction: column; }
.panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.panel-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--chrome-text-soft); }
.icon-btn { width: 22px; height: 22px; border: 1px solid var(--chrome-line-strong); background: transparent; border-radius: 4px; cursor: pointer; color: var(--chrome-text-soft); font-size: 14px; line-height: 1; }
.icon-btn:hover { background: var(--chrome-line); color: var(--chrome-text); }
.layer-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 8px; }
.layer-row { display: flex; align-items: center; gap: 6px; padding: 10px 8px; min-height: 38px; border-radius: 5px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; position: relative; }
.layer-row:hover { background: var(--chrome-line); }
.layer-row:focus { outline: none; box-shadow: 0 0 0 1px var(--accent); }
.layer-row.active { background: var(--accent-soft); border-color: rgba(107,140,206,0.25); }
.layer-row.dragging { opacity: 0.45; }
.layer-row.drop-above::before {
  content: '';
  position: absolute;
  left: 4px; right: 4px; top: -2px;
  height: 2px; background: var(--accent); border-radius: 2px;
  pointer-events: none;
}
.layer-row.drop-below::after {
  content: '';
  position: absolute;
  left: 4px; right: 4px; bottom: -2px;
  height: 2px; background: var(--accent); border-radius: 2px;
  pointer-events: none;
}
.layer-handle {
  width: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--chrome-text-soft);
  cursor: grab;
  flex-shrink: 0;
  opacity: 0.5;
}
.layer-row:hover .layer-handle { opacity: 1; }
.layer-handle:active { cursor: grabbing; }
.layer-vis {
  width: 18px; height: 18px; padding: 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; cursor: pointer;
  color: var(--chrome-text-soft);
  opacity: 0.5;
  transition: opacity 0.12s, color 0.12s;
}
.layer-vis.on { opacity: 1; color: var(--chrome-text); }
.layer-vis:hover { opacity: 1; }

    maxX = Math.max(maxX, b.x + b.w + pad); maxY = Math.max(maxY, b.y + b.h + pad);
  };
  for (const s of layer.strokes) {
    if (s.mode === 'eraser') continue;
    if (!s.kind && (!s.points || !s.points.length)) continue;
    add(strokeBounds(s), (s.width || 0) / 2);
  }
  for (const em of layer.embeds) add(em);
  const sel = state.selection;
  if (sel && sel.lifted && sel.layerId === layer.id) add(sel.bbox);
  return isFinite(minX) ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY } : null;
}

function zoomToLayer(layer) {
  const b = layerWorldBounds(layer);
  if (!b) return;
  const r = wrap.getBoundingClientRect();
  const fit = Math.min(r.width * 0.7 / Math.max(b.w, 1e-6), r.height * 0.7 / Math.max(b.h, 1e-6));
  const scale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, 8, fit));
  state.view.scale = scale;
  state.view.x = b.x + b.w / 2 - r.width / (2 * scale);
  state.view.y = b.y + b.h / 2 - r.height / (2 * scale);
  render();
}


function renderLayerList() {
  const list = document.getElementById('layerList');
  list.innerHTML = '';
  // The list is rendered top-of-stack first (reverse of state.layers).
  // Each row stores its layer id; drag/drop reorders state.layers accordingly.
  [...state.layers].reverse().forEach(layer => {
    const row = document.createElement('div');
    row.className = 'layer-row' + (layer.id === state.activeLayerId ? ' active' : '');
    row.dataset.layerId = layer.id;
    row.draggable = true;

    // Drag handle (visual cue, but the entire row is draggable)
    const handle = document.createElement('span');
    handle.className = 'layer-handle';
    handle.innerHTML = '<svg viewBox="0 0 8 14" width="8" height="14" aria-hidden="true"><circle cx="2" cy="3" r="1" fill="currentColor"/><circle cx="6" cy="3" r="1" fill="currentColor"/><circle cx="2" cy="7" r="1" fill="currentColor"/><circle cx="6" cy="7" r="1" fill="currentColor"/><circle cx="2" cy="11" r="1" fill="currentColor"/><circle cx="6" cy="11" r="1" fill="currentColor"/></svg>';
    handle.title = 'Drag to reorder';
    row.appendChild(handle);

    const vis = document.createElement('button');
    vis.className = 'layer-vis' + (layer.visible ? ' on' : '');
    vis.title = layer.visible ? 'Hide layer' : 'Show layer';
    // Eye icon when visible; eye-with-slash when hidden. Both share the same outer
    // size so the row layout doesn't shift when toggling.
    const eyeOn  = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8 C 3 4.5, 5.5 3, 8 3 S 13 4.5, 14.5 8 C 13 11.5, 10.5 13, 8 13 S 3 11.5, 1.5 8 Z"/><circle cx="8" cy="8" r="2.2"/></svg>';
    const eyeOff = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5 C 4 4, 6 3, 8 3 S 12.5 4.5, 14.5 8 C 13.8 9, 13 9.9, 12.2 10.6 M10 11.7 C 9.4 11.9, 8.7 12, 8 12 C 5.5 12, 3 10.5, 1.5 8 C 2.1 7, 2.9 6.1, 3.8 5.4"/><line x1="2" y1="2" x2="14" y2="14"/></svg>';
    const setIcon = () => { vis.innerHTML = layer.visible ? eyeOn : eyeOff; };
    setIcon();
    vis.onclick = (e) => {
      e.stopPropagation();
      layer.visible = !layer.visible;
      vis.classList.toggle('on', layer.visible);
      vis.removeAttribute('title');
      vis.dataset.tip = layer.visible ? 'Hide layer' : 'Show layer';
      setIcon();
      render();
    };
    vis.draggable = false;
    row.appendChild(vis);

    const name = document.createElement('input');
    name.className = 'layer-name';
    name.value = layer.name;
    name.draggable = false;
    name.onclick = (e) => e.stopPropagation();
    name.onmousedown = (e) => e.stopPropagation(); // prevent drag from name
    name.onchange = () => {
      layer.name = name.value;
      updateNameDisplay();
    };

    // Display span — shows rendered LaTeX for graph layers (e.g., "Graph: " + rendered math).
    // Hidden when input is focused; visible otherwise.
    const display = document.createElement('span');
    display.className = 'layer-name-display';
    display.draggable = false;
    function updateNameDisplay() {
      const m = layer.name.match(/^(Plot:\s*)(.+)$/);
      if (m && window.renderMathInElement) {
        const tex = normalizeForLatex(m[2]);
        display.innerHTML = escapeHTML(m[1]) + '<span class="layer-math">$' + escapeHTML(tex) + '$</span>';
        try {
          window.renderMathInElement(display, {
            delimiters: [{ left: '$', right: '$', display: false }],
            throwOnError: false,
          });
        } catch (_) {}
      } else {
        display.textContent = layer.name;
      }
    }
    updateNameDisplay();
    // Single click on the name does nothing special — the row's onclick selects the layer.
    // Double-click is what enters rename mode (matches Finder / Files-app conventions and
    // makes selecting a layer a single quick click, not a click-into-edit-mode trap).
    display.ondblclick = (e) => {
      e.stopPropagation();
      display.style.display = 'none';
      name.style.display = '';
      name.focus();
      name.select();
    };
    name.onblur = () => {
      // Switch back to display mode
      layer.name = name.value;
      updateNameDisplay();
      display.style.display = '';
      name.style.display = 'none';
    };
    name.onkeydown = (e) => {
      if (e.key === 'Enter') { name.blur(); }
      else if (e.key === 'Escape') { name.value = layer.name; name.blur(); }
    };
    // Default: show display, hide input
    name.style.display = 'none';
    row.appendChild(name);
    row.appendChild(display);

    if (!layer.base) {
      const loc = document.createElement('button');
      loc.className = 'layer-locate';
      loc.title = 'Zoom to layer';
      loc.draggable = false;
      loc.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 5.5 V2 H5.5 M10.5 2 H14 V5.5 M14 10.5 V14 H10.5 M5.5 14 H2 V10.5"/><circle cx="8" cy="8" r="2"/></svg>';
      loc.onclick = (e) => { e.stopPropagation(); zoomToLayer(layer); };
      loc.onmousedown = (e) => e.stopPropagation();
      row.appendChild(loc);
      row.classList.add('has-locate');
    }

    // Delete button — hidden by default, fades in on row hover
    const del = document.createElement('button');
    del.className = 'layer-del';
    del.title = 'Delete layer';
    del.draggable = false;
    del.innerHTML = '<svg viewBox="0 0 14 14" width="11" height="11" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg>';
    del.onclick = (e) => {
      e.stopPropagation();
      if (state.layers.length <= 1) return;
      if (state.activeLayerId === layer.id) {
        const idx = state.layers.findIndex(l => l.id === layer.id);
        state.activeLayerId = state.layers[Math.max(0, idx - 1)].id;
      }
      layer.embeds.forEach(em => em.el && em.el.remove());
      state.layers = state.layers.filter(l => l.id !== layer.id);
      render(); renderLayerList();
      pushHistory('Delete layer');
    };
    del.onmousedown = (e) => e.stopPropagation();
    row.appendChild(del);

    row.tabIndex = 0;
    row.onclick = () => {
      if (state.activeLayerId === layer.id) return;
      state.activeLayerId = layer.id;
      cancelSelection();
      // Toggle the .active class in place rather than re-rendering the whole list — a
      // full re-render would destroy this row's DOM element mid-click, breaking the
      // dblclick-to-rename behavior on the name span.
      for (const r of list.children) r.classList.toggle('active', r.dataset.layerId === layer.id);
      row.focus();
    };

    // Drag-and-drop reordering
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', layer.id);
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      list.querySelectorAll('.drop-above, .drop-below').forEach(el => {
        el.classList.remove('drop-above', 'drop-below');
      });
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = row.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height / 2;
      // Clear other indicators
      list.querySelectorAll('.drop-above, .drop-below').forEach(el => {
        if (el !== row) el.classList.remove('drop-above', 'drop-below');
      });
      row.classList.toggle('drop-above', above);
      row.classList.toggle('drop-below', !above);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drop-above', 'drop-below');
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      const targetId = layer.id;
      if (!draggedId || draggedId === targetId) return;
      const r = row.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height / 2;
      moveLayer(draggedId, targetId, above);
    });

    list.appendChild(row);
  });
}

// Move layer with id `srcId` to be visually `above`/below the layer with id `targetId`.
// "Above" in the list panel = higher z-index (drawn on top) = later in state.layers.
function moveLayer(srcId, targetId, above) {
  const srcIdx = state.layers.findIndex(l => l.id === srcId);
  const tgtIdx = state.layers.findIndex(l => l.id === targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = state.layers.splice(srcIdx, 1);
  // After removing src, target's index may have shifted by 1
  const newTgtIdx = state.layers.findIndex(l => l.id === targetId);
  // List is rendered reversed: top of list (above) -> end of state.layers (top of z-stack)
  // If "above" target in the list, we want src to be AFTER target in state.layers (higher z)
  const insertAt = above ? newTgtIdx + 1 : newTgtIdx;
  state.layers.splice(insertAt, 0, moved);
  renderLayerList();
  render();
  pushHistory('Reorder layers');
}

document.getElementById('addLayerBtn').onclick = () => {
  const l = makeLayer();
  state.layers.push(l);
  state.activeLayerId = l.id;
  renderLayerList(); render();
  pushHistory('Add layer');
};

/* =========================================================================
   RENDER
   ========================================================================= */
function render() {
  const r = wrap.getBoundingClientRect();
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, r.width, r.height);
  if (state.showGrid) drawGrid(r.width, r.height);

  // Render each layer onto the offscreen stroke canvas, then composite onto the main
  // canvas before moving to the next layer. This keeps eraser strokes (which use
  // destination-out) constrained to the layer they're drawn on — without this loop,
  // a single shared offscreen would let an eraser stroke on the top layer punch through
  // strokes on the layers below.
  const dpr = window.devicePixelRatio || 1;
  for (const layer of state.layers) {
    if (!layer.visible) continue;
    if (!layer.strokes.length && !(state.currentStroke && layer.id === state.activeLayerId)
        && !(state.selection && state.selection.lifted && state.selection.layerId === layer.id)) {
      continue;
    }
    strokeCtx.clearRect(0, 0, r.width, r.height);
    strokeCtx.save();
    strokeCtx.scale(state.view.scale, state.view.scale);
    strokeCtx.translate(-state.view.x, -state.view.y);
    for (const stroke of layer.strokes) drawStroke(stroke, strokeCtx);
    // The in-progress stroke lives on the active layer — render it inline at the right
    // z-position so it doesn't float above layers that should be on top of it.
    if (state.currentStroke && layer.id === state.activeLayerId) {
      drawStroke(state.currentStroke, strokeCtx);
    }
    // Selection ghost (lifted strokes) — draw with this layer if it originated here, so
    // its eraser strokes are also confined to the layer they belong to.
    if (state.selection && state.selection.lifted && state.selection.layerId === layer.id) {
      const sel = state.selection;
      const cx = sel.bbox.x + sel.bbox.w / 2, cy = sel.bbox.y + sel.bbox.h / 2;
      const rot = (sel.rotation || 0) * Math.PI / 180;
      const sc = sel.scale || 1;
      strokeCtx.save();
      strokeCtx.translate(cx, cy);
      strokeCtx.rotate(rot);
      strokeCtx.scale(sc, sc);
      strokeCtx.translate(-sel._origCx, -sel._origCy);
      for (const s of sel.strokes) drawStroke(s, strokeCtx);
      strokeCtx.restore();
    }
    strokeCtx.restore();
    // Composite this layer onto the main canvas. setTransform(1,...) to draw at raw
    // device pixels matching the offscreen canvas dimensions.
    if (strokeCanvas.width > 0 && strokeCanvas.height > 0) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(strokeCanvas, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.restore();
    }
  }

  drawSelectionUI();
  drawGraphInteractUI();
  drawEraserCursor();
  positionEmbeds();
  // Update the zoom readout unless the user is actively editing it (so their in-progress
  // typing isn't wiped by a render triggered mid-edit).
  const zoomEl = document.getElementById('zoomReadout');
  if (zoomEl && document.activeElement !== zoomEl) {
    zoomEl.value = Math.round(state.view.scale * 100) + '%';
  }
  syncZoomSlider();
}

function drawEraserCursor() {
  if (state.tool !== 'eraser' || !state.cursor.over) return;
  // Eraser stroke width on screen equals the eraser size (strokes are stored in world units
  // as size/scale, but rendered with the scale transform — so on-screen width is size).
  const radius = state.eraserSize / 2;
  ctx.save();
  // Outer dark ring
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, radius, 0, Math.PI * 2);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(20,20,20,0.85)';
  ctx.stroke();
  // Inner light ring for contrast against dark backgrounds
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, radius - 1, 0, Math.PI * 2);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.stroke();
  // Tiny center dot for precision
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, 1, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(20,20,20,0.85)';
  ctx.fill();
  ctx.restore();
}

function drawGrid(w, h) {
  const v = state.view;
  const wx0 = v.x, wy0 = v.y;
  const wx1 = v.x + w / v.scale, wy1 = v.y + h / v.scale;
  ctx.save();
  ctx.lineWidth = 1;
  function lines(step, alpha) {
    ctx.strokeStyle = `rgba(40,40,30,${alpha})`;
    ctx.beginPath();
    const x0 = Math.floor(wx0 / step) * step, y0 = Math.floor(wy0 / step) * step;
    for (let wx = x0; wx <= wx1; wx += step) {
      const sx = (wx - v.x) * v.scale;
      ctx.moveTo(sx + 0.5, 0); ctx.lineTo(sx + 0.5, h);
    }
    for (let wy = y0; wy <= wy1; wy += step) {
      const sy = (wy - v.y) * v.scale;
      ctx.moveTo(0, sy + 0.5); ctx.lineTo(w, sy + 0.5);
    }
    ctx.stroke();
  }
  const k = Math.ceil(Math.log(15 / (25 * v.scale)) / Math.log(4));
  const minor = 25 * Math.pow(4, k);
  lines(minor, 0.06);
  lines(minor * 4, 0.14);
  ctx.restore();
}

function drawPolyItems(c, items) {
  c.lineCap = 'butt';
  c.lineJoin = 'round';
  for (const it of items) {
    const p = it.p;
    c.beginPath();
    c.moveTo(p[0], p[1]);
    for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
    if (it.f) { c.closePath(); c.fillStyle = it.f; c.fill(); }
    if (it.s) { c.strokeStyle = it.s; c.lineWidth = it.w; c.stroke(); }
  }
}

function drawStroke(s, c) {
  c = c || ctx;
  if (s.kind === 'image') {
    // Canvas-rendered image. The HTMLImageElement is cached on the stroke object so we
    // don't recreate it every render frame. It loads asynchronously the first time, so
    // we re-trigger a render once it's ready.
    if (!s._img) {
      s._img = new Image();
      s._img.onload = () => render();
      s._img.src = s.src;
    }
    if (s._img.complete && s._img.naturalWidth) {
      c.save();
      if (typeof s.opacity === 'number') c.globalAlpha = s.opacity;
      if (s.rot) {
        c.translate(s.x + s.w / 2, s.y + s.h / 2);
        c.rotate(s.rot * Math.PI / 180);
        c.drawImage(s._img, -s.w / 2, -s.h / 2, s.w, s.h);
      } else {
        c.drawImage(s._img, s.x, s.y, s.w, s.h);
      }
      c.restore();
    }
    return;
  }
  if (s.kind === 'polys') {
    c.save();
    if (typeof s.opacity === 'number') c.globalAlpha = s.opacity;
    drawPolyItems(c, s.items);
    c.restore();
    return;
  }
  if (s.kind === 'text') {
    c.save();
    if (typeof s.opacity === 'number') c.globalAlpha = s.opacity;
    c.fillStyle = s.color;
    c.font = (s.italic ? 'italic ' : '') + s.size + 'px "KaTeX_Main", "Latin Modern Roman", Georgia, serif';
    c.textBaseline = 'alphabetic';
    c.textAlign = s.anchor === 'middle-right' ? 'right' : s.anchor === 'middle-left' ? 'left' : 'center';
    const m = c.measureText(s.text);
    const ascent = m.actualBoundingBoxAscent || s.size * 0.7;
    const descent = m.actualBoundingBoxDescent || 0;
    let baselineY, drawX = s.x;
    if (s.anchor === 'middle-right' || s.anchor === 'middle-center' || s.anchor === 'middle-left') {
      // Visible vertical center of the glyph at s.y.
      baselineY = s.y + (ascent - descent) / 2;
    } else {
      // 'top-center': visible top of glyph at s.y → baseline is ascent below.
      baselineY = s.y + ascent;
      // For negative labels, shift left by half the minus width so the digit (not the
      // whole "-N" string) lands centered on the tick.
      if (s.text.charAt(0) === '-') {
        const minusW = c.measureText('-').width;
        drawX -= minusW / 2;
      }
    }
    c.fillText(s.text, drawX, baselineY);
    c.restore();
    return;
  }
  if (!s.points || !s.points.length) return;
  c.save();
  if (s.mode === 'eraser') c.globalCompositeOperation = 'destination-out';
  if (typeof s.opacity === 'number') c.globalAlpha = s.opacity;
  c.strokeStyle = s.color;
  c.fillStyle = s.color;
  c.lineWidth = s.width;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  if (s.points.length === 1) {
    const p = s.points[0];
    c.beginPath(); c.arc(p.x, p.y, s.width / 2, 0, Math.PI * 2); c.fill();
  } else {
    c.beginPath();
    c.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y);
    c.stroke();
  }
  c.restore();
}

function drawSelectionUI() {
  const sel = state.selection;
  if (!sel) return;
  const corners = selectionCornersScreen();
  ctx.save();
  ctx.strokeStyle = '#6b8cce';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(corners.nw.x, corners.nw.y);
  ctx.lineTo(corners.ne.x, corners.ne.y);
  ctx.lineTo(corners.se.x, corners.se.y);
  ctx.lineTo(corners.sw.x, corners.sw.y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // Connector line from top-mid to rotate handle
  ctx.beginPath();
  ctx.moveTo(corners.rotate.attachX, corners.rotate.attachY);
  ctx.lineTo(corners.rotate.x, corners.rotate.y);
  ctx.stroke();

  // Corner handles (squares)
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#6b8cce';
  for (const k of ['nw', 'ne', 'se', 'sw']) {
    const c = corners[k];
    ctx.beginPath();
    ctx.rect(c.x - HANDLE_SIZE/2, c.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
    ctx.fill(); ctx.stroke();
  }
  if (singleTextSelection()) {
    for (const k of ['e', 'w']) {
      const c = corners[k];
      ctx.beginPath();
      ctx.rect(c.x - HANDLE_SIZE/2 + 1, c.y - HANDLE_SIZE, HANDLE_SIZE - 2, HANDLE_SIZE * 2);
      ctx.fill(); ctx.stroke();
    }
  }
  // Rotate handle (circle)
  ctx.beginPath();
  ctx.arc(corners.rotate.x, corners.rotate.y, HANDLE_SIZE / 2 + 1, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function selectionCornersScreen() {
  const sel = state.selection;
  const b = sel.bbox;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const sc = sel.scale || 1;
  const rot = (sel.rotation || 0) * Math.PI / 180;
  const hw = (b.w / 2) * sc, hh = (b.h / 2) * sc;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const corners = {};
  for (const [name, dx, dy] of [['nw',-hw,-hh],['ne',hw,-hh],['se',hw,hh],['sw',-hw,hh]]) {
    const wx = cx + dx*cos - dy*sin;
    const wy = cy + dx*sin + dy*cos;
    corners[name] = worldToScreen(wx, wy);
  }
  // Rotate handle: top-mid in screen coords, then offset 24px in the "up" direction of the rotated box
  const topMid = { x: (corners.nw.x + corners.ne.x) / 2, y: (corners.nw.y + corners.ne.y) / 2 };
  const centerScreen = worldToScreen(cx, cy);
  // "up" = direction from center to topMid, normalized
  const dxU = topMid.x - centerScreen.x, dyU = topMid.y - centerScreen.y;
  const len = Math.hypot(dxU, dyU) || 1;
  const ux = dxU / len, uy = dyU / len;
  corners.rotate = { x: topMid.x + ux * 24, y: topMid.y + uy * 24, attachX: topMid.x, attachY: topMid.y };
  corners.center = centerScreen;
  corners.e = { x: (corners.ne.x + corners.se.x) / 2, y: (corners.ne.y + corners.se.y) / 2 };
  corners.w = { x: (corners.nw.x + corners.sw.x) / 2, y: (corners.nw.y + corners.sw.y) / 2 };
  return corners;
}

/* =========================================================================
   POINTER EVENTS — main canvas
   ========================================================================= */
function canvasPointerDown(e) {
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);

  if (e.button === 2 || e.button === 1) {
    // Right-click (2) or middle-click (1) pans the canvas
    state.panning = { startSx: sp.x, startSy: sp.y, startVx: state.view.x, startVy: state.view.y };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (state.graphInteract) {
    const gi = state.graphInteract;
    const g = state.graphs[gi.gid];
    if (e.button === 0 && g && pointInGraph(gi.gid, wp)) {
      gi.drag = { sx: sp.x, sy: sp.y, moved: false, settings: JSON.parse(JSON.stringify(g.settings)) };
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
      return;
    }
    exitGraphInteract();
    return;
  }

  // If a text embed is currently being edited, clicking the canvas commits the edit
  // instead of starting a new action (draw, select, etc.). The contenteditable's blur
  // handler will run exitTextEditMode automatically.
  const editingEmbed = document.querySelector('.embed.editing');
  if (editingEmbed) {
    editingEmbed.blur();
    return;
  }

  if (state.tool === 'select' && state.selection) {
    const handle = hitSelectionHandle(sp);
    if (handle === 'rotate') {
      const cs = selectionCornersScreen();
      const startAngle = Math.atan2(sp.y - cs.center.y, sp.x - cs.center.x);
      state.selDrag = {
        mode: 'rotate',
        centerSx: cs.center.x,
        centerSy: cs.center.y,
        startAngle,
        startRotation: state.selection.rotation || 0,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (handle === 'e' || handle === 'w') {
      state.selDrag = { mode: 'width-' + handle };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (handle) {
      const opposite = { nw: 'se', ne: 'sw', se: 'nw', sw: 'ne' }[handle];
      const cs = selectionCornersScreen();
      const anchor = cs[opposite];
      const origCorner = cs[handle];
      state.selDrag = {
        mode: 'resize-' + handle,
        anchorSx: anchor.x, anchorSy: anchor.y,
        startCornerDist: Math.hypot(origCorner.x - anchor.x, origCorner.y - anchor.y),
        startScale: state.selection.scale || 1,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (pointInSelection(wp)) {
      state.selDrag = { mode: 'move', startWx: wp.x, startWy: wp.y, startBx: state.selection.bbox.x, startBy: state.selection.bbox.y };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    commitSelection();
  }

  if (state.tool === 'select') {
    state.selDrag = { mode: 'creating', startWx: wp.x, startWy: wp.y };
    state.selection = { layerId: state.activeLayerId, bbox: { x: wp.x, y: wp.y, w: 0, h: 0 }, strokes: [], embeds: [], rotation: 0, scale: 1, lifted: false };
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  if (state.tool === 'text') {
    // Create an inline-editable text embed at click position and enter edit mode immediately
    placeInlineText(wp.x, wp.y);
    return;
  }

  const prevDown = state.lastDown;
  state.lastDown = { t: performance.now(), x: sp.x, y: sp.y };
  if ((state.tool === 'pen' || state.tool === 'eraser') && prevDown && state.lastDown.t - prevDown.t < 450 && Math.hypot(sp.x - prevDown.x, sp.y - prevDown.y) < 6) {
    return;
  }

  if (state.tool === 'pen' || state.tool === 'eraser') {
    state.drawing = true;
    // When size is locked, the stroke's world-width is calibrated against the scale at
    // lock-time so its on-screen width stays constant as the user zooms.
    const widthScale = state.sizeLockedScale != null ? state.sizeLockedScale : state.view.scale;
    state.currentStroke = {
      points: [{ x: wp.x, y: wp.y }],
      color: state.penColor,
      width: activeToolSize() / widthScale,
      mode: state.tool === 'eraser' ? 'eraser' : 'pen',
    };
    canvas.setPointerCapture(e.pointerId);
    render();
  }
}
canvas.addEventListener('pointerdown', canvasPointerDown);

canvas.addEventListener('pointermove', (e) => {
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);

  // Track pointer position for custom cursor rendering (eraser circle)
  state.cursor.x = sp.x;
  state.cursor.y = sp.y;
  state.cursor.over = true;

  if (state.panning) {
    const p = state.panning;
    state.view.x = p.startVx + (p.startSx - sp.x) / state.view.scale;
    state.view.y = p.startVy + (p.startSy - sp.y) / state.view.scale;
    render();
    return;
  }

  if (state.graphInteract) {
    const gi = state.graphInteract;
    if (gi.drag) {
      if (Math.hypot(sp.x - gi.drag.sx, sp.y - gi.drag.sy) > 2) gi.drag.moved = true;
      if (gi.drag.moved) applyInteractDrag(sp);
      return;
    }
    canvas.style.cursor = pointInGraph(gi.gid, wp) ? 'grab' : 'default';
    return;
  }

  if (state.drawing && state.currentStroke) {
    state.currentStroke.points.push({ x: wp.x, y: wp.y });
    render();
    return;
  }

  if (state.selDrag) {
    const sd = state.selDrag;
    const sel = state.selection;
    if (sd.mode === 'creating') {
      sel.bbox.x = Math.min(sd.startWx, wp.x);
      sel.bbox.y = Math.min(sd.startWy, wp.y);
      sel.bbox.w = Math.abs(wp.x - sd.startWx);
      sel.bbox.h = Math.abs(wp.y - sd.startWy);
      render();
    } else if (sd.mode === 'move') {
      sel.bbox.x = sd.startBx + (wp.x - sd.startWx);
      sel.bbox.y = sd.startBy + (wp.y - sd.startWy);
      render();
    } else if (sd.mode === 'rotate') {
      const angle = Math.atan2(sp.y - sd.centerSy, sp.x - sd.centerSx);
      const delta = (angle - sd.startAngle) * 180 / Math.PI;
      let next = sd.startRotation + delta;
      // Hold Shift to snap to the nearest 45° increment
      if (e.shiftKey) next = Math.round(next / 45) * 45;
      sel.rotation = next;
      render();
    } else if (sd.mode.startsWith('width-')) {
      applyTextWidthDrag(sd.mode.slice(6), wp);
      render();
    } else if (sd.mode.startsWith('resize-')) {
      // factor = how much further the pointer is from the anchor than the original corner was
      const d1 = Math.hypot(sp.x - sd.anchorSx, sp.y - sd.anchorSy);
      if (sd.startCornerDist > 0) {
        const factor = Math.max(0.05, d1 / sd.startCornerDist);
        sel.scale = sd.startScale * factor;
      }
      render();
    }
    return;
  }

  // Hover cursor — change based on what's under the pointer
  if (state.tool === 'select' && state.selection) {
    const handle = hitSelectionHandle(sp);
    if (handle === 'rotate') canvas.style.cursor = 'grab';
    else if (handle === 'nw' || handle === 'se') canvas.style.cursor = 'nwse-resize';
    else if (handle === 'ne' || handle === 'sw') canvas.style.cursor = 'nesw-resize';
    else if (handle === 'e' || handle === 'w') canvas.style.cursor = 'ew-resize';
    else if (pointInSelection(wp)) canvas.style.cursor = 'move';
    else canvas.style.cursor = 'crosshair';
  }

  // For eraser tool, re-render so the custom circle cursor follows the pointer
  if (state.tool === 'eraser') render();
});

canvas.addEventListener('pointerup', (e) => {
  if (state.panning) {
    state.panning = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    canvas.style.cursor = state.tool === 'pen' ? 'crosshair' : 'default';
    return;
  }
  if (state.graphInteract && state.graphInteract.drag) {
    const moved = state.graphInteract.drag.moved;
    state.graphInteract.drag = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    canvas.style.cursor = 'grab';
    if (moved) regenInteract(false);
    return;
  }
  if (state.drawing && state.currentStroke) {
    const layer = activeLayer();
    if (layer) {
      layer.strokes.push(state.currentStroke);
      const action = state.currentStroke.mode === 'eraser' ? 'Erase' : 'Draw';
      pushHistory(action);
      state.lastTap = state.currentStroke.points.length === 1
        ? { stroke: state.currentStroke, layerId: layer.id, histId: state.history[state.historyIndex].id, t: performance.now() }
        : null;
    }
    state.currentStroke = null;
    state.drawing = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    render();
    return;
  }
  if (state.selDrag) {
    const sd = state.selDrag;
    state.selDrag = null;
    if (sd.mode === 'creating') {
      const b = state.selection.bbox;
      if (b.w < 4 || b.h < 4) {
        // Click without drag — revert to pen tool so the user can keep drawing
        cancelSelection();
        if (state.tool === 'select') setTool('pen');
      } else {
        liftSelection();
        ensureSelectionOrigin();
      }
    } else if (sd.editOnClick) {
      // Second click on an already-selected text embed without drag → enter edit mode.
      const sp = eventScreenCoords(e);
      const moved = Math.hypot(sp.x - sd.startSx, sp.y - sd.startSy);
      if (moved < 4) {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        // Commit (not cancel!) the selection so any move/resize is preserved before we
        // re-attach the embed to its layer and enter edit mode.
        const targetEmbed = sd.editOnClick;
        commitSelection();
        enterTextEditMode(targetEmbed);
        render();
        return;
      }
    }
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    render();
    return;
  }
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const sp = eventScreenCoords(e);
  const wp0 = screenToWorld(sp.x, sp.y);
  if (state.graphInteract && pointInGraph(state.graphInteract.gid, wp0)) {
    const dyz = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    applyInteractZoom(wp0, Math.max(-100, Math.min(100, dyz)) * (e.ctrlKey ? 0.012 : 0.004));
    return;
  }
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  const k = e.ctrlKey ? 0.012 : 0.004;
  const factor = Math.exp(-Math.max(-100, Math.min(100, dy)) * k);
  state.view.scale = Math.max(0.01, Math.min(40, state.view.scale * factor));
  const wp1 = screenToWorld(sp.x, sp.y);
  state.view.x += wp0.x - wp1.x;
  state.view.y += wp0.y - wp1.y;
  render();
}, { passive: false });

canvas.addEventListener('contextmenu', e => e.preventDefault());
wrap.addEventListener('contextmenu', e => e.preventDefault());

// Double-click on a graph curve → reopen the graph modal pre-filled with that graph's source
wrap.addEventListener('dblclick', (e) => {
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);
  if (state.graphInteract && pointInGraph(state.graphInteract.gid, wp)) {
    const gid = state.graphInteract.gid;
    exitGraphInteract();
    openGraphModalForGraphId(gid);
    return;
  }

  // First, check if there's a text embed under the click. The embed's own dblclick handler
  // can be blocked when the embed has been auto-selected (pointer-events: none on .selected),
  // so we hit-test from the canvas as a fallback. Check both selected and unselected text embeds.
  // For selected embeds, em.x/y haven't been updated to reflect any move yet — apply the
  // selection's bbox-vs-original-center offset to find the embed's current visual position.
  const sel = state.selection;
  let selDx = 0, selDy = 0;
  if (sel) {
    selDx = (sel.bbox.x + sel.bbox.w/2) - sel._origCx;
    selDy = (sel.bbox.y + sel.bbox.h/2) - sel._origCy;
  }
  const allEmbeds = [
    ...state.layers.flatMap(l => l.embeds).map(em => ({ em, dx: 0, dy: 0 })),
    ...(sel ? sel.embeds.map(em => ({ em, dx: selDx, dy: selDy })) : []),
  ];
  for (const { em, dx, dy } of allEmbeds) {
    if (em.type !== 'text') continue;
    const x = em.x + dx, y = em.y + dy;
    if (wp.x >= x && wp.x <= x + em.w && wp.y >= y && wp.y <= y + em.h) {
      // Commit any selection so the embed's current (possibly moved) position is preserved
      // and it re-attaches to its layer with normal pointer-events.
      if (state.selection) commitSelection();
      enterTextEditMode(em);
      return;
    }
  }

  // Otherwise: graph-curve hit test (re-edit the function)
  const hitDist = 8 / state.view.scale;
  let best = null, bestDist = Infinity;
  for (const layer of state.layers) {
    if (!layer.visible) continue;
    for (const s of layer.strokes) {
      if (!s.graphId) continue;
      if (s.kind === 'polys') {
        const b = strokeBounds(s);
        if (wp.x < b.x - hitDist || wp.x > b.x + b.w + hitDist || wp.y < b.y - hitDist || wp.y > b.y + b.h + hitDist) continue;
        for (const it of s.items) {
          const p = it.p;
          if (it.f && pointInPoly(wp.x, wp.y, p)) { bestDist = 0; best = s; break; }
          for (let i = 0; i + 3 < p.length; i += 2) {
            const d = pointToSegmentDist(wp.x, wp.y, p[i], p[i+1], p[i+2], p[i+3]);
            if (d < bestDist) { bestDist = d; best = s; }
          }
        }
        continue;
      }
      if (s.kind === 'text' || !s.points) continue;
      for (let i = 0; i < s.points.length - 1; i++) {
        const a = s.points[i], b = s.points[i+1];
        const d = pointToSegmentDist(wp.x, wp.y, a.x, a.y, b.x, b.y);
        if (d < bestDist) { bestDist = d; best = s; }
      }
    }
  }
  if (!(best && bestDist < hitDist && state.graphs[best.graphId])) {
    best = null;
    for (let i = state.layers.length - 1; i >= 0 && !best; i--) {
      const layer = state.layers[i];
      if (!layer.visible) continue;
      for (const gid of new Set(layer.strokes.map(st => st.graphId).filter(g => g && state.graphs[g] && state.graphs[g].layerId === layer.id))) {
        if (pointInGraph(gid, wp)) { best = { graphId: gid }; bestDist = 0; break; }
      }
    }
  }
  if (best && bestDist < hitDist && state.graphs && state.graphs[best.graphId]) {
    discardDoubleClickTap();
    if (state.graphInteract && state.graphInteract.gid === best.graphId) {
      exitGraphInteract();
      openGraphModalForGraphId(best.graphId);
    } else {
      if (state.graphInteract) exitGraphInteract();
      enterGraphInteract(best.graphId);
    }
  }
});

function discardDoubleClickTap() {
  const tap = state.lastTap;
  state.lastTap = null;
  if (!tap || performance.now() - tap.t > 900) return;
  const layer = state.layers.find(l => l.id === tap.layerId);
  if (layer) layer.strokes = layer.strokes.filter(st => st !== tap.stroke);
  const top = state.history[state.history.length - 1];
  if (top && top.id === tap.histId && state.historyIndex === state.history.length - 1) {
    state.history.pop();
    state.historyIndex = state.history.length - 1;
    renderHistoryPanel();
    syncUndoRedoButtons();
  }
  render();
}

function graphWorldBounds(gid) {
  const g = state.graphs[gid];
  const layer = g && state.layers.find(l => l.id === g.layerId);
  if (!layer) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const st of layer.strokes) {
    if (st.graphId !== gid) continue;
    const b = strokeBounds(st);
    if (!isFinite(b.x)) continue;
    x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
    x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
  }
  return isFinite(x0) ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : null;
}

function pointInGraph(gid, wp) {
  const b = graphWorldBounds(gid);
  if (!b) return false;
  const pad = 8 / state.view.scale;
  return wp.x >= b.x - pad && wp.x <= b.x + b.w + pad && wp.y >= b.y - pad && wp.y <= b.y + b.h + pad;
}

function enterGraphInteract(gid) {
  const g = state.graphs[gid];
  if (!g) return;
  let parsed;
  try { parsed = parseEquation(g.latex); } catch (_) { openGraphModalForGraphId(gid); return; }
  if (state.selection) commitSelection();
  state.graphInteract = { gid, parsed, startJSON: JSON.stringify(g.settings), drag: null, key: null, sample: null, full: true, timer: null };
  document.getElementById('gibHint').textContent = (g.is3D ? 'drag to rotate' : 'drag to pan') + ' · scroll to zoom · double-click to edit';
  document.getElementById('graphInteractBar').style.display = 'flex';
  canvas.style.cursor = 'grab';
  render();
}

function regenInteract(fast) {
  const gi = state.graphInteract;
  if (!gi) return;
  const g = state.graphs[gi.gid];
  const layer = g && state.layers.find(l => l.id === g.layerId);
  if (!layer) { exitGraphInteract(true); return; }
  const opts = { fast, allowEmpty: true };
  if (g.is3D) {
    const st = g.settings;
    const key = [st.xMin, st.xMax, st.yMin, st.yMax, st.zMin, st.zMax].join(',');
    if (gi.key !== key || (!fast && !gi.full)) {
      gi.sample = sample3D(gi.parsed, st, fast ? 30 : SURFACE_N);
      gi.key = key;
      gi.full = !fast;
    }
    opts.sample = gi.sample;
  }
  let strokes;
  try { strokes = buildGraphStrokes({ ...g, graphId: gi.gid }, gi.parsed, opts); } catch (_) { return; }
  layer.strokes = layer.strokes.filter(st => st.graphId !== gi.gid).concat(strokes);
  render();
}

function scheduleFullInteractRegen() {
  const gi = state.graphInteract;
  if (!gi) return;
  clearTimeout(gi.timer);
  gi.timer = setTimeout(() => regenInteract(false), 180);
}

function graphRanges(st) {
  const r = (a, b, da, db) => (b > a ? [a, b] : [da, db]);
  return { x: r(st.xMin, st.xMax, -10, 10), y: r(st.yMin, st.yMax, -6, 6), z: r(st.zMin, st.zMax, -10, 10) };
}

function applyInteractDrag(sp) {
  const gi = state.graphInteract;
  const g = state.graphs[gi.gid];
  if (!g) return;
  const d = gi.drag;
  const dsx = sp.x - d.sx, dsy = sp.y - d.sy;
  if (g.is3D) {
    g.settings.azim = (((d.settings.azim ?? 25) - dsx * 0.5) % 360 + 360) % 360;
    g.settings.elev = Math.max(-89, Math.min(89, (d.settings.elev ?? 20) + dsy * 0.5));
  } else {
    const R = graphRanges(d.settings);
    const ww = g.screenSpan / g.viewScale, wh = ww * 0.6;
    const ux = ww / (R.x[1] - R.x[0]), uy = wh / (R.y[1] - R.y[0]);
    let lx = dsx / state.view.scale, ly = dsy / state.view.scale;
    if (g.rotation) {
      const a = -g.rotation * Math.PI / 180;
      [lx, ly] = [lx * Math.cos(a) - ly * Math.sin(a), lx * Math.sin(a) + ly * Math.cos(a)];
    }
    g.settings.xMin = R.x[0] - lx / ux; g.settings.xMax = R.x[1] - lx / ux;
    g.settings.yMin = R.y[0] + ly / uy; g.settings.yMax = R.y[1] + ly / uy;
  }
  regenInteract(true);
}

function applyInteractZoom(wp, amount) {
  const gi = state.graphInteract;
  const g = state.graphs[gi.gid];
  if (!g) return;
  const f = Math.exp(amount);
  const st = g.settings;
  const R = graphRanges(st);
  if (g.is3D) {
    for (const k of ['x', 'y', 'z']) {
      const c = (R[k][0] + R[k][1]) / 2, h = (R[k][1] - R[k][0]) / 2 * f;
      st[k + 'Min'] = c - h; st[k + 'Max'] = c + h;
    }
  } else {
    const ww = g.screenSpan / g.viewScale, wh = ww * 0.6;
    const ux = ww / (R.x[1] - R.x[0]), uy = wh / (R.y[1] - R.y[0]);
    let lx = wp.x - g.originX, ly = wp.y - g.originY;
    if (g.rotation) {
      const a = -g.rotation * Math.PI / 180;
      [lx, ly] = [lx * Math.cos(a) - ly * Math.sin(a), lx * Math.sin(a) + ly * Math.cos(a)];
    }
    const mx = (R.x[0] + R.x[1]) / 2 + lx / ux;
    const my = (R.y[0] + R.y[1]) / 2 - ly / uy;
    st.xMin = mx + (R.x[0] - mx) * f; st.xMax = mx + (R.x[1] - mx) * f;
    st.yMin = my + (R.y[0] - my) * f; st.yMax = my + (R.y[1] - my) * f;
  }
  regenInteract(true);
  scheduleFullInteractRegen();
}

function roundRange(v, span) {
  const dec = Math.max(0, Math.min(10, Math.ceil(-Math.log10(span)) + 3));
  return +v.toFixed(dec);
}

function exitGraphInteract(silent) {
  const gi = state.graphInteract;
  if (!gi) return;
  clearTimeout(gi.timer);
  state.graphInteract = null;
  document.getElementById('graphInteractBar').style.display = 'none';
  canvas.style.cursor = state.tool === 'eraser' ? 'none' : state.tool === 'text' ? 'text' : (state.tool === 'pen' || state.tool === 'select') ? 'crosshair' : 'default';
  const g = state.graphs[gi.gid];
  if (!g || silent) { render(); return; }
  const st = g.settings;
  for (const k of ['x', 'y', 'z']) {
    const lo = st[k + 'Min'], hi = st[k + 'Max'];
    if (typeof lo === 'number' && typeof hi === 'number' && hi > lo) {
      st[k + 'Min'] = roundRange(lo, hi - lo);
      st[k + 'Max'] = roundRange(hi, hi - lo);
    }
  }
  if (typeof st.azim === 'number') st.azim = Math.round(st.azim * 10) / 10;
  if (typeof st.elev === 'number') st.elev = Math.round(st.elev * 10) / 10;
  if (JSON.stringify(st) === gi.startJSON) { render(); return; }
  state.graphInteract = gi;
  regenInteract(false);
  state.graphInteract = null;
  render();
  pushHistory('Adjust graph');
}

function drawGraphInteractUI() {
  const bar = document.getElementById('graphInteractBar');
  const gi = state.graphInteract;
  if (!gi) return;
  const b = graphWorldBounds(gi.gid);
  if (!b) return;
  const a = worldToScreen(b.x, b.y), c = worldToScreen(b.x + b.w, b.y + b.h);
  const pad = 8;
  ctx.save();
  ctx.strokeStyle = '#6b8cce';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(a.x - pad, a.y - pad, c.x - a.x + pad * 2, c.y - a.y + pad * 2);
  ctx.restore();
  const r = wrap.getBoundingClientRect();
  const bw = bar.offsetWidth || 360, bh = bar.offsetHeight || 32;
  let left = (a.x + c.x) / 2 - bw / 2;
  let top = a.y - pad - bh - 8;
  if (top < 8) top = c.y + pad + 8;
  left = Math.max(8, Math.min(r.width - bw - 8, left));
  top = Math.max(8, Math.min(r.height - bh - 8, top));
  bar.style.left = Math.round(left) + 'px';
  bar.style.top = Math.round(top) + 'px';
}

document.getElementById('gibDone').addEventListener('click', () => exitGraphInteract());
document.getElementById('gibEdit').addEventListener('click', () => {
  const gi = state.graphInteract;
  if (!gi) return;
  const gid = gi.gid;
  exitGraphInteract();
  openGraphModalForGraphId(gid);
});

function cloneStroke(s) {
  if (s.kind === 'image') {
    return { kind: 'image', x: s.x, y: s.y, w: s.w, h: s.h, rot: s.rot || 0, src: s.src, opacity: s.opacity };
  }
  if (s.kind === 'text') {
    return { kind: 'text', x: s.x, y: s.y, text: s.text, size: s.size, color: s.color, anchor: s.anchor, italic: s.italic, graphId: s.graphId, opacity: s.opacity };
  }
  if (s.kind === 'polys') {
    return { kind: 'polys', items: s.items, graphId: s.graphId, opacity: s.opacity };
  }
  return { color: s.color, width: s.width, mode: s.mode, points: s.points.map(p => ({ x: p.x, y: p.y })), graphId: s.graphId, opacity: s.opacity };
}

function translateStroke(s, dx, dy) {
  const c = cloneStroke(s);
  if (c.kind === 'image' || c.kind === 'text') { c.x += dx; c.y += dy; }
  else if (c.kind === 'polys') c.items = c.items.map(it => ({ ...it, p: it.p.map((v, i) => v + (i % 2 ? dy : dx)) }));
  else c.points = c.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
  return c;
}

function pointInPoly(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i+1], xj = p[j], yj = p[j+1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

canvas.addEventListener('pointerleave', () => {
  state.cursor.over = false;
  if (state.tool === 'eraser') render();
});
canvas.addEventListener('pointerenter', (e) => {
  const sp = eventScreenCoords(e);
  state.cursor.x = sp.x;
  state.cursor.y = sp.y;
  state.cursor.over = true;
  if (state.tool === 'eraser') render();
});

/* =========================================================================
   SELECTION OPS
   ========================================================================= */
function strokeBounds(s) {
  // Image strokes carry their own bbox directly.
  if (s.kind === 'image') {
    if (!s.rot) return { x: s.x, y: s.y, w: s.w, h: s.h };
    const a = s.rot * Math.PI / 180, ca = Math.abs(Math.cos(a)), sa = Math.abs(Math.sin(a));
    const bw = s.w * ca + s.h * sa, bh = s.w * sa + s.h * ca;
    return { x: s.x + s.w / 2 - bw / 2, y: s.y + s.h / 2 - bh / 2, w: bw, h: bh };
  }
  // Text-kind strokes have a single (x, y) position and a size — approximate the bounds
  // as a small box around the anchor so they get picked by box-selection normally.
  if (s.kind === 'text') {
    const w = s.size * Math.max(1, s.text.length) * 0.6;
    const h = s.size;
    const xLeft = s.anchor === 'middle-right' ? s.x - w : s.anchor === 'middle-left' ? s.x : s.x - w/2;
    const yTop = (s.anchor && s.anchor.startsWith('middle-')) ? s.y - h/2 : s.y;
    return { x: xLeft, y: yTop, w, h };
  }
  if (s.kind === 'polys') {
    if (!s._b) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const it of s.items) {
        const p = it.p;
        for (let i = 0; i < p.length; i += 2) {
          if (p[i] < minX) minX = p[i]; if (p[i] > maxX) maxX = p[i];
          if (p[i+1] < minY) minY = p[i+1]; if (p[i+1] > maxY) maxY = p[i+1];
        }
      }
      s._b = isFinite(minX) ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY } : { x: 0, y: 0, w: 0, h: 0 };
    }
    return s._b;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of s.points) {
    if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
  }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}
function rectsIntersect(a, b) {
  return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
}

function liftSelection() {
  const sel = state.selection;
  const layer = state.layers.find(l => l.id === sel.layerId) || activeLayer();
  if (!layer) return;
  sel.layerId = layer.id;
  const b = sel.bbox;
  const initialPicked = [];
  const remaining = [];
  for (const s of layer.strokes) {
    const sb = strokeBounds(s);
    if (rectsIntersect(b, sb)) initialPicked.push(s);
    else remaining.push(s);
  }
  // Pick embeds whose center falls inside the drag rect
  const remEmbeds = [];
  const pickedEmbeds = [];
  for (const em of layer.embeds) {
    const cx = em.x + em.w/2, cy = em.y + em.h/2;
    if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
      pickedEmbeds.push(em);
      em.el && em.el.classList.add('selected');
    } else remEmbeds.push(em);
  }

  // Graph grouping: any graphId touched by a picked stroke pulls in ALL strokes with
  // that graphId, even if they weren't directly under the drag rect. This keeps the
  // curve, axes, and tick-label numbers (which are tagged text strokes) as a single unit.
  const allGraphIds = new Set(initialPicked.map(s => s.graphId).filter(Boolean));
  if (allGraphIds.size) {
    const stillRemainingStrokes = [];
    for (const s of remaining) {
      if (s.graphId && allGraphIds.has(s.graphId)) initialPicked.push(s);
      else stillRemainingStrokes.push(s);
    }
    remaining.length = 0;
    remaining.push(...stillRemainingStrokes);
  }
  layer.embeds = remEmbeds;

  // Recompute bbox to tightly encompass all picked strokes AND embeds, so the visible
  // selection rectangle hugs the actual content rather than the user's drag area.
  if (initialPicked.length || pickedEmbeds.length) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const s of initialPicked) {
      const sb = strokeBounds(s);
      if (sb.x < minX) minX = sb.x;
      if (sb.y < minY) minY = sb.y;
      if (sb.x + sb.w > maxX) maxX = sb.x + sb.w;
      if (sb.y + sb.h > maxY) maxY = sb.y + sb.h;
    }
    for (const em of pickedEmbeds) {
      if (em.x < minX) minX = em.x;
      if (em.y < minY) minY = em.y;
      if (em.x + em.w > maxX) maxX = em.x + em.w;
      if (em.y + em.h > maxY) maxY = em.y + em.h;
    }
    sel.bbox = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  for (const s of initialPicked) sel.strokes.push(s);
  for (const em of pickedEmbeds) sel.embeds.push(em);
  layer.strokes = remaining;
  sel.lifted = true;
  sel._origCx = sel.bbox.x + sel.bbox.w/2;
  sel._origCy = sel.bbox.y + sel.bbox.h/2;
}

function pointInSelection(wp) {
  const sel = state.selection;
  if (!sel) return false;
  const b = sel.bbox;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const sc = sel.scale || 1;
  return wp.x >= cx - b.w*sc/2 && wp.x <= cx + b.w*sc/2 && wp.y >= cy - b.h*sc/2 && wp.y <= cy + b.h*sc/2;
}

function hitSelectionHandle(sp) {
  if (!state.selection) return null;
  const c = selectionCornersScreen();
  // Check rotate handle first (it floats above and shouldn't be eclipsed by NW/NE corners)
  const rdx = sp.x - c.rotate.x, rdy = sp.y - c.rotate.y;
  if (Math.hypot(rdx, rdy) <= HANDLE_SIZE) return 'rotate';
  for (const k of ['nw','ne','se','sw']) {
    const dx = sp.x - c[k].x, dy = sp.y - c[k].y;
    if (Math.abs(dx) <= HANDLE_SIZE && Math.abs(dy) <= HANDLE_SIZE) return k;
  }
  if (singleTextSelection()) {
    for (const k of ['e','w']) {
      if (Math.hypot(sp.x - c[k].x, sp.y - c[k].y) <= HANDLE_SIZE * 1.4) return k;
    }
  }
  return null;
}

function singleTextSelection() {
  const s = state.selection;
  if (!s || !s.lifted || s.strokes.length || s.embeds.length !== 1) return null;
  return s.embeds[0].type === 'text' ? s.embeds[0] : null;
}

function applyTextWidthDrag(side, wp) {
  const sel = state.selection;
  const em = singleTextSelection();
  if (!em) return;
  const b = sel.bbox;
  const sc = sel.scale || 1;
  const r = (sel.rotation || 0) * Math.PI / 180;
  const ux = Math.cos(r), uy = Math.sin(r), vx = -Math.sin(r), vy = Math.cos(r);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const hw = b.w * sc / 2, hh = b.h * sc / 2;
  const dir = side === 'e' ? 1 : -1;
  const ax = cx - dir * ux * hw - vx * hh;
  const ay = cy - dir * uy * hw - vy * hh;
  let wv = dir * ((wp.x - ax) * ux + (wp.y - ay) * uy);
  wv = Math.max(em.data.size * 1.5 * sc, wv);
  em.w = wv / sc;
  em.data.autoW = false;
  fitTextEmbedToContent(em);
  const hv = em.h * sc;
  const ncx = ax + dir * ux * wv / 2 + vx * hv / 2;
  const ncy = ay + dir * uy * wv / 2 + vy * hv / 2;
  b.w = em.w; b.h = em.h;
  b.x = ncx - b.w / 2; b.y = ncy - b.h / 2;
  em.x = sel._origCx - em.w / 2;
  em.y = sel._origCy - em.h / 2;
}

function commitSelection() {
  const sel = state.selection;
  if (!sel) return;
  const layer = state.layers.find(l => l.id === sel.layerId) || activeLayer();
  if (!layer) { cancelSelection(); return; }
  const b = sel.bbox;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const rot = (sel.rotation || 0) * Math.PI / 180;
  const sc = sel.scale || 1;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const origCx = sel._origCx, origCy = sel._origCy;

  for (const s of sel.strokes) {
    if (s.kind === 'polys') {
      s.items = s.items.map(it => {
        const q = new Array(it.p.length);
        for (let i = 0; i < it.p.length; i += 2) {
          const dx = it.p[i] - origCx, dy = it.p[i+1] - origCy;
          q[i] = (dx * cos - dy * sin) * sc + cx;
          q[i+1] = (dx * sin + dy * cos) * sc + cy;
        }
        return { ...it, p: q, w: it.w ? it.w * sc : it.w };
      });
      s._b = null;
      layer.strokes.push(s);
      continue;
    }
    if (s.kind === 'image') {
      const icx = s.x + s.w/2, icy = s.y + s.h/2;
      const dx = icx - origCx, dy = icy - origCy;
      const nx = (dx * cos - dy * sin) * sc;
      const ny = (dx * sin + dy * cos) * sc;
      s.w *= sc; s.h *= sc;
      s.x = (nx + cx) - s.w/2;
      s.y = (ny + cy) - s.h/2;
      s.rot = (((s.rot || 0) + (sel.rotation || 0)) % 360 + 360) % 360;
      layer.strokes.push(s);
      continue;
    }
    if (s.kind === 'text') {
      // Text strokes have a single anchor point and a size; transform the anchor and scale the size.
      const dx = s.x - origCx, dy = s.y - origCy;
      const nx = (dx * cos - dy * sin) * sc;
      const ny = (dx * sin + dy * cos) * sc;
      s.x = nx + cx;
      s.y = ny + cy;
      s.size *= sc;
      layer.strokes.push(s);
      continue;
    }
    s.points = s.points.map(p => {
      const dx = p.x - origCx, dy = p.y - origCy;
      const nx = (dx * cos - dy * sin) * sc;
      const ny = (dx * sin + dy * cos) * sc;
      return { x: nx + cx, y: ny + cy };
    });
    s.width = s.width * sc;
    layer.strokes.push(s);
  }
  const movedGraphs = new Set(sel.strokes.map(st => st.graphId).filter(g => g && state.graphs[g]));
  for (const gid of movedGraphs) {
    const g = state.graphs[gid];
    const dx = g.originX - origCx, dy = g.originY - origCy;
    g.originX = (dx * cos - dy * sin) * sc + cx;
    g.originY = (dx * sin + dy * cos) * sc + cy;
    g.viewScale = (g.viewScale || state.view.scale) / sc;
    g.rotation = (g.rotation || 0) + (sel.rotation || 0);
    g.layerId = layer.id;
  }
  for (const em of sel.embeds) {
    em.el && em.el.classList.remove('selected');
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const dx = ecx - origCx, dy = ecy - origCy;
    const nx = (dx * cos - dy * sin) * sc;
    const ny = (dx * sin + dy * cos) * sc;
    const newCx = nx + cx, newCy = ny + cy;
    em.w *= sc; em.h *= sc;
    em.x = newCx - em.w/2; em.y = newCy - em.h/2;
    em.rotation = (em.rotation || 0) + (sel.rotation || 0);
    // For text embeds, also scale the font size so the text grows with the box
    if (em.type === 'text' && em.data && typeof em.data.size === 'number') {
      em.data.size *= sc;
      if (em.data.maxW) em.data.maxW *= sc;
    }
    layer.embeds.push(em);
  }
  // Detect if anything actually changed (movement, rotation, scale)
  const moved = (sel.bbox.x + sel.bbox.w/2) !== sel._origCx || (sel.bbox.y + sel.bbox.h/2) !== sel._origCy;
  const transformed = (sel.rotation || 0) !== 0 || (sel.scale || 1) !== 1;
  state.selection = null;
  if (moved || transformed) pushHistory('Move/Resize');
  render();
}

function cancelSelection() {
  const sel = state.selection;
  if (sel && sel.lifted) {
    const layer = state.layers.find(l => l.id === sel.layerId);
    if (layer) {
      for (const s of sel.strokes) layer.strokes.push(s);
      for (const em of sel.embeds) { em.el && em.el.classList.remove('selected'); layer.embeds.push(em); }
    }
  }
  state.selection = null;
  render();
}

function deleteSelection() {
  if (!state.selection) return;
  for (const em of state.selection.embeds) em.el && em.el.remove();
  state.selection = null;
  pushHistory('Delete');
  render();
}

function copySelection() {
  if (!state.selection) return;
  const sel = state.selection;
  state.clipboard = {
    bbox: { ...sel.bbox },
    strokes: sel.strokes.map(cloneStroke),
    embedsData: sel.embeds.map(em => ({ type: em.type, x: em.x, y: em.y, w: em.w, h: em.h, rotation: em.rotation || 0, data: { ...em.data } })),
    rotation: sel.rotation || 0,
    scale: sel.scale || 1,
    graphs: Object.fromEntries([...new Set(sel.strokes.map(st => st.graphId).filter(g => g && state.graphs[g]))].map(g => [g, JSON.parse(JSON.stringify(state.graphs[g]))])),
  };
}

function pasteClipboard() {
  if (!state.clipboard) return;
  if (state.selection) commitSelection();
  const cb = state.clipboard;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width/2, r.height/2);
  const origCx = cb.bbox.x + cb.bbox.w/2;
  const origCy = cb.bbox.y + cb.bbox.h/2;
  const dx = center.x - origCx, dy = center.y - origCy;
  const layer = activeLayer(); if (!layer) return;

  const newSel = {
    layerId: layer.id,
    bbox: { x: cb.bbox.x + dx, y: cb.bbox.y + dy, w: cb.bbox.w, h: cb.bbox.h },
    strokes: cb.strokes.map(s => translateStroke(s, dx, dy)),
    embeds: [],
    rotation: cb.rotation,
    scale: cb.scale,
    lifted: true,
  };
