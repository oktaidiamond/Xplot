<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Slicer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:   #f0f0ea;
  --ink-2: #c8c8c0;
  --ink-3: #909088;
  --ink-4: #505048;
  --bg:    #1c1c1a;
  --bg-2:  #252523;
  --bg-3:  #363633;
  --blue:  #5b90ff;
  --blue-glow: rgba(91,144,255,.22);
  --red:   #e05555;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 3px;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

.app {
  display: grid;
  grid-template-columns: 360px 1fr;
  grid-template-rows: 57px 1fr;
  height: 100vh;
  overflow: hidden;
}

header {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--bg-3);
}
header h1 {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -.01em;
}

.sidebar {
  border-right: 1px solid var(--bg-3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-section {
  padding: 18px 20px;
  border-bottom: 1px solid var(--bg-3);
  flex-shrink: 0;
}

.label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.dropzone {
  position: relative;
  border: 1.5px dashed var(--bg-3);
  border-radius: var(--r);
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.dropzone:hover, #sec-src.over .dropzone { border-color: var(--ink-3); background: var(--bg-2); }
.dropzone svg { display: block; margin: 0 auto 8px; color: var(--ink-4); }
.dropzone p { font-size: 13px; color: var(--ink-3); line-height: 1.6; }
.dropzone p strong { color: var(--ink-2); font-weight: 500; }

.file-info {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px;
  background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: var(--r);
}
.file-info svg { color: var(--ink-3); flex-shrink: 0; }
.file-info .name {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.file-info .pages { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
.src-list { display: flex; flex-direction: column; gap: 6px; max-height: 168px; overflow-y: auto; }
.src-row { cursor: pointer; transition: border-color .12s; }
.multi .src-row.active { border-color: var(--ink-3); }
.tag, .src-chip { font-family: var(--mono); color: var(--ink-2); border-radius: 2px; flex-shrink: 0; }
.tag {
  display: none; width: 18px; height: 18px; align-items: center; justify-content: center;
  font-size: 10px; background: var(--bg-3);
}
.multi .tag { display: flex; }
.multi .src-row > svg { display: none; }
.src-rm {
  background: none; border: none; padding: 0 2px;
  font-size: 15px; line-height: 1; color: var(--ink-4); cursor: pointer; flex-shrink: 0;
  transition: color .12s;
}
.src-rm:hover { color: var(--red); }
#sec-src.over .add-btn { border-color: var(--ink-3); color: var(--ink-2); background: var(--bg-2); }

.ranges-scroll { flex: 1; overflow-y: auto; padding: 18px 20px; }
.ranges-scroll .label { margin-bottom: 12px; }

.range-list { display: flex; flex-direction: column; gap: 6px; }

.range-row {
  display: grid;
  grid-template-columns: 1fr 1fr 28px;
  gap: 5px;
  align-items: end;
}
.multi .range-row { grid-template-columns: 32px 1fr 1fr 28px; }
.src-chip {
  display: none; height: 32px; font-size: 11px;
  background: var(--bg-2); border: 1px solid var(--bg-3); cursor: pointer;
  transition: border-color .12s, color .12s;
}
.src-chip:hover, .src-chip.open { border-color: var(--ink-3); color: var(--ink); }
.src-menu {
  position: fixed; z-index: 10; display: none; flex-direction: column; gap: 2px;
  min-width: 220px; max-width: 300px; max-height: 260px; overflow-y: auto; padding: 4px;
  background: var(--bg-2); border: 1px solid var(--ink-4); border-radius: var(--r);
}
.src-menu.open { display: flex; }
.src-opt {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  background: none; border: none; border-radius: 2px; cursor: pointer; text-align: left;
  font-family: var(--mono); font-size: 12px; color: var(--ink);
}
.src-opt:hover, .src-opt.current { background: var(--bg-3); }
.src-opt .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-opt .pages { font-size: 11px; color: var(--ink-3); flex-shrink: 0; }
.multi .src-chip { display: block; }
.range-field { display: flex; flex-direction: column; gap: 3px; }
.range-field label { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.input-wrap { position: relative; }
.jump {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; border-radius: 2px;
  color: var(--ink-3); cursor: pointer;
  transition: color .12s, background .12s;
}
.jump:hover { color: var(--blue); background: var(--bg-3); }
.range-field input {
  width: 100%;
  font-family: var(--mono); font-size: 13px; color: var(--ink);
  background: var(--bg-2); border: 1px solid var(--bg-3); border-radius: var(--r);
  height: 32px; padding: 0 30px 0 9px; outline: none;
  transition: border-color .12s;
  appearance: textfield; -moz-appearance: textfield;
}
.range-field input::-webkit-inner-spin-button,
.range-field input::-webkit-outer-spin-button { -webkit-appearance: none; }
.range-field input:focus { border-color: var(--ink-3); }
.range-field input.err { border-color: var(--red); }

.rm-btn {
  background: none; border: none;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink-4); font-size: 17px;
  border-radius: var(--r); transition: color .12s, background .12s;
}
.rm-btn:hover { color: var(--red); background: #2a1a1a; }

.add-btn {
  margin-top: 8px; width: 100%;
  background: none; border: 1.5px dashed var(--bg-3); border-radius: var(--r);
  padding: 7px; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  cursor: pointer; letter-spacing: .04em; transition: border-color .12s, color .12s;
}
.add-btn:hover { border-color: var(--ink-3); color: var(--ink-2); }
.add-btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--bg-3); color: var(--ink-3); }

.actions { padding: 14px 20px; border-top: 1px solid var(--bg-3); flex-shrink: 0; }
.extract-btn {
  width: 100%; background: var(--ink); color: var(--bg);
  border: none; border-radius: var(--r);
  padding: 10px 14px;
  font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .04em;
  cursor: pointer; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.extract-btn:hover { opacity: .82; }
.extract-btn:disabled { opacity: .28; cursor: not-allowed; }
.hint { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-align: center; margin-top: 7px; min-height: 14px; }

.preview { display: flex; flex-direction: column; overflow: hidden; }
.preview-top {
  padding: 12px 20px; border-bottom: 1px solid var(--bg-3);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.preview-top .label { margin: 0; }
.preview-top-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.preview-src {
  display: none; font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.multi .preview-src { display: block; }
.preview-top-right { display: flex; align-items: center; gap: 12px; }
.legend { display: none; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue-glow); border: 1.5px solid var(--blue); }

.scale-btns { display: flex; gap: 2px; }
.scale-btn {
  background: none; border: 1px solid var(--bg-3); border-radius: 2px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  padding: 3px 7px; cursor: pointer;
  transition: border-color .12s, color .12s, background .12s;
}
.scale-btn:hover { color: var(--ink-2); border-color: var(--ink-4); }
.scale-btn.active { background: var(--bg-3); color: var(--ink); border-color: var(--bg-3); }

.combine-section { border-bottom: none; border-top: 1px solid var(--bg-3); }
.combine-section .scale-btns { gap: 3px; }
.combine-section .scale-btn { flex: 1; padding: 5px 0; }
.combine-note { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 7px; line-height: 1.5; }

.preview-grid {
  flex: 1; overflow-y: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 14px; align-content: start;
}

.empty-state {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
}
.empty-state svg { opacity: .2; }
.empty-state p { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }

.thumb { display: flex; flex-direction: column; align-items: center; gap: 5px; scroll-margin-top: 20px; }
.thumb-wrap {
  width: 100%;
  border-radius: 2px; overflow: hidden;
  outline: 2px solid transparent;
  transition: outline-color .15s, box-shadow .15s, opacity .15s;
  background: var(--bg-2);
}
.thumb-wrap.in-range { outline-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-glow); }
.thumb-wrap.out-of-range { opacity: .75; }
.thumb-wrap canvas { display: block; width: 100%; height: auto; }
.thumb-num { font-family: var(--mono); font-size: 10px; color: var(--ink-3); transition: color .12s; }
.thumb-num.in-range { color: var(--blue); font-weight: 500; }

.status {
  grid-column: 1/-1; display: none;
  align-items: center; gap: 8px; padding: 6px 20px;
  background: var(--bg-3); font-family: var(--mono); font-size: 11px; color: var(--ink);
}
.status.on { display: flex; }
.spinner {
  width: 11px; height: 11px; flex-shrink: 0;
  border: 1.5px solid var(--ink-4); border-top-color: var(--ink);
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.ranges-scroll::-webkit-scrollbar { width: 4px; }
.ranges-scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }
.ranges-scroll::-webkit-scrollbar-track { background: transparent; }

.preview-grid { scrollbar-color: var(--ink-4) transparent; }
.preview-grid::-webkit-scrollbar { width: 14px; }
.preview-grid::-webkit-scrollbar-track { background: transparent; }
.preview-grid::-webkit-scrollbar-thumb {
  background-color: var(--ink-4);
  border: 3px solid transparent;
  background-clip: padding-box;
  border-radius: 7px;
  min-height: 48px;
}
.preview-grid::-webkit-scrollbar-thumb:hover,
.preview-grid::-webkit-scrollbar-thumb:active { background-color: var(--ink-3); }
</style>
</head>
<body>
<div class="app" id="app">

  <header><h1>PDF Slicer</h1></header>

  <aside class="sidebar">
    <div class="sidebar-section" id="sec-src">
      <div class="label">Sources</div>
      <input type="file" accept=".pdf,application/pdf" id="file-input" multiple hidden>
      <div class="dropzone" id="dropzone">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        <p><strong>Drop PDFs here</strong><br>or click to browse</p>
      </div>
      <div class="src-list" id="src-list"></div>
      <button class="add-btn" id="add-src" style="display:none">+ add PDF</button>
    </div>

    <div class="ranges-scroll">
      <div class="label">Page ranges</div>
      <div class="range-list" id="range-list"></div>
      <button class="add-btn" id="add-btn" disabled>+ add range</button>
    </div>

    <div class="sidebar-section combine-section">
      <div class="label">Combine pages</div>
      <div class="scale-btns" id="nup-btns">
        <button class="scale-btn active" data-n="1">Off</button>
        <button class="scale-btn" data-n="2">2-up</button>
        <button class="scale-btn" data-n="4">4-up</button>
        <button class="scale-btn" data-n="6">6-up</button>
        <button class="scale-btn" data-n="9">9-up</button>
      </div>
      <div class="combine-note" id="combine-note"></div>
    </div>

    <div class="actions">
      <button class="extract-btn" id="extract-btn" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Extract &amp; Download
      </button>
      <div class="hint" id="hint"></div>
    </div>
  </aside>

  <div class="preview">
    <div class="preview-top">
      <div class="preview-top-left">
        <div class="label">Preview</div>
        <div class="preview-src" id="preview-src"></div>
      </div>
      <div class="preview-top-right">
        <div class="legend" id="legend"><div class="legend-dot"></div>in range</div>
        <div class="scale-btns" id="scale-btns">
          <button class="scale-btn" data-c="5">XS</button>
          <button class="scale-btn" data-c="4">S</button>
          <button class="scale-btn" data-c="3">M</button>
          <button class="scale-btn active" data-c="2">L</button>
          <button class="scale-btn" data-c="1">XL</button>
        </div>
      </div>
    </div>
    <div class="preview-grid" id="grid" style="display:none"></div>
    <div class="empty-state" id="empty">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>load a PDF to preview</p>
    </div>
  </div>

  <div class="status" id="status">
    <div class="spinner"></div>
    <span id="status-text"></span>
  </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs" integrity="sha384-+0ti2moQlmLN7WZHE2RHIf5lV8hHxhxEalN0il3YZceG26fUPyOkR0hp9daxk1i7" crossorigin="anonymous"></script>
<script type="module">
if (!globalThis.pdfjsLib || !globalThis.PDFLib) {
  document.querySelector('#empty p').textContent = "Couldn't load the PDF libraries. Check your connection and reload.";
  throw new Error('PDF libraries failed to load');
}
const { PDFDocument } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const WORKERS = 4;
const LAYOUTS = { 2: [[1, 2], [2, 1]], 4: [[2, 2]], 6: [[2, 3], [3, 2]], 9: [[3, 3]] };
const JUMP_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const FILE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

const sources = [], ranges = [];
let active = null, thumbs = [];
let gridId = 0, focusPage = 1, inflight = 0, pumpQueued = false;
const nearSet = new Set();
let cols = 2, nUp = 1;

const $ = id => document.getElementById(id);
const app = $('app'), secSrc = $('sec-src');
const dropzone = $('dropzone'), fileInput = $('file-input');
const srcList = $('src-list'), addSrcBtn = $('add-src');
const rangeList = $('range-list'), addBtn = $('add-btn');
const extractBtn = $('extract-btn'), hint = $('hint'), note = $('combine-note');
const grid = $('grid'), empty = $('empty'), legend = $('legend'), previewSrc = $('preview-src');
const statusEl = $('status'), statusTxt = $('status-text');

const menu = document.createElement('div');
menu.className = 'src-menu';
app.append(menu);
let menuFor = null;

function openMenu(r) {
  if (menuFor === r) return closeMenu();
  closeMenu();
  menuFor = r;
  menu.replaceChildren(...sources.map(src => {
    const b = document.createElement('button');
    b.className = 'src-opt' + (src === r.src ? ' current' : '');
    b.innerHTML = `<span class="tag">${src.tag}</span><span class="name"></span><span class="pages">${src.pages}p</span>`;
    b.querySelector('.name').textContent = src.name;
    b.addEventListener('click', () => { closeMenu(); setSource(r, src); });
    return b;
  }));
  const c = r.chip.getBoundingClientRect();
  menu.style.left = `${c.left}px`;
  menu.style.top = `${c.bottom + 4}px`;
  menu.classList.add('open');
  r.chip.classList.add('open');
  const m = menu.getBoundingClientRect();
  if (m.bottom > innerHeight - 8) menu.style.top = `${Math.max(8, c.top - 4 - m.height)}px`;
}

function closeMenu() {
  if (!menuFor) return;
  menuFor.chip.classList.remove('open');
  menu.classList.remove('open');
  menuFor = null;
}

document.addEventListener('pointerdown', e => {
  if (menuFor && !menu.contains(e.target) && !menuFor.chip.contains(e.target)) closeMenu();
});
window.addEventListener('resize', closeMenu);
document.querySelector('.ranges-scroll').addEventListener('scroll', closeMenu);

function setActive(groupId, btn) {
  $(groupId).querySelectorAll('.scale-btn').forEach(b => b.classList.toggle('active', b === btn));
}

$('scale-btns').addEventListener('click', async e => {
  const btn = e.target.closest('.scale-btn');
  if (!btn) return;
  setActive('scale-btns', btn);
  cols = +btn.dataset.c;
  if (!active) return;
  const target = focusPage, frac = pageFraction(target);
  buildGrid();
  restoreScroll(target, frac);
});

$('nup-btns').addEventListener('click', e => {
  const btn = e.target.closest('.scale-btn');
  if (!btn) return;
  setActive('nup-btns', btn);
  nUp = +btn.dataset.n;
  syncBtn();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && menuFor) { closeMenu(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const dir = e.key === '=' || e.key === '+' ? 1 : e.key === '-' || e.key === '_' ? -1 : 0;
  if (!dir) return;
  e.preventDefault();
  const btns = [...$('scale-btns').querySelectorAll('.scale-btn')];
  const i = btns.findIndex(b => b.classList.contains('active'));
  btns[Math.min(Math.max(i + dir, 0), btns.length - 1)].click();
});

dropzone.addEventListener('click', () => fileInput.click());
addSrcBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { loadFiles(fileInput.files); fileInput.value = ''; });

let dragDepth = 0;
document.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) secSrc.classList.add('over'); });
document.addEventListener('dragleave', () => { if (--dragDepth === 0) secSrc.classList.remove('over'); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  secSrc.classList.remove('over');
  loadFiles(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items ?? [])].filter(i => i.type === 'application/pdf').map(i => i.getAsFile());
  if (files.length) loadFiles(files);
});

function nextTag() {
  for (let i = 0; ; i++) {
    const t = i < 26 ? String.fromCharCode(65 + i) : String(i + 1);
    if (!sources.some(s => s.tag === t)) return t;
  }
}

async function loadFiles(files) {
  const pdfs = [...files].filter(f => f && (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)));
  if (!pdfs.length) return;
  showStatus('Loading…');
  let last = null;
  for (const file of pdfs) {
    try {
      const ab = await file.arrayBuffer();
      const plib = await PDFDocument.load(ab.slice(0));
      const pjs = await pdfjsLib.getDocument({ data: ab, isEvalSupported: false }).promise;
      const src = {
        tag: nextTag(), name: file.name, base: file.name.replace(/\.pdf$/i, ''),
        pjs, plib, pages: pjs.numPages, aspects: pageAspects(plib), focus: 1, frac: null
      };
      sources.push(src);
      addSourceRow(src);
      addRange(src, 1, src.pages);
      last = src;
    } catch (err) {
      const locked = /is encrypted/.test(err?.message) || err?.name === 'PasswordException';
      alert(locked
        ? `${file.name} is encrypted, so it can't be sliced. Printing it to a new PDF usually removes the encryption.`
        : `Could not load ${file.name}: ${err.message}`);
    }
  }
  clearStatus();
  syncAll();
  if (last) await show(last);
}

function pageAspects(plib) {
  return plib.getPages().map(p => {
    const b = p.getCropBox();
    const rot = ((p.getRotation().angle % 360) + 360) % 360;
    return rot % 180 ? `${b.height} / ${b.width}` : `${b.width} / ${b.height}`;
  });
}

function addSourceRow(src) {
  const row = document.createElement('div');
  row.className = 'file-info src-row';
  row.title = src.name;
  row.innerHTML = `<span class="tag">${src.tag}</span>${FILE_ICON}<span class="name"></span><span class="pages">${src.pages} page${src.pages !== 1 ? 's' : ''}</span><button class="src-rm" title="Remove">\xd7</button>`;
  row.querySelector('.name').textContent = src.name;
  row.addEventListener('click', e => { if (!e.target.closest('.src-rm')) show(src); });
  row.querySelector('.src-rm').addEventListener('click', () => removeSource(src));
  srcList.append(row);
  src.row = row;
}

function removeSource(src) {
  closeMenu();
  sources.splice(sources.indexOf(src), 1);
  src.row.remove();
  ranges.filter(r => r.src === src).forEach(removeRange);
  src.pjs.destroy();
  if (active === src) {
    active = null;
    clearGrid();
    if (sources.length) show(sources[0]);
  }
  syncAll();
}

async function show(src) {
  if (active === src) return;
  if (active && thumbs.length) {
    active.focus = focusPage;
    active.frac = pageFraction(focusPage);
  }
  active = src;
  focusPage = src.focus;
  syncAll();
  buildGrid();
  if (src.frac === null) {
    grid.scrollTop = 0;
    schedulePump();
  } else {
    restoreScroll(src.focus, src.frac);
  }
}

const nearIO = new IntersectionObserver(entries => {
  for (const e of entries) {
    const n = +e.target.dataset.n;
    if (e.isIntersecting) nearSet.add(n);
    else nearSet.delete(n);
  }
  schedulePump();
}, { root: grid, rootMargin: '100% 0px' });

const keepIO = new IntersectionObserver(entries => {
  for (const e of entries) if (!e.isIntersecting) evict(thumbs[+e.target.dataset.n]);
}, { root: grid, rootMargin: '300% 0px' });

function evict(t) {
  if (!t) return;
  t.job = null;
  t.task?.cancel();
  t.task = null;
  if (t.canvas) {
    t.canvas.width = t.canvas.height = 0;
    t.canvas = null;
    t.wrap.replaceChildren();
  }
  t.state = 0;
}

function clearGrid() {
  gridId++;
  nearIO.disconnect();
  keepIO.disconnect();
  nearSet.clear();
  thumbs.forEach(evict);
  thumbs = [];
  grid.replaceChildren();
  grid.style.display = 'none';
  empty.style.display = 'flex';
  legend.style.display = 'none';
}

function buildGrid() {
  clearGrid();
  const src = active;
  grid.style.setProperty('--cols', cols);
  const frag = document.createDocumentFragment();
  for (let n = 1; n <= src.pages; n++) {
    const th = document.createElement('div');
    const wrap = document.createElement('div');
    const lbl = document.createElement('div');
    th.className = 'thumb';
    th.dataset.n = n;
    wrap.className = 'thumb-wrap';
    wrap.style.aspectRatio = src.aspects[n - 1];
    lbl.className = 'thumb-num';
    lbl.textContent = n;
    th.append(wrap, lbl);
    frag.append(th);
    thumbs[n] = { th, wrap, lbl, state: 0, job: null, task: null, canvas: null };
  }
  empty.style.display = 'none';
  legend.style.display = 'flex';
  grid.style.display = '';
  grid.append(frag);
  thumbs.forEach(t => { nearIO.observe(t.th); keepIO.observe(t.th); });
  syncHighlights();
}

function pageFraction(n) {
  const t = thumbs[n]?.th;
  if (!t) return 0;
  const r = t.getBoundingClientRect();
  return (grid.getBoundingClientRect().top - r.top) / r.height;
}

function restoreScroll(n, frac) {
  const t = thumbs[n]?.th;
  if (!t) return;
  const r = t.getBoundingClientRect();
  grid.scrollTop += (r.top - grid.getBoundingClientRect().top) + frac * r.height;
  focusPage = n;
  schedulePump();
}

let scrollTick = false;
grid.addEventListener('scroll', () => {
  if (scrollTick || !thumbs.length) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    if (!active) return;
    const top = grid.getBoundingClientRect().top;
    let lo = 1, hi = active.pages, best = focusPage;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (!thumbs[mid]) break;
      if (thumbs[mid].th.getBoundingClientRect().bottom - top > 1) { best = mid; hi = mid - 1; }
      else lo = mid + 1;
    }
    focusPage = best;
    schedulePump();
  });
});

function jump(n, smooth = true) {
  const t = thumbs[n];
  if (!t) return;
  focusPage = n;
  t.th.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  schedulePump();
}

async function goto(r, key) {
  await show(r.src);
  if (active === r.src) jump(r[key]);
}

function schedulePump() {
  if (pumpQueued) return;
  pumpQueued = true;
  requestAnimationFrame(() => {
    pumpQueued = false;
    pump();
  });
}

function pump() {
  while (inflight < WORKERS) {
    let best = 0, bestD = Infinity;
    for (const n of nearSet) {
      if (thumbs[n]?.state !== 0) continue;
      const d = Math.abs(n - focusPage);
      if (d < bestD) { bestD = d; best = n; }
    }
    if (!best) return;
    renderOne(thumbs[best], best);
  }
}

async function renderOne(t, n) {
  const job = t.job = {};
  const doc = active.pjs;
  t.state = 1;
  inflight++;
  let canvas = null;
  try {
    const page = await doc.getPage(n);
    if (t.job !== job) return;
    const vp = page.getViewport({ scale: t.wrap.clientWidth / page.getViewport({ scale: 1 }).width });
    canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    t.task = page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
    await t.task.promise;
    if (t.job !== job) return;
    t.task = null;
    t.canvas = canvas;
    canvas = null;
    t.wrap.replaceChildren(t.canvas);
    t.state = 2;
  } catch {
    if (t.job === job) {
      t.job = null;
      t.task = null;
      t.state = 0;
    }
  } finally {
    if (canvas) canvas.width = canvas.height = 0;
    inflight--;
    schedulePump();
  }
}

function syncHighlights() {
  const sel = activePages();
  thumbs.forEach((t, n) => {
    const inR = sel.has(n);
    t.wrap.classList.toggle('in-range', inR);
    t.wrap.classList.toggle('out-of-range', !inR);
    t.lbl.classList.toggle('in-range', inR);
  });
}

function addRange(src, from, to) {
  const r = { src, from, to, inputs: [] };
  ranges.push(r);
  const row = document.createElement('div');
  row.className = 'range-row';
  r.row = row;

  const chip = document.createElement('button');
  chip.className = 'src-chip';
  r.chip = chip;
  chip.addEventListener('click', () => openMenu(r));

  const field = (text, key) => {
    const wrap = document.createElement('div');
    wrap.className = 'range-field';
    wrap.innerHTML = `<label>${text}</label><div class="input-wrap"><button class="jump" title="Show in preview">${JUMP_ICON}</button></div>`;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = 1;
    inp.value = r[key];
    inp.dataset.key = key;
    wrap.querySelector('.input-wrap').prepend(inp);
    r.inputs.push(inp);

    inp.addEventListener('focus', () => { inp.select(); show(r.src); });
    inp.addEventListener('input', () => {
      const v = parseInt(inp.value, 10);
      r[key] = Math.min(Math.max(isNaN(v) ? 1 : v, 1), r.src.pages);
      syncErrors(r);
      syncHighlights();
      syncBtn();
    });
    inp.addEventListener('blur', () => {
      inp.value = r[key];
    });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      inp.value = r[key];
      goto(r, key);
      inp.select();
    });
    wrap.querySelector('.jump').addEventListener('click', () => goto(r, key));
    return wrap;
  };

  const rm = document.createElement('button');
  rm.className = 'rm-btn';
  rm.title = 'Remove';
  rm.textContent = '\xd7';
  rm.addEventListener('click', () => {
    removeRange(r);
    syncAll();
  });

  row.append(chip, field('From', 'from'), field('To', 'to'), rm);
  rangeList.append(row);
  return r;
}

function setSource(r, src) {
  r.src = src;
  r.from = Math.min(r.from, src.pages);
  r.to = Math.min(r.to, src.pages);
  r.inputs.forEach(i => { i.value = r[i.dataset.key]; });
  syncAll();
  goto(r, 'from');
}

function removeRange(r) {
  if (menuFor === r) closeMenu();
  ranges.splice(ranges.indexOf(r), 1);
  r.row.remove();
}

addBtn.addEventListener('click', () => {
  const src = active ?? sources[0];
  if (!src) return;
  const last = ranges.filter(r => r.src === src).pop();
  const from = last ? Math.min(last.to + 1, src.pages) : 1;
  const r = addRange(src, from, src.pages);
  syncAll();
  goto(r, 'from');
});

function invalid(r) {
  return r.from < 1 || r.from > r.to || r.to > r.src.pages;
}

function syncErrors(r) {
  r.inputs.forEach(i => i.classList.toggle('err', invalid(r)));
}

function selected() {
  const out = [];
  for (const r of ranges) {
    if (invalid(r)) continue;
    for (let p = r.from; p <= r.to; p++) out.push([r.src, p]);
  }
  return out;
}

function activePages() {
  const set = new Set();
  for (const r of ranges) {
    if (r.src !== active || invalid(r)) continue;
    for (let p = r.from; p <= r.to; p++) set.add(p);
  }
  return set;
}

function syncAll() {
  const any = sources.length > 0;
  app.classList.toggle('multi', sources.length > 1);
  dropzone.style.display = any ? 'none' : '';
  addSrcBtn.style.display = any ? '' : 'none';
  addBtn.disabled = !any;
  sources.forEach(s => s.row.classList.toggle('active', s === active));
  previewSrc.textContent = active ? `${active.tag} \xb7 ${active.name}` : '';
  ranges.forEach(r => {
    r.chip.textContent = r.src.tag;
    r.chip.title = r.src.name;
    syncErrors(r);
  });
  syncHighlights();
  syncBtn();
}

function syncBtn() {
  const n = selected().length;
  extractBtn.disabled = n === 0;
  hint.textContent = n > 0 ? `${n} page${n !== 1 ? 's' : ''} selected`
                           : (sources.length ? 'no valid ranges' : '');
  if (nUp === 1) {
    note.textContent = n > 0 ? `output: ${n} sheet${n !== 1 ? 's' : ''}` : '';
  } else {
    const sheets = Math.ceil(n / nUp);
    note.textContent = n > 0
      ? `output: ${sheets} sheet${sheets !== 1 ? 's' : ''} (${nUp} pages each)`
      : `${nUp} source pages per sheet`;
  }
}

function outputName() {
  const valid = ranges.filter(r => !invalid(r));
  const seg = r => r.from === r.to ? `p${r.from}` : `p${r.from}-${r.to}`;
  const groups = [];
  for (const r of valid) {
    const g = groups[groups.length - 1];
    if (g && g.src === r.src) g.parts.push(seg(r));
    else groups.push({ src: r.src, parts: [seg(r)] });
  }
  const single = new Set(valid.map(r => r.src)).size === 1;
  const name = single
    ? `${groups[0].src.base}_${groups.flatMap(g => g.parts).join('_')}`
    : groups.map(g => `${g.src.base.slice(0, 24)}_${g.parts.join('_')}`).join('+');
  return `${name}${nUp > 1 ? `_${nUp}up` : ''}.pdf`;
}

extractBtn.addEventListener('click', async () => {
  const pages = selected();
  if (pages.length === 0) return;
  showStatus('Extracting…');
  extractBtn.disabled = true;
  try {
    const out = await PDFDocument.create();
    const bySrc = new Map();
    for (const [src, p] of pages) {
      if (!bySrc.has(src)) bySrc.set(src, []);
      bySrc.get(src).push(p - 1);
    }

    const made = new Map();
    for (const [src, idx] of bySrc) {
      if (nUp === 1) {
        made.set(src, await out.copyPages(src.plib, idx));
      } else {
        const srcPages = idx.map(i => src.plib.getPage(i));
        const boxes = srcPages.map(p => {
          const b = p.getCropBox();
          return { left: b.x, bottom: b.y, right: b.x + b.width, top: b.y + b.height };
        });
        made.set(src, await out.embedPages(srcPages, boxes));
      }
    }
    const cursor = new Map();
    const ordered = pages.map(([src]) => {
      const k = cursor.get(src) ?? 0;
      cursor.set(src, k + 1);
      return made.get(src)[k];
    });

    if (nUp === 1) {
      ordered.forEach(p => out.addPage(p));
    } else {
      const cellW = Math.max(...ordered.map(e => e.width));
      const cellH = Math.max(...ordered.map(e => e.height));
      const squareness = ([c, r]) => Math.abs(Math.log((c * cellW) / (r * cellH)));
      const [c, rws] = LAYOUTS[nUp].reduce((a, b) => squareness(b) < squareness(a) ? b : a);
      for (let i = 0; i < ordered.length; i += nUp) {
        const sheet = out.addPage([cellW * c, cellH * rws]);
        ordered.slice(i, i + nUp).forEach((emb, j) => {
          const col = j % c, row = Math.floor(j / c);
          sheet.drawPage(emb, {
            x: col * cellW + (cellW - emb.width) / 2,
            y: (rws - 1 - row) * cellH + (cellH - emb.height) / 2
          });
        });
      }
    }

    const bytes = await out.save();
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    Object.assign(document.createElement('a'), { href: url, download: outputName() }).click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (err) {
    alert('Extraction failed: ' + err.message);
  }
  clearStatus();
  syncBtn();
});

function showStatus(msg) {
  statusTxt.textContent = msg;
  statusEl.classList.add('on');
  app.style.gridTemplateRows = '57px 1fr auto';
}
function clearStatus() {
  statusEl.classList.remove('on');
  app.style.gridTemplateRows = '57px 1fr';
}

syncAll();
</script>
</body>
</html>
