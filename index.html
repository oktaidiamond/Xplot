  }
  return Math.abs(dx) <= s.w / 2 && Math.abs(dy) <= s.h / 2;
}

function imageAtPoint(wp) {
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const layer = state.layers[i];
    if (!layer.visible || !(layer.obj || layer.id === state.activeLayerId)) continue;
    for (let j = layer.strokes.length - 1; j >= 0; j--) {
      const s = layer.strokes[j];
      if (s.kind === 'image' && imageHit(s, wp)) return s;
      if (s.kind === 'shape' && layer.obj) {
        const b = shapeOutlineBounds(s), pad = 6 / state.view.scale;
        if (wp.x >= b.x - pad && wp.x <= b.x + b.w + pad && wp.y >= b.y - pad && wp.y <= b.y + b.h + pad) return s;
      }
    }
  }
  return null;
}

function selectImageForMove(img, sp, wp, e) {
  const layer = state.layers.find(l => l.strokes.includes(img)) || activeLayer();
  if (state.activeLayerId !== layer.id) { state.activeLayerId = layer.id; renderLayerList(); }
  if (state.tool !== 'select') setTool('select');
  const b = strokeBounds(img);
  state.selection = { layerId: layer.id, bbox: { x: b.x, y: b.y, w: b.w, h: b.h }, strokes: [], embeds: [], rotation: 0, scale: 1, lifted: false };
  liftSelection([img]);
  ensureSelectionOrigin();
  state.hoverImage = null;
  state.selDrag = { mode: 'move', startWx: wp.x, startWy: wp.y, startBx: state.selection.bbox.x, startBy: state.selection.bbox.y, startSx: sp.x, startSy: sp.y };
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'move';
  render();
}

function drawImageHover() {
  const img = state.hoverImage;
  if (!img || state.selection || state.shapeEdit) return;
  const hb = img.kind === 'shape' ? shapeOutlineBounds(img) : img;
  const cx = hb.x + hb.w / 2, cy = hb.y + hb.h / 2;
  const rot = (img.rot || 0) * Math.PI / 180;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const pts = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
    const dx = sx * hb.w / 2, dy = sy * hb.h / 2;
    return worldToScreen(cx + dx * cos - dy * sin, cy + dx * sin + dy * cos);
  });
  ctx.save();
  ctx.strokeStyle = '#6b8cce';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function updateImageHover(wp) {
  let img = null;
  if (!state.selection && state.tool === 'select') img = imageAtPoint(wp);
  if (img !== (state.hoverImage || null)) {
    state.hoverImage = img;
    canvas.style.cursor = img ? 'grab' : toolCursor();
    render();
  }
}

function pointInSelection(wp) {
  const sel = state.selection;
  if (!sel) return false;
  const b = sel.bbox;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const sc = sel.scale || 1;
  return wp.x >= cx - b.w*sc/2 && wp.x <= cx + b.w*sc/2 && wp.y >= cy - b.h*sc/2 && wp.y <= cy + b.h*sc/2;
}

function hitSelectionHandle(sp) {
  if (!state.selection) return null;
  const c = selectionCornersScreen();
  // Check rotate handle first (it floats above and shouldn't be eclipsed by NW/NE corners)
  const rdx = sp.x - c.rotate.x, rdy = sp.y - c.rotate.y;
  if (Math.hypot(rdx, rdy) <= HANDLE_SIZE) return 'rotate';
  for (const k of ['nw','ne','se','sw']) {
    const dx = sp.x - c[k].x, dy = sp.y - c[k].y;
    if (Math.abs(dx) <= HANDLE_SIZE && Math.abs(dy) <= HANDLE_SIZE) return k;
  }
  if (singleTextSelection()) {
    for (const k of ['e','w']) {
      if (Math.hypot(sp.x - c[k].x, sp.y - c[k].y) <= HANDLE_SIZE * 1.4) return k;
    }
  }
  return null;
}

function singleTextSelection() {
  const s = state.selection;
  if (!s || !s.lifted || s.strokes.length || s.embeds.length !== 1) return null;
  return s.embeds[0].type === 'text' ? s.embeds[0] : null;
}

function applyTextWidthDrag(side, wp) {
  const sel = state.selection;
  const em = singleTextSelection();
  if (!em) return;
  const b = sel.bbox;
  const sc = sel.scale || 1;
  const r = (sel.rotation || 0) * Math.PI / 180;
  const ux = Math.cos(r), uy = Math.sin(r), vx = -Math.sin(r), vy = Math.cos(r);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const hw = b.w * sc / 2, hh = b.h * sc / 2;
  const dir = side === 'e' ? 1 : -1;
  const ax = cx - dir * ux * hw - vx * hh;
  const ay = cy - dir * uy * hw - vy * hh;
  let wv = dir * ((wp.x - ax) * ux + (wp.y - ay) * uy);
  wv = Math.max(em.data.size * 1.5 * sc, wv);
  em.w = wv / sc;
  em.data.autoW = false;
  fitTextEmbedToContent(em);
  const hv = em.h * sc;
  const ncx = ax + dir * ux * wv / 2 + vx * hv / 2;
  const ncy = ay + dir * uy * wv / 2 + vy * hv / 2;
  b.w = em.w; b.h = em.h;
  b.x = ncx - b.w / 2; b.y = ncy - b.h / 2;
  em.x = sel._origCx - em.w / 2;
  em.y = sel._origCy - em.h / 2;
}

function commitSelection() {
  state.selDrag = null;
  const sel = state.selection;
  if (!sel) return;
  if (!sel.lifted) { cancelSelection(); return; }
  const layer = state.layers.find(l => l.id === sel.layerId) || activeLayer();
  if (!layer) { cancelSelection(); return; }
  const b = sel.bbox;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const rot = (sel.rotation || 0) * Math.PI / 180;
  const sc = sel.scale || 1;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const origCx = sel._origCx, origCy = sel._origCy;

  for (const s of sel.strokes) {
    if (s.kind === 'shape') {
      s.pts = s.pts.map(q => {
        const dx = q.x - origCx, dy = q.y - origCy;
        return { x: (dx * cos - dy * sin) * sc + cx, y: (dx * sin + dy * cos) * sc + cy };
      });
      s.width *= sc;
      s.fs *= sc;
      continue;
    }
    if (s.kind === 'image') {
      const icx = s.x + s.w/2, icy = s.y + s.h/2;
      const dx = icx - origCx, dy = icy - origCy;
      const nx = (dx * cos - dy * sin) * sc;
      const ny = (dx * sin + dy * cos) * sc;
      s.w *= sc; s.h *= sc;
      s.x = (nx + cx) - s.w/2;
      s.y = (ny + cy) - s.h/2;
      s.rot = (((s.rot || 0) + (sel.rotation || 0)) % 360 + 360) % 360;
      continue;
    }
    s.points = s.points.map(p => {
      const dx = p.x - origCx, dy = p.y - origCy;
      const nx = (dx * cos - dy * sin) * sc;
      const ny = (dx * sin + dy * cos) * sc;
      return { x: nx + cx, y: ny + cy };
    });
    s.width = s.width * sc;
  }
  layer.strokes = reinsertStrokes(layer.strokes, sel.strokes, sel.strokeIdx);
  for (const em of sel.embeds) {
    em.el && em.el.classList.remove('selected');
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const dx = ecx - origCx, dy = ecy - origCy;
    const nx = (dx * cos - dy * sin) * sc;
    const ny = (dx * sin + dy * cos) * sc;
    const newCx = nx + cx, newCy = ny + cy;
    em.w *= sc; em.h *= sc;
    em.x = newCx - em.w/2; em.y = newCy - em.h/2;
    em.rotation = (em.rotation || 0) + (sel.rotation || 0);
    // For text embeds, also scale the font size so the text grows with the box
    if (em.type === 'text' && em.data && typeof em.data.size === 'number') {
      em.data.size *= sc;
      if (em.data.maxW) em.data.maxW *= sc;
    }
    layer.embeds.push(em);
  }
  // Detect if anything actually changed (movement, rotation, scale)
  const moved = (sel.bbox.x + sel.bbox.w/2) !== sel._origCx || (sel.bbox.y + sel.bbox.h/2) !== sel._origCy;
  const transformed = (sel.rotation || 0) !== 0 || (sel.scale || 1) !== 1;
  state.selection = null;
  if (moved || transformed) pushHistory('Move/Resize');
  render();
}

function cancelSelection() {
  state.selDrag = null;
  const sel = state.selection;
  if (sel && sel.lifted) {
    const layer = state.layers.find(l => l.id === sel.layerId);
    if (layer) {
      layer.strokes = reinsertStrokes(layer.strokes, sel.strokes, sel.strokeIdx);
      for (const em of sel.embeds) { em.el && em.el.classList.remove('selected'); layer.embeds.push(em); }
    }
  }
  state.selection = null;
  render();
}

function deleteSelection() {
  state.selDrag = null;
  if (!state.selection) return;
  for (const em of state.selection.embeds) em.el && em.el.remove();
  const layer = state.layers.find(l => l.id === state.selection.layerId);
  state.selection = null;
  if (isObjectLayer(layer) && !layer.strokes.length && !layer.embeds.length && state.layers.length > 1) {
    const i = state.layers.indexOf(layer);
    state.layers.splice(i, 1);
    if (state.activeLayerId === layer.id) {
      let t = null;
      for (let j = i; j < state.layers.length && !t; j++) if (!state.layers[j].obj) t = state.layers[j];
      for (let j = i - 1; j >= 0 && !t; j--) if (!state.layers[j].obj) t = state.layers[j];
      state.activeLayerId = (t || state.layers[Math.max(0, i - 1)]).id;
    }
    renderLayerList();
  }
  pushHistory('Delete');
  render();
}

function copySelection() {
  if (!state.selection) return;
  const sel = state.selection;
  state.clipboard = {
    bbox: { ...sel.bbox },
    origCx: sel._origCx ?? (sel.bbox.x + sel.bbox.w / 2),
    origCy: sel._origCy ?? (sel.bbox.y + sel.bbox.h / 2),
    strokes: sel.strokes.map(cloneStroke),
    embedsData: sel.embeds.map(em => ({ type: em.type, x: em.x, y: em.y, w: em.w, h: em.h, rotation: em.rotation || 0, data: { ...em.data } })),
    rotation: sel.rotation || 0,
    scale: sel.scale || 1,
  };
  const src = state.layers.find(l => l.id === sel.layerId);
  if (isObjectLayer(src) && sel.strokes.length === 1 && !sel.embeds.length) state.clipboard.objName = src.name;
}

function pasteClipboard() {
  if (!state.clipboard) return;
  if (state.selection) commitSelection();
  const cb = state.clipboard;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width/2, r.height/2);
  const origCx = cb.origCx ?? (cb.bbox.x + cb.bbox.w/2);
  const origCy = cb.origCy ?? (cb.bbox.y + cb.bbox.h/2);
  const dx = center.x - origCx, dy = center.y - origCy;
  let layer;
  if (cb.objName != null) {
    const a = activeLayer();
    layer = makeLayer(cb.objName);
    layer.obj = true;
    state.layers.splice(a ? state.layers.indexOf(a) + 1 : state.layers.length, 0, layer);
    state.activeLayerId = layer.id;
    renderLayerList();
  } else layer = drawTarget();
  if (!layer) return;

  const newSel = {
    layerId: layer.id,
    bbox: { x: center.x - cb.bbox.w/2, y: center.y - cb.bbox.h/2, w: cb.bbox.w, h: cb.bbox.h },
    strokes: cb.strokes.map(s => translateStroke(s, dx, dy)),
    embeds: [],
    rotation: cb.rotation,
    scale: cb.scale,
    lifted: true,
  };
  const idMap = {};
  for (const st of newSel.strokes) {
    if (!st.graphId) continue;
    if (!(st.graphId in idMap)) {
      idMap[st.graphId] = 'A' + (nextGraphId++);
    }
    st.graphId = idMap[st.graphId];
  }
  for (const ed of cb.embedsData) {
    const em = createEmbedFromData(ed.type, { ...ed.data }, ed.x + dx, ed.y + dy, ed.w, ed.h);
    em.rotation = ed.rotation;
    em.el.classList.add('selected');
    newSel.embeds.push(em);
  }
  newSel._origCx = newSel.bbox.x + newSel.bbox.w/2;
  newSel._origCy = newSel.bbox.y + newSel.bbox.h/2;
  state.selection = newSel;
  setTool('select');
  ensureSelectionOrigin();
  render();
  pushHistory('Paste');
}

// Make sure the selection has its origin (centre) recorded — used by resize math.
function ensureSelectionOrigin() {
  const sel = state.selection; if (!sel) return;
  if (sel._origCx === undefined) {
    sel._origCx = sel.bbox.x + sel.bbox.w/2;
    sel._origCy = sel.bbox.y + sel.bbox.h/2;
  }
}

/* =========================================================================
   EMBEDS
   ========================================================================= */
let nextEmbedId = 1;
function createEmbedFromData(type, data, x, y, w, h) {
  const el = document.createElement('div');
  el.className = 'embed' + (type === 'text' ? ' text-embed' : '');
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  if (type === 'text') {
    el.style.fontFamily = "'StraightQuotes', 'KaTeX_Main', 'Latin Modern Roman', 'Computer Modern', 'CMU Serif', Georgia, serif";
    el.style.fontSize = data.size + 'px';
    el.style.color = data.color;
    el.style.lineHeight = '1.3';
    el.style.whiteSpace = 'pre-wrap';
    el.innerHTML = textToHTML(data.text, true);
    renderTextMath(el);
  }
  embedLayer.appendChild(el);
  const em = { id: 'E' + (nextEmbedId++), type, data, x, y, w, h, el, rotation: 0 };
  el.dataset.embedId = em.id;
  if (type === 'text') fitTextEmbedToContent(em);

  attachEmbedDrag(em);
  return em;
}

function attachEmbedDrag(em) {
  em.el.addEventListener('pointerdown', (e) => {
    if (gestureActive() && e.pointerId !== state.activePointerId) { e.stopPropagation(); return; }
    if (e.button !== 0) { e.stopPropagation(); canvasPointerDown(e); return; }
    state.activePointerId = e.pointerId;
    // If this embed is currently being edited inline, let the contenteditable handle the click
    if (em.el.classList.contains('editing')) return;
    if (state.tool === 'select' && state.selection && state.selection.embeds.includes(em) && hitSelectionHandle(eventScreenCoords(e))) {
      e.stopPropagation();
      canvasPointerDown(e);
      return;
    }
    // If a DIFFERENT embed is being edited, commit it first (the blur listener fires
    // exitTextEditMode). Don't proceed to drag this embed — let the user click again to act.
    const otherEditing = document.querySelector('.embed.editing');
    if (otherEditing) {
      e.stopPropagation();
      otherEditing.blur();
      return;
    }
    e.stopPropagation();
    // Special case: text tool + text embed → enter edit mode instead of selecting for transform.
    // The tool stays as 'text' while editing; exitTextEditMode switches to pen on commit, so
    // the next click after editing doesn't trigger another text placement.
    if (state.tool === 'text' && em.type === 'text') {
      if (state.selection) commitSelection();
      enterTextEditMode(em);
      return;
    }
    // If this embed is already part of the current selection, set up a move-drag against
    // that selection (don't re-lift, which would fail because the embed is no longer in any layer).
    // For text embeds: if the second click doesn't drag, treat it as a request to enter edit mode
    // (more reliable than relying on a precise double-click with pointer capture).
    if (state.selection && state.selection.embeds.includes(em)) {
      const sp = eventScreenCoords(e);
      const wp = screenToWorld(sp.x, sp.y);
      state.selDrag = {
        mode: 'move',
        startWx: wp.x, startWy: wp.y,
        startBx: state.selection.bbox.x, startBy: state.selection.bbox.y,
        startSx: sp.x, startSy: sp.y,
        editOnClick: em.type === 'text' ? em : null,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    // Clicking an embed (in any tool except text-on-text) auto-switches to select mode and lifts it as a selection,
    // so rotate/resize handles appear immediately and the user can drag to move.
    commitSelection();
    const layer = state.layers.find(l => l.embeds.includes(em));
    if (!layer) return;
    if (state.tool !== 'select') setTool('select');
    const sel = {
      layerId: layer.id,
      bbox: { x: em.x, y: em.y, w: em.w, h: em.h },
      strokes: [], embeds: [em],
      rotation: 0, scale: 1, lifted: true,
    };
    sel._origCx = em.x + em.w/2; sel._origCy = em.y + em.h/2;
    layer.embeds = layer.embeds.filter(e => e !== em);
    em.el.classList.add('selected');
    state.selection = sel;
    const sp = eventScreenCoords(e);
    const wp = screenToWorld(sp.x, sp.y);
    state.selDrag = { mode: 'move', startWx: wp.x, startWy: wp.y, startBx: sel.bbox.x, startBy: sel.bbox.y };
    canvas.setPointerCapture(e.pointerId);
    ensureSelectionOrigin(); render();
  });
  em.el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    if (em.type === 'text') {
      if (state.selection) commitSelection();
      enterTextEditMode(em);
    }
  });
}

/* =========================================================================
   INLINE TEXT EDITING
   ========================================================================= */
function placeInlineText(wx, wy) {
  const layer = drawTarget(); if (!layer) return;
  const size = state.textSize / state.view.scale;
  const w = Math.max(TEXT_BOX_DEFAULT_W, state.textSize * 8) / state.view.scale;
  const data = { text: '', size, color: state.textColor, autoW: true, maxW: w };
  const em = createEmbedFromData('text', data, wx - 0.2 * size, wy - 0.77 * size, w, 1.54 * size);
  layer.embeds.push(em);
  render();
  // Immediately enter edit mode. The tool stays as 'text' until the user commits the edit
  // (clicks outside, hits Escape, or Cmd+Enter); exitTextEditMode then switches to pen so
  // the next click doesn't place another text box.
  enterTextEditMode(em, /*isNew=*/ true);
}

// Place an image from a File or Blob at the given world coords. The natural image
// dimensions are used (scaled into world units), with a sensible cap so massive photos
// don't fill the whole canvas. The image is stored as a `kind: 'image'` stroke on its
// own dedicated layer — drawn into the canvas via the per-layer offscreen render so it
// behaves correctly with layer order, visibility, and the eraser.
function placeImageFromBlob(blob, wx, wy, into) {
  if (!blob || !blob.type || !blob.type.startsWith('image/')) return;
  const previousActiveLayerId = state.activeLayerId;
  const reader = new FileReader();
  reader.onload = () => {
    const dataURL = reader.result;
    const probe = new Image();
    probe.onload = () => {
      const naturalW = probe.naturalWidth || 200;
      const naturalH = probe.naturalHeight || 200;
      const r = wrap.getBoundingClientRect();
      const maxWorldW = (r.width * 0.6) / state.view.scale;
      const maxWorldH = (r.height * 0.6) / state.view.scale;
      let worldW = naturalW / state.view.scale;
      let worldH = naturalH / state.view.scale;
      const scale = Math.min(1, maxWorldW / worldW, maxWorldH / worldH);
      worldW *= scale;
      worldH *= scale;
      if (into) {
        commitSelection();
        const target = drawTarget();
        if (target) {
          target.strokes.push({ kind: 'image', x: wx - worldW / 2, y: wy - worldH / 2, w: worldW, h: worldH, src: dataURL });
          renderLayerList();
          render();
          pushHistory('Add image');
          return;
        }
      }
      const baseName = (blob.name || 'Image').replace(/\.[^.]+$/, '');
      const labelTrunc = baseName.length > 32 ? baseName.slice(0, 32) + '…' : baseName;
      const imageLayer = makeLayer(labelTrunc);
      imageLayer.obj = true;
      state.layers.unshift(imageLayer);
      imageLayer.strokes.push({
        kind: 'image',
        x: wx - worldW/2,
        y: wy - worldH/2,
        w: worldW, h: worldH,
        src: dataURL,
      });
      state.activeLayerId = previousActiveLayerId;
      renderLayerList();
      render();
      pushHistory('Add image');
    };
    probe.src = dataURL;
  };
  reader.readAsDataURL(blob);
}

function enterTextEditMode(em, isNew) {
  if (em._editing) return;
  em._editing = true;
  em._newEdit = !!isNew;
  em._editStartText = em.data.text || '';  // capture for change-detection on exit
  // Switch to text tool universally on entering edit mode — the toolbar reflects what
  // the user is doing (typing), and exitTextEditMode switches back to pen on commit.
  if (state.tool !== 'text') setTool('text');
  em.el.classList.add('editing');
  // Show raw source text (with no LaTeX rendering) so the user can edit it
  em.el.contentEditable = 'true';
  em.el.spellcheck = false;
  em.el.style.whiteSpace = 'pre-wrap';
  em.el.style.cursor = 'text';
  // CRITICAL: don't seed contenteditable with raw \n characters — Chromium's contenteditable
  // models lines via <br>/<div>, NOT \n in text nodes. If we put \n chars in the text node,
  // then the user inserts a new line, Chromium wraps the new content in a <div> while leaving
  // the original \n in the text node — and readRawSourceFromEl ends up counting BOTH (the \n
  // AND the implicit line from the <div>), producing one extra phantom newline.
  // Convert each \n to a <br> tag up front so the DOM uses one consistent model.
  em.el.innerHTML = textToHTML(em.data.text, false);
  // Resize the bounding box to fit the (potentially wider) raw source — switching from
  // rendered LaTeX to source can expand the text width.
  fitTextEmbedToContent(em);
  render();
  // Defer focus and caret placement until after the current click event cycle finishes,
  // otherwise the pointerup that follows pointerdown can steal focus back.
  setTimeout(() => {
    em.el.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(em.el);
    range.collapse(false);
    sel.removeAllRanges(); sel.addRange(range);
  }, 0);

  // No live LaTeX rendering — the user sees their raw source while editing and only gets
  // the rendered math when they exit the textbox (blur, Escape, or Cmd/Ctrl+Enter).
  const onInput = () => {
    em.data.text = readRawSourceFromEl(em.el);
    fitTextEmbedToContent(em);
    render();
  };
  let done = false;
  let inserting = false;
  const finish = () => {
    if (done) return;
    done = true;
    em.el.removeEventListener('input', onInput);
    em.el.removeEventListener('keydown', onKeydown);
    em.el.removeEventListener('beforeinput', onBeforeInput);
    em.el.removeEventListener('blur', onBlur);
    if (document.activeElement === em.el) em.el.blur();
    const s = window.getSelection();
    if (s) s.removeAllRanges();
    exitTextEditMode(em, isNew);
  };
  const onKeydown = (e) => {
    e.stopPropagation();
    if (e.isComposing) return;
    const fmt = { b: 'bold', i: 'italic', u: 'underline' }[e.key.toLowerCase()];
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && fmt) {
      e.preventDefault();
      document.execCommand(fmt);
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      finish();
    } else if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      inserting = true;
      document.execCommand('insertText', false, '\n');
      inserting = false;
      em.data.text = readRawSourceFromEl(em.el);
      fitTextEmbedToContent(em);
      render();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      finish();
    }
  };
  const onBeforeInput = (e) => {
    if (inserting) return;
    if (e.inputType === 'insertParagraph') {
      e.preventDefault();
      finish();
    }
  };
  const onBlur = () => finish();
  em.el.addEventListener('input', onInput);
  em.el.addEventListener('keydown', onKeydown);
  em.el.addEventListener('beforeinput', onBeforeInput);
  em.el.addEventListener('blur', onBlur);
}

// Reconstruct raw source text from an editable element. Math spans (rendered LaTeX)
// keep their original delimited source in data-math-source — use that instead of the
// visible rendered text, so we don't lose the user's actual input.
function readRawSourceFromEl(root) {
  const runs = [];
  let cur = { b: false, i: false, u: false };
  let any = false;
  const styleOf = (el) => {
    const f = { b: false, i: false, u: false };
    if (!el || el === root || !root.contains(el)) return f;
    const cs = getComputedStyle(el);
    const n = parseInt(cs.fontWeight, 10);
    f.b = (isNaN(n) ? (/bold/.test(cs.fontWeight) ? 700 : 400) : n) >= 600;
    f.i = cs.fontStyle === 'italic' || cs.fontStyle.startsWith('oblique');
    for (let a = el; a && a !== root; a = a.parentElement) {
      if ((getComputedStyle(a).textDecorationLine || '').includes('underline')) { f.u = true; break; }
    }
    return f;
  };
  const emit = (str, el) => {
    if (!str) return;
    cur = styleOf(el);
    runs.push({ t: str.replace(STYLE_MARK_RE, ''), ...cur });
    any = true;
  };
  const newline = () => { runs.push({ t: '\n', ...cur }); any = true; };
  const isBlock = (el) => el.tagName === 'DIV' || el.tagName === 'P';
  const isPlaceholderBR = (br) => {
    let blk = br.parentElement;
    while (blk && blk !== root && !isBlock(blk)) blk = blk.parentElement;
    if (!blk || blk === root) return false;
    return blk.textContent === '' && blk.querySelectorAll('br').length === 1;
  };
  const walk = (node) => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        emit(child.textContent, child.parentElement);
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.dataset && child.dataset.mathSource) emit(child.dataset.mathSource, child.parentElement);
        else if (child.tagName === 'BR') { if (!isPlaceholderBR(child)) newline(); }
        else if (isBlock(child)) { if (any) newline(); walk(child); any = true; }
        else walk(child);
      }
    }
  };
  walk(root);
  return serializeStyled(runs);
}

function exitTextEditMode(em, wasNew) {
  em._editing = false;
  em._newEdit = false;
  em.el.classList.remove('editing');
  em.el.contentEditable = 'false';
  em.el.style.cursor = 'grab';
  // Snapshot the current raw source from the DOM (reading math spans' data-math-source).
  // This is more reliable than em.data.text which might be stale if a live-render happened
  // between the last input event and blur.
  em.data.text = readRawSourceFromEl(em.el);
  const txt = plainText(em.data.text).trim();
  // If empty, delete the embed
  if (!txt) {
    const layer = state.layers.find(l => l.embeds.includes(em));
    if (layer) layer.embeds = layer.embeds.filter(x => x !== em);
    em.el.remove();
    render();
    if (!wasNew) pushHistory('Delete text');
    setTool('pen');
    return;
  }
  // Final render: full LaTeX rendering using renderMathInElement.
  //
  // Display-math delimiters (\[...\], $$...$$) render as block elements, which means the math
  // is ALWAYS on its own line — its leading edge naturally absorbs one preceding newline.
  // To get symmetric behavior on the trailing edge (so 1 trailing \n is also "absorbed"),
  // we strip ONE \n immediately after each display-math closer. We do NOT strip the leading
  // \n — the block's intrinsic line break already handles that. Result: each user-typed \n
  // adjacent to display math is invisible (absorbed), and additional \n produce visible
  // blank lines symmetrically above and below.
  em.el.innerHTML = textToHTML(em.data.text, true);
  renderTextMath(em.el);
  fitTextEmbedToContent(em);
  render();
  // Only push history if the text actually changed (or it's a new embed being added).
  // Re-opening an embed and immediately closing without changes shouldn't pollute history.
  const changed = (em.data.text !== em._editStartText);
  if (wasNew || changed) {
    pushHistory(wasNew ? 'Add text' : 'Edit text');
  }
  em._editStartText = undefined;
  // After exiting a text edit (whether the user committed changes or not), default to the
  // pen tool so the next click on the canvas isn't interpreted as another text placement.
  setTool('pen');
}

function renderTextMath(el) {
  if (!window.renderMathInElement) { restoreEscapedDollars(el); return; }
  try {
    window.renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$',  right: '$',  display: false },
      ],
      throwOnError: false,
    });
  } catch (_) {}
  restoreEscapedDollars(el);
}

function fitTextEmbedToContent(em) {
  const el = em.el;
  const size = em.data.size;
  const oldW = em.w, oldH = em.h;
  let fpx = textFontPx(size, state.view.scale);
  if (fpx < 8) fpx = 16;
  const ls = fpx / size;
  const prev = { t: el.style.transform, w: el.style.width, h: el.style.height, f: el.style.fontSize };
  el.style.transform = 'none';
  el.style.fontSize = fpx + 'px';
  if (em.data.autoW) {
    el.style.height = 'auto';
    el.style.width = 'max-content';
    const natPx = el.getBoundingClientRect().width;
    let maxW = em.data.maxW || em.w;
    if (em._editing) {
      const wr = wrap.getBoundingClientRect();
      const edge = screenToWorld(wr.width - 12, 0).x;
      if (em._newEdit && !em.rotation) {
        const lo = screenToWorld(4, 4);
        if (em.x < lo.x) em.x = lo.x;
        if (em.y < lo.y) em.y = lo.y;
        if (edge - em.x < size * 4) em.x = edge - size * 4;
      }
      const room = Math.max(size * 4, edge - em.x);
      if (room < maxW && (em._newEdit || edge - em.x >= size * 4)) {
        maxW = room;
        if (em._newEdit) em.data.maxW = room;
      }
    }
    em.w = Math.min(maxW, Math.max(size * 1.5, natPx * 1.02 / ls + size * 0.08));
  }
  el.style.width = (em.w * ls) + 'px';
  el.style.height = 'auto';
  const hPx = Math.max(el.getBoundingClientRect().height, el.scrollHeight);
  el.style.transform = prev.t; el.style.width = prev.w; el.style.height = prev.h; el.style.fontSize = prev.f;
  em.h = Math.max(hPx / ls, size * 1.54);
  if (em.rotation) {
    const rad = em.rotation * Math.PI / 180;
    const dw = (em.w - oldW) / 2, dh = (em.h - oldH) / 2;
    const sx = dw * Math.cos(rad) - dh * Math.sin(rad) - dw;
    const sy = dw * Math.sin(rad) + dh * Math.cos(rad) - dh;
    em.x += sx; em.y += sy;
  }
  refitWhenFontsReady(em);
}

function refitWhenFontsReady(em) {
  if (!document.fonts || document.fonts.status === 'loaded' || em._fontRefit) return;
  em._fontRefit = true;
  document.fonts.ready.then(() => {
    em._fontRefit = false;
    if (!em.el.isConnected || em._editing) return;
    fitTextEmbedToContent(em);
    render();
  });
}

function positionEmbeds() {
  for (const layer of state.layers) {
    for (const em of layer.embeds) {
      em.el.style.display = layer.visible ? '' : 'none';
      if (layer.visible) updateEmbedTransform(em, false);
    }
  }
  if (state.selection) {
    const sl = state.layers.find(l => l.id === state.selection.layerId);
    const vis = !sl || sl.visible;
    for (const em of state.selection.embeds) {
      em.el.style.display = vis ? '' : 'none';
      if (vis) updateEmbedTransform(em, true);
    }
  }
}

function updateEmbedTransform(em, inSel) {
  const v = state.view;
  if (em.type === 'text') {
    let left, top, fs, rot;
    if (inSel) {
      const sel = state.selection;
      const sc = sel.scale || 1;
      const rotSel = (sel.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(rotSel), sin = Math.sin(rotSel);
      const dx = em.x + em.w/2 - sel._origCx, dy = em.y + em.h/2 - sel._origCy;
      const cx = sel.bbox.x + sel.bbox.w/2 + (dx * cos - dy * sin) * sc;
      const cy = sel.bbox.y + sel.bbox.h/2 + (dx * sin + dy * cos) * sc;
      const tl = worldToScreen(cx - em.w * sc / 2, cy - em.h * sc / 2);
      left = tl.x; top = tl.y; fs = v.scale * sc;
      rot = (em.rotation || 0) + (sel.rotation || 0);
    } else {
      const tl = worldToScreen(em.x, em.y);
      left = tl.x; top = tl.y; fs = v.scale;
      rot = em.rotation || 0;
    }
    const fpx = textFontPx(em.data.size, fs);
    const ls = fpx / em.data.size;
    em.el.style.transformOrigin = '50% 50%';
    em.el.style.left = Math.round(left) + 'px';
    em.el.style.top = Math.round(top) + 'px';
    em.el.style.width = (em.w * ls) + 'px';
    em.el.style.height = (em.h * ls) + 'px';
    em.el.style.fontSize = fpx + 'px';
    em.el.style.transform = `rotate(${rot}deg)`;
    return;
  }
  if (inSel) {
    const sel = state.selection;
    const sc = sel.scale || 1;
    const rotSel = (sel.rotation || 0) * Math.PI / 180;
    const cos = Math.cos(rotSel), sin = Math.sin(rotSel);
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const dx = ecx - sel._origCx, dy = ecy - sel._origCy;
    const nx = (dx * cos - dy * sin) * sc;
    const ny = (dx * sin + dy * cos) * sc;
    const cx = sel.bbox.x + sel.bbox.w/2, cy = sel.bbox.y + sel.bbox.h/2;
    const newCx = nx + cx, newCy = ny + cy;
    const totalRot = (em.rotation || 0) + (sel.rotation || 0);
    const finalScale = v.scale * sc;
    const pxW = em.w * finalScale;
    const pxH = em.h * finalScale;
    const centerScreen = worldToScreen(newCx, newCy);
    em.el.style.transformOrigin = '50% 50%';
    // Pixel-snap position and font-size so the embed locks to whole-pixel boundaries.
    // Without snapping, embeds sub-pixel-drift relative to the canvas-drawn strokes
    // around them as zoom changes. Tradeoff: text "jumps" by 1 pixel each time zoom
    // crosses a rounding threshold instead of moving continuously — but alignment with
    // strokes is what matters for a math sketchpad.
    em.el.style.left = Math.round(centerScreen.x - pxW/2) + 'px';
    em.el.style.top  = Math.round(centerScreen.y - pxH/2) + 'px';
    em.el.style.width = pxW + 'px';
    em.el.style.height = pxH + 'px';
    em.el.style.transform = `rotate(${totalRot}deg)`;
    if (em.type === 'text') {
      em.el.style.fontSize = Math.round(em.data.size * finalScale) + 'px';
    }
  } else {
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const centerScreen = worldToScreen(ecx, ecy);
    const pxW = em.w * v.scale;
    const pxH = em.h * v.scale;
    em.el.style.transformOrigin = '50% 50%';
    em.el.style.left = Math.round(centerScreen.x - pxW/2) + 'px';
    em.el.style.top  = Math.round(centerScreen.y - pxH/2) + 'px';
    em.el.style.width = pxW + 'px';
    em.el.style.height = pxH + 'px';
    em.el.style.transform = `rotate(${em.rotation || 0}deg)`;
    if (em.type === 'text') {
      em.el.style.fontSize = Math.round(em.data.size * v.scale) + 'px';
    }
  }
}

/* =========================================================================
   IMAGE INPUT — paste, drop, and file picker
   ========================================================================= */

// Hidden file input wired to the toolbar "Image" button. Multiple selection allowed so
// users can drop several images at once.
const _imageFileInput = document.createElement('input');
_imageFileInput.type = 'file';
_imageFileInput.accept = 'image/*';
_imageFileInput.multiple = true;
_imageFileInput.style.display = 'none';
document.body.appendChild(_imageFileInput);
let imageInto = false;
_imageFileInput.addEventListener('change', () => {
  const into = imageInto;
  imageInto = false;
  const files = [..._imageFileInput.files];
  _imageFileInput.value = '';  // reset so the same file can be re-picked
  if (!files.length) return;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width/2, r.height/2);
  // Stack multiple images with a small offset so they don't fully overlap
  files.forEach((f, i) => {
    placeImageFromBlob(f, center.x + i * 20 / state.view.scale, center.y + i * 20 / state.view.scale, into);
  });
});
document.getElementById('imageUploadBtn').addEventListener('click', (e) => {
  imageInto = e.shiftKey;
  _imageFileInput.click();
});

function placePastedText(text) {
  commitSelection();
  const layer = drawTarget(); if (!layer) return;
  const r = wrap.getBoundingClientRect();
  const sc = state.view.scale;
  const size = state.textSize / sc;
  const maxW = Math.min(TEXT_BOX_DEFAULT_W, r.width * 0.7) / sc;
  const data = { text, size, color: state.textColor, autoW: true, maxW };
  const em = createEmbedFromData('text', data, 0, 0, maxW, 1.54 * size);
  const c = screenToWorld(r.width / 2, r.height / 2);
  em.x = c.x - em.w / 2;
  em.y = c.y - em.h / 2;
  layer.embeds.push(em);
  render();
  pushHistory('Paste text');
}

const CLIP_MARK = 'χplot selection';
let pasteFallbackTimer = null;

const TEXT_INPUT_TYPES = ['text', 'search', 'number', 'email', 'url', 'tel', 'password'];
function isTextField(t) {
  if (!t) return false;
  if (t.isContentEditable || t.tagName === 'TEXTAREA') return true;
  return t.tagName === 'INPUT' && TEXT_INPUT_TYPES.includes((t.type || 'text').toLowerCase());
}

document.addEventListener('copy', (e) => {
  if (isTextField(e.target) || !state.selection || !e.clipboardData) return;
  copySelection();
  e.clipboardData.setData('text/plain', CLIP_MARK);
  e.preventDefault();
});

window.addEventListener('paste', (e) => {
  if (e.target.isContentEditable) return;
  const dt = e.clipboardData;
  const hasImage = !!dt && [...dt.items].some(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (isTextField(e.target) && !hasImage) return;
  clearTimeout(pasteFallbackTimer);
  pasteFallbackTimer = null;
  const fromChiplot = !!dt && dt.getData('text/plain') === CLIP_MARK;
  if (dt && !fromChiplot) {
    for (const item of dt.items) {
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (!blob) continue;
        e.preventDefault();
        const r = wrap.getBoundingClientRect();
        const center = screenToWorld(r.width/2, r.height/2);
        placeImageFromBlob(blob, center.x, center.y);
        return;
      }
    }
    const pasted = (dt.getData('text/plain') || '').replace(/\r\n?/g, '\n').replace(/\s+$/, '');
    if (pasted.trim() && !isTextField(e.target)) {
      e.preventDefault();
      placePastedText(pasted);
      return;
    }
  }
  if (state.clipboard && (fromChiplot || !dt)) { e.preventDefault(); pasteClipboard(); }
});

// Drag-and-drop: image files dropped onto the canvas are placed where the drop happens.
// Both dragover (with preventDefault to allow drop) and drop must be handled.
wrap.addEventListener('dragover', (e) => {
  // Only show the "copy" cursor when something draggable is involved (usually files).
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  }
});
for (const type of ['dragover', 'drop']) {
  document.addEventListener(type, (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault();
  });
}
wrap.addEventListener('drop', (e) => {
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  const imageFiles = [...files].filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;
  e.preventDefault();
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);
  imageFiles.forEach((f, i) => {
    placeImageFromBlob(f, wp.x + i * 20 / state.view.scale, wp.y + i * 20 / state.view.scale, e.shiftKey);
  });
});

function mixOverPaper(hex, alpha, paper) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''), b = /^#?([0-9a-f]{6})$/i.exec(paper || state.bgColor || '');
  if (!m || !b) return null;
  const n = parseInt(m[1], 16), p = parseInt(b[1], 16);
  const mix = sh => Math.round(((n >> sh) & 255) * alpha + ((p >> sh) & 255) * (1 - alpha));
  return 'rgb(' + mix(16) + ',' + mix(8) + ',' + mix(0) + ')';
}


/* =========================================================================
   HISTORY — snapshot-based with click-to-restore
   ========================================================================= */

// Each entry: { id, label, time, snapshot }
// snapshot is a deep-clone of the relevant state needed to restore.
// state.historyIndex points at the "current" entry. Entries after it are "future" (redoable).
// We snapshot the initial state and after every meaningful action.

function snapshotState() {
  // Deep-clone layers (without DOM refs) and embeds (without DOM elements - those are recreated)
  const layers = state.layers.map(layer => ({
    id: layer.id,
    name: layer.name,
    visible: layer.visible,
    obj: !!layer.obj,
    strokes: layer.strokes.map(cloneStroke),
    embeds: layer.embeds.map(em => ({
      id: em.id,
      type: em.type,
      x: em.x, y: em.y, w: em.w, h: em.h,
      rotation: em.rotation || 0,
      data: { ...em.data },
    })),
  }));
  const sel = state.selection;
  if (sel && sel.lifted) {
    const L = layers.find(l => l.id === sel.layerId);
    if (L) {
      L.strokes = reinsertStrokes(L.strokes, sel.strokes.map(cloneStroke), sel.strokeIdx);
      L.embeds.push(...sel.embeds.map(em => ({ id: em.id, type: em.type, x: em.x, y: em.y, w: em.w, h: em.h, rotation: em.rotation || 0, data: { ...em.data } })));
    }
  }
  return {
    layers,
    activeLayerId: state.activeLayerId,
    nextLayerId,
    nextEmbedId,
    nextGraphId,
  };
}

function restoreSnapshot(snap) {
  if (state.shapeEdit) { state.shapeEdit.bar.remove(); state.shapeEdit = null; document.getElementById('shapeEditColorPop').classList.remove('on'); }
  // Tear down existing embed DOM
  for (const layer of state.layers) {
    for (const em of layer.embeds) em.el && em.el.remove();
  }
  // Cancel any selection
  if (state.selection) {
    for (const em of state.selection.embeds) em.el && em.el.remove();
  }
  state.selection = null;
  state.selDrag = null;

  // Rebuild layers with fresh embed DOM elements
  state.layers = snap.layers.map(layer => ({
    id: layer.id,
    name: layer.name,
    visible: layer.visible,
    obj: layer.obj != null ? !!layer.obj : (layer.strokes.length === 1 && (layer.strokes[0].kind === 'image' || layer.strokes[0].kind === 'shape') && !(layer.embeds || []).length),
    strokes: layer.strokes.map(cloneStroke),
    embeds: [],
  }));

  // Recreate embed DOM and attach to their layers
  for (let i = 0; i < snap.layers.length; i++) {
    const snapLayer = snap.layers[i];
    const layer = state.layers[i];
    for (const ed of snapLayer.embeds) {
      const em = createEmbedFromData(ed.type, { ...ed.data }, ed.x, ed.y, ed.w, ed.h);
      em.id = ed.id;
      em.rotation = ed.rotation;
      em.el.dataset.embedId = em.id;
      layer.embeds.push(em);
    }
  }

  state.activeLayerId = snap.activeLayerId;
  // Make sure active layer exists; fall back to last layer
  if (!state.layers.find(l => l.id === state.activeLayerId)) {
    state.activeLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
  }
  nextLayerId = snap.nextLayerId;
  nextEmbedId = snap.nextEmbedId;
  if (snap.nextGraphId) nextGraphId = snap.nextGraphId;

  renderLayerList();
  render();
}

let nextHistoryId = 1;
function pushHistory(label) {
  // If we're not at the end (because of undo), drop "future" entries
  if (state.historyIndex < state.history.length - 1) {
    state.history = state.history.slice(0, state.historyIndex + 1);
  }
  const entry = {
    id: 'H' + (nextHistoryId++),
    label,
    time: new Date(),
    snapshot: snapshotState(),
  };
  state.history.push(entry);
  // Cap at 80 entries to control memory; drop oldest
  if (state.history.length > 80) {
    state.history.shift();
  }
  state.historyIndex = state.history.length - 1;
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  restoreSnapshot(state.history[state.historyIndex].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  restoreSnapshot(state.history[state.historyIndex].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function jumpToHistory(idx) {
  if (idx < 0 || idx >= state.history.length) return;
  state.historyIndex = idx;
  restoreSnapshot(state.history[idx].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function syncUndoRedoButtons() {
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if (undoBtn) undoBtn.classList.toggle('disabled', state.historyIndex <= 0);
  if (redoBtn) redoBtn.classList.toggle('disabled', state.historyIndex >= state.history.length - 1);
}

function renderHistoryPanel() {
  const list = document.getElementById('historyList');
  if (!list) return;
  list.innerHTML = '';
  // Oldest first (top), newest at bottom
  for (let i = 0; i < state.history.length; i++) {
    const entry = state.history[i];
    const row = document.createElement('div');
    row.className = 'history-row';
    if (i === state.historyIndex) row.classList.add('current');
    if (i > state.historyIndex) row.classList.add('future');
    const marker = document.createElement('span');
    marker.className = 'history-marker';
    row.appendChild(marker);
    const text = document.createElement('span');
    text.className = 'history-text';
    text.textContent = entry.label;
    row.appendChild(text);
    row.onclick = () => jumpToHistory(i);
    list.appendChild(row);
  }

/* =========================================================================
   ZOOM SLIDER — log scale between min and max zoom
   ========================================================================= */
const ZOOM_MIN = 0.01, ZOOM_MAX = 40;

function zoomToSlider(scale) {
  // log scale: slider value 0..1000 maps to log(ZOOM_MIN)..log(ZOOM_MAX)
  const logMin = Math.log(ZOOM_MIN), logMax = Math.log(ZOOM_MAX);
  const t = (Math.log(scale) - logMin) / (logMax - logMin);
  return Math.max(0, Math.min(1000, Math.round(t * 1000)));
}
function sliderToZoom(value) {
  const logMin = Math.log(ZOOM_MIN), logMax = Math.log(ZOOM_MAX);
  const t = value / 1000;
  return Math.exp(logMin + t * (logMax - logMin));
}
function syncZoomSlider() {
  const slider = document.getElementById('zoomSlider');
  if (!slider) return;
  const v = zoomToSlider(state.view.scale);
  slider.value = v;
  // Update fill via CSS variable
  const pct = (v / 1000) * 100;
  slider.style.setProperty('--zoom-fill', pct + '%');
}
document.getElementById('zoomSlider').addEventListener('input', e => {
  const newScale = sliderToZoom(parseFloat(e.target.value));
  // Zoom around viewport center
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wp0 = screenToWorld(cx, cy);
  state.view.scale = newScale;
  const wp1 = screenToWorld(cx, cy);
  state.view.x += wp0.x - wp1.x;
  state.view.y += wp0.y - wp1.y;
  // Update fill
  const pct = (parseFloat(e.target.value) / 1000) * 100;
  e.target.style.setProperty('--zoom-fill', pct + '%');
  render();
});

// Zoom readout as a text input: click to type a percentage directly. Parses "150", "150%",
// or "1.5" (treated as 150%) and clamps to the zoom range. Enter commits, Escape reverts.
(function setupZoomReadoutInput() {
  const zoomEl = document.getElementById('zoomReadout');
  if (!zoomEl) return;
  const commit = () => {
    const typed = zoomEl.value.trim();
    if (typed === zoomEl.dataset.orig) { render(); return; }
    const raw = typed.replace(/%/g, '');
    let n = parseFloat(raw);
    if (!isFinite(n) || n <= 0) {
      // Reset to current on invalid input
      zoomEl.value = Math.round(state.view.scale * 100) + '%';
      return;
    }
    // Under 4 → treated as a direct multiplier (e.g. "1.5" → 150%); otherwise as a percentage.
    const targetScale = n < 4 && !/%$/.test(typed) ? n : n / 100;
    const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetScale));
    // Zoom around viewport center so the change stays visually anchored.
    const r = wrap.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wp0 = screenToWorld(cx, cy);
    state.view.scale = clamped;
    const wp1 = screenToWorld(cx, cy);
    state.view.x += wp0.x - wp1.x;
    state.view.y += wp0.y - wp1.y;
    render();  // triggers re-sync of the readout
  };
  zoomEl.addEventListener('focus', () => {
    // Show plain number without % on focus so typing is easier
    zoomEl.value = Math.round(state.view.scale * 100);
    zoomEl.dataset.orig = zoomEl.value;
    zoomEl.select();
  });
  zoomEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); zoomEl.blur(); }
    else if (e.key === 'Escape') {
      // Restore without applying, then blur
      zoomEl.value = zoomEl.dataset.orig;
      zoomEl.blur();
    }
  });
  zoomEl.addEventListener('blur', commit);
})();

(function setupTooltips() {
  const tip = document.createElement('div');
  tip.className = 'ui-tip';
  document.body.appendChild(tip);
  let target = null, timer = null;
  const hide = () => { clearTimeout(timer); timer = null; target = null; tip.classList.remove('show'); };
  const place = (el) => {
    const r = el.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let top = r.bottom + 6;
    if (top + tr.height > window.innerHeight - 4) top = r.top - 6 - tr.height;
    const left = Math.max(4, Math.min(window.innerWidth - tr.width - 4, r.left + r.width / 2 - tr.width / 2));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };
  document.addEventListener('mouseover', (e) => {
    if (e.buttons) { hide(); return; }
    const el = e.target.closest && e.target.closest('[title], [data-tip]');
    if (el && el.hasAttribute('title')) {
      el.dataset.tip = el.getAttribute('title');
      el.removeAttribute('title');
    }
    if (el === target) return;
    hide();
    if (!el || !el.dataset.tip) return;
    target = el;
    timer = setTimeout(() => {
      if (target !== el || !el.isConnected) return;
      tip.textContent = el.dataset.tip;
      place(el);
      tip.classList.add('show');
    }, 350);
  });
  document.addEventListener('mousedown', hide, true);
  document.addEventListener('keydown', hide, true);
  document.addEventListener('wheel', hide, { passive: true, capture: true });
  document.documentElement.addEventListener('mouseleave', hide);
  window.addEventListener('blur', hide);
})();

   KEYBOARD
   ========================================================================= */
document.addEventListener('keydown', (e) => {
  if (dz) return;
  if (state.shapeEdit && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
    if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); finishShapeEdit(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); deleteEditedShape(); return; }
    if (['Shift', 'Meta', 'Control', 'Alt'].includes(e.key)) return;
    finishShapeEdit();
  }
  // Escape closes any open modal regardless of focus context
  if (e.key === 'Escape') {
    const confirmM = document.getElementById('confirmModal');
    if (confirmM.style.display !== 'none') {
      confirmM.style.display = 'none';
      _confirmCallback = null;
      return;
    }
    if (state.selection) { cancelSelection(); return; }
  }

  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if (document.getElementById('confirmModal').style.display !== 'none') return;

  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); redo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'a') {
    if (e.target.isContentEditable) return;
    e.preventDefault();
    selectAllInLayer();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c') {
    if (e.target.isContentEditable || !state.selection) return;
    copySelection();
    try { navigator.clipboard.writeText(CLIP_MARK).catch(() => {}); } catch (_) {}
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v') {
    if (e.target.isContentEditable) return;
    clearTimeout(pasteFallbackTimer);
    pasteFallbackTimer = setTimeout(() => { pasteFallbackTimer = null; pasteClipboard(); }, 60);
    return;
  }

  if (e.key === 'Backspace' || e.key === 'Delete') {
    if (state.selection) { e.preventDefault(); deleteSelection(); }
    return;
  }
  if (e.key === 'Enter') { if (state.selection) { e.preventDefault(); commitSelection(); } return; }

  // Tool hotkeys (letters and digits)
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l') { document.getElementById('sizeLockBtn').click(); return; }
  if (k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 's') setTool('select');
  else if (k === 't') setTool('text');
  else if (k === '1' || e.code === 'Digit1') { e.preventDefault(); graphInto = e.shiftKey; setTool('graph'); }
  else if (k === '2' || e.code === 'Digit2') { if (shapePopOpen) closeShapePop(); else openShapePop(e.shiftKey); }
  else if (k === 'i') { imageInto = e.shiftKey; _imageFileInput.click(); }
  else if (k === 'c') { e.preventDefault(); toggleCalc(); }
});

function applyBoard(data, label, freshHistory) {
  if (!data || !data.snapshot || !Array.isArray(data.snapshot.layers) || !data.snapshot.layers.length) {
    throw new Error('not a board file');
  }
  if (document.querySelector('.embed.editing')) document.querySelector('.embed.editing').blur();
  restoreSnapshot(data.snapshot);
  const v = data.view;
  if (v && isFinite(v.scale) && v.scale > 0) state.view = { x: +v.x || 0, y: +v.y || 0, scale: Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +v.scale)) };

function snapScale(w, h) {

async function canvasOnlyBlob(withText) {

  const out = document.createElement('canvas');
  out.width = Math.round(r.width * sc);
  out.height = Math.round(r.height * sc);
  const oc = out.getContext('2d');
  oc.drawImage(canvas, 0, 0, out.width, out.height);

    try {
      const top = await html2canvas(embedLayer, { backgroundColor: null, scale: sc, logging: false, useCORS: true, width: r.width, height: r.height });
      oc.drawImage(top, 0, 0, out.width, out.height);

}

function dzGraphRect(d) {

function desmosAtPoint(wp) {

function dzFitExpand(d) {

    const g = d.calc ? dzGraphRect(d) : { width: hw, height: hh };
    const exW = hw - g.width, exH = hh - g.height;
    let gw = Math.min(maxW - exW, (maxH - exH) * a);
    let gh = gw / a;
    if (gh < 320 && maxH - exH >= 320) { gh = 320; gw = Math.min(maxW - exW, Math.max(gw, 320 * a)); }
    hw = Math.round(gw + exW);
    hh = Math.round(gh + exH);
  }
  d.host.style.width = hw + 'px';
  d.host.style.height = hh + 'px';
  if (d.calc) d.calc.resize();
  const total = hh + DZ_HEAD_H;
  let top = Math.round((window.innerHeight - total) / 2);
  if (d.calc && d.anchorTop != null) top = Math.max(12, Math.min(d.anchorTop, window.innerHeight - total - 12));
  if (d.calc && d.anchorTop == null) d.anchorTop = top;

  img.style.width = r.width + 'px';
  img.style.height = r.height + 'px';
  img.style.transform = rot ? 'rotate(' + rot + 'deg)' : 'rotate(0deg)';
}

function dzTypeLabel(d) {
  const el = document.createElement('span');
  el.className = 'dz-tab active dz-type';
  el.textContent = DZ_TYPES[d.type].label;
  return el;
}

function dzBuildPanel(d) {
  const back = document.createElement('div');
  back.className = 'dz-backdrop';
  back.addEventListener('pointerdown', (e) => { if (e.target === back) closeDesmosEditor(); });
  const panel = document.createElement('div');
  panel.className = 'dz-panel';
  const head = document.createElement('div');
  head.className = 'dz-head';
  if (d.isNew) dzBuildTabs(d, head); else head.appendChild(dzTypeLabel(d));
  const spacer = document.createElement('div');
  spacer.className = 'dz-spacer';
  head.appendChild(spacer);
  dzBuildOptions(d, head);
  if (!d.s.rot) head.appendChild(dzIconButton(DZ_COLLAPSE_ICON, 'Back to canvas', () => dzCollapseToInPlace(d), 'dz-collapse'));
  head.appendChild(dzDoneButton());
  panel.appendChild(head);
  document.body.appendChild(back);
  document.body.appendChild(panel);
  Object.assign(d, { back, panel });
}

function dzBuildBar(d) {
  const bar = document.createElement('div');
  bar.className = 'dz-floatbar';
  if (d.isNew) dzBuildTabs(d, bar); else bar.appendChild(dzTypeLabel(d));
  bar.appendChild(Object.assign(document.createElement('span'), { className: 'bar-divider' }));
  dzBuildOptions(d, bar);
  bar.appendChild(dzIconButton(DZ_EXPAND_ICON, 'Expand', () => dzExpandFromInPlace(d), 'dz-expand'));
  bar.appendChild(dzDoneButton());
  document.body.appendChild(bar);
  d.bar = bar;
}

function dzOpenExpand(d) {
  dzBuildPanel(d);
  const { back, panel } = d;
  const host = document.createElement('div');
  host.className = 'dz-host desmos-host hidden';
  panel.appendChild(host);
  d.host = host;
  dzFitExpand(d);

  const from = dzScreenRect(d.s);
  const fly = document.createElement('img');
  fly.className = 'dz-fly';
  fly.src = d.s.src;
  fly.style.transition = 'none';
  dzPlaceFly(fly, from, d.s.rot || 0);
  if (d.isNew) fly.style.opacity = '0';
  document.body.appendChild(fly);
  d.fly = fly;
  d.s._dzHidden = true;
  render();

  const mounted = dzMountCalc(d).then(ok => {
    if (!ok) return false;
    dzFitExpand(d);
    dzApplyBounds(d);
    return dzWhenReady(d.calc).then(() => true);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    back.classList.add('on');
    panel.classList.add('on');
    fly.style.transition = '';
    if (d.isNew) fly.style.opacity = '1';
    dzPlaceFly(fly, dzTargetBox(d), 0);
  }));

  const flown = new Promise(res => setTimeout(res, 320));
  Promise.all([mounted, flown]).then(([ok]) => {
    if (dz !== d || !ok) return;
    dzPlaceFly(fly, dzTargetBox(d), 0);
    host.classList.remove('hidden');
    if (d.isNew && typeof d.calc.focusFirstExpression === 'function') d.calc.focusFirstExpression();
    requestAnimationFrame(() => {
      fly.style.opacity = '0';
      setTimeout(() => { if (d.fly === fly) { fly.remove(); d.fly = null; } }, 200);
    });
    d.ready = true;
  }).catch(err => { if (dz === d) { if (fly) fly.remove(); d.fly = null; dzShowError(d, err); } });
}

function dzCloseExpand(d, result) {
  const { back, panel, host } = d;
  const target = result.removed ? null : dzScreenRect(d.s);
  const fly = d.fly || document.createElement('img');
  fly.className = 'dz-fly';
  fly.style.transition = 'none';
  if (result.src) fly.src = result.src;
  if (!d.fly) { dzPlaceFly(fly, dzTargetBox(d), 0); document.body.appendChild(fly); }
  fly.style.opacity = '1';
  host.classList.add('hidden');
  const finish = () => {
    fly.remove();
    back.remove();
    panel.remove();
    if (d.calc) d.calc.destroy();
    dzFinish(d, result);
  };
  requestAnimationFrame(() => requestAnimationFrame(() => {
    back.classList.remove('on');
    panel.classList.remove('on');
    fly.style.transition = '';
    if (target) dzPlaceFly(fly, target, d.s.rot || 0); else fly.style.opacity = '0';
    setTimeout(finish, 320);
  }));
}

/* ---- In-place mode ---- */

function dzFitInPlace(d) {
  const r = dzScreenRect(d.s);
  let offL = d.offL != null ? d.offL : 300, offT = d.offT || 0;
  let hw = d.hw || r.width + offL, hh = d.hh || r.height;
  for (let i = 0; i < 4; i++) {
    d.host.style.left = (r.left - offL) + 'px';
    d.host.style.top = (r.top - offT) + 'px';
    d.host.style.width = hw + 'px';
    d.host.style.height = hh + 'px';
    if (!d.calc) break;
    d.calc.resize();
    const g = dzGraphRect(d);
    offL = g.left;
    offT = g.top;
    hw = Math.round(hw + (r.width - g.width));
    hh = Math.round(hh + (r.height - g.height));
  }
  d.host.style.left = (r.left - offL) + 'px';
  d.host.style.top = (r.top - offT) + 'px';
  d.host.style.width = hw + 'px';
  d.host.style.height = hh + 'px';
  if (d.calc) d.calc.resize();
  Object.assign(d, { offL, offT, hw, hh, rectW: r.width, rectH: r.height });
  dzPlaceBar(d, r);
}

function dzMakeRoom(d) {
  const wr = wrap.getBoundingClientRect();
  const r = dzScreenRect(d.s);
  const bh = (d.bar && d.bar.offsetHeight) || 38;
  const L = r.left - d.offL, T = r.top - d.offT;
  let dx = 0, dy = 0;
  if (L + d.hw > wr.right - 8) dx = wr.right - 8 - (L + d.hw);
  if (L + dx < wr.left + 8) dx = wr.left + 8 - L;
  if (T + d.hh > wr.bottom - 8) dy = wr.bottom - 8 - (T + d.hh);
  if (T - bh - 16 + dy < wr.top) dy = wr.top + bh + 16 - T;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return Promise.resolve();
  const vx = state.view.x, vy = state.view.y, k = state.view.scale;
  const t0 = performance.now(), dur = 260;
  return new Promise(res => {
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      state.view.x = vx - dx * e / k;
      state.view.y = vy - dy * e / k;
      render();
      dzRepositionInPlace();
      if (t < 1 && dz === d) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function dzPlaceBar(d, r) {
  if (!d.bar) return;
  const wr = wrap.getBoundingClientRect();
  const bw = d.bar.offsetWidth || 260, bh = d.bar.offsetHeight || 38;
  const left = Math.max(wr.left + 8, Math.min(wr.right - bw - 8, r.left - d.offL));
  const top = Math.max(wr.top + 8, Math.min(wr.bottom - bh - 8, r.top - d.offT - bh - 8));
  d.bar.style.left = left + 'px';
  d.bar.style.top = top + 'px';
}

function dzClipToGraph(d) {
  const g = d.calc ? dzGraphRect(d) : { left: d.offL || 0, top: d.offT || 0, width: d.rectW, height: d.rectH };
  const hw = d.hw, hh = d.hh;
  return 'inset(' + g.top + 'px ' + (hw - g.left - g.width) + 'px ' + (hh - g.top - g.height) + 'px ' + g.left + 'px)';
}

function dzOpenInPlace(d) {
  const host = document.createElement('div');
  host.className = 'dz-inplace desmos-host hidden';
  document.body.appendChild(host);
  d.host = host;
  dzBuildBar(d);
  const bar = d.bar;
  dzFitInPlace(d);
  dzMountCalc(d).then(ok => {
    if (!ok) return;
    dzFitInPlace(d);
    dzApplyBounds(d);
    return dzWhenReady(d.calc).then(() => dzMakeRoom(d)).then(() => {
      if (dz !== d) return;
      host.style.transition = 'none';
      host.style.clipPath = dzClipToGraph(d);
      host.classList.remove('hidden');
      d.s._dzHidden = true;
      render();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        host.style.transition = '';
        host.style.clipPath = 'inset(0px)';
        bar.classList.add('on');
        if (d.isNew && typeof d.calc.focusFirstExpression === 'function') d.calc.focusFirstExpression();
      }));
      d.ready = true;
    });
  }).catch(err => {
    if (dz !== d) return;
    host.style.width = Math.max(d.hw, 360) + 'px';
    host.style.height = Math.max(d.hh, 120) + 'px';
    host.style.clipPath = '';
    bar.classList.add('on');
    dzShowError(d, err);
  });
}

function dzRepositionInPlace() {
  const d = dz;
  if (!d || d.mode !== 'inplace' || d.closing || d.offL == null) return;
  const r = dzScreenRect(d.s);
  if (Math.abs(r.width - d.rectW) > 0.5 || Math.abs(r.height - d.rectH) > 0.5) {
    if (!d.calc) { dzFitInPlace(d); return; }
    const b = dzReadBounds(d);
    dzFitInPlace(d);
    if (b && d.type === '2d') d.calc.setMathBounds(b);
    return;
  }
  d.host.style.left = (r.left - d.offL) + 'px';
  d.host.style.top = (r.top - d.offT) + 'px';
  dzPlaceBar(d, r);
}

function dzCloseInPlace(d, result) {
  d.bar.classList.remove('on');
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    if (d.calc) d.calc.destroy();
    d.host.remove();
    d.bar.remove();
    dzFinish(d, result);
  };
  if (result.removed || !d.calc) { d.host.style.transition = 'opacity 0.16s ease'; d.host.classList.add('hidden'); setTimeout(finish, 170); return; }
  d.host.style.clipPath = dzClipToGraph(d);
  setTimeout(() => {
    if (result.src) { d.s.src = result.src; delete d.s._img; }
    d.s._dzHidden = false;
    render();
    const img = d.s._img;
    const swap = () => requestAnimationFrame(finish);
    if (img && !img.complete) { img.addEventListener('load', swap, { once: true }); setTimeout(swap, 400); } else swap();
  }, 230);
}

function dzExpandFromInPlace(d) {
  if (!d.calc || !d.ready || d.mode !== 'inplace' || d.closing) return;
  const view = dzReadBounds(d);
  if (d.bar) { d.bar.remove(); d.bar = null; }
  dzBuildPanel(d);
  const host = d.host;
  host.className = 'dz-host desmos-host';
  host.removeAttribute('style');
  d.panel.appendChild(host);
  d.mode = 'expand';
  d.anchorTop = null;
  dzFitExpand(d);
  dzApplyBounds(d, view);
  d.s._dzHidden = false;
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => { d.back.classList.add('on'); d.panel.classList.add('on'); }));
}

function dzCollapseToInPlace(d) {
  if (!d.calc || !d.ready || d.mode !== 'expand' || d.closing || d.s.rot) return;
  const view = dzReadBounds(d);
  const { back, panel, host } = d;
  host.className = 'dz-inplace desmos-host';
  host.removeAttribute('style');
  document.body.appendChild(host);
  d.mode = 'inplace';
  d.offL = d.offT = d.hw = d.hh = null;
  d.s._dzHidden = true;
  render();
  dzFitInPlace(d);
  dzApplyBounds(d, view);
  dzBuildBar(d);
  dzFitInPlace(d);
  back.classList.remove('on');
  panel.classList.remove('on');
  setTimeout(() => { back.remove(); panel.remove(); }, 220);
  d.back = d.panel = null;
  requestAnimationFrame(() => requestAnimationFrame(() => d.bar && d.bar.classList.add('on')));
}

/* ---- Close / finish ---- */

function closeDesmosEditor() {
  const d = dz;
  if (!d || d.closing) return;
  d.closing = true;
  const done = (result) => (d.mode === 'expand' ? dzCloseExpand : dzCloseInPlace)(d, result);
  if (!d.calc || !d.ready || d.failed) {
    done({ removed: d.isNew, unchanged: !d.isNew });
    return;
  }
  const st = d.calc.getState();
  if (d.isNew && dzIsEmpty(st)) { done({ removed: true }); return; }
  const bounds = dzReadBounds(d);
  const px = dzPx(d.s);
  dzCapture(d.calc, d.type, d.s, bounds, px).then(src => {
    done({ src, state: st, bounds, playing: dzIsPlaying(st), px });
  });
}

function dzStateKey(st) {
  if (!st || !st.graph) return JSON.stringify(st);
  const graph = { ...st.graph };
  delete graph.viewport;
  return JSON.stringify({ ...st, graph });
}

function dzSameBounds(a, b) {
  if (!a || !b) return a === b;
  const tol = 1e-6 * Math.max(1, Math.abs(b.right - b.left), Math.abs(b.top - b.bottom));
  return ['left', 'right', 'top', 'bottom'].every(k => Math.abs(a[k] - b[k]) <= tol);
}

function dzFinish(d, result) {
  const s = d.s;
  const layer = dzLayerOf(s);
  dz = null;
  canvas.style.cursor = toolCursor();
  if (result.removed) {
    if (layer) {
      layer.strokes = layer.strokes.filter(x => x !== s);
      if (d.isNew && layer.obj && !layer.strokes.length && !layer.embeds.length) {
        state.layers = state.layers.filter(l => l !== layer);
        if (state.activeLayerId === layer.id) state.activeLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
      }
    }
    renderLayerList();
    render();
    return;
  }
  s._dzHidden = false;
  const settingsChanged = d.live !== !!s.desmos.live;
  if (!result.unchanged && !d.isNew && s.desmos.state && dzStateKey(result.state) === dzStateKey(s.desmos.state) && dzSameBounds(result.bounds, s.desmos.bounds)) result.unchanged = true;
  if (!result.unchanged) {
    if (result.src) { s.src = result.src; delete s._img; }
    s.desmos = { type: d.type, state: result.state, bounds: result.bounds, playing: !!result.playing, live: d.live, px: result.px };
    if (layer && layer.obj && dzDefaultName(layer.name)) layer.name = DZ_TYPES[d.type].layer;
  } else if (settingsChanged && s.desmos.state) {
    s.desmos = { ...s.desmos, live: d.live };
  }
  renderLayerList();
  render();
  if (!result.unchanged) pushHistory(d.isNew ? 'Add Desmos graph' : 'Edit Desmos graph');
  else if (settingsChanged && s.desmos.state) pushHistory('Graph settings');
}

document.addEventListener('keydown', (e) => {
  if (!dz || e.key !== 'Escape') return;
  e.preventDefault();
  e.stopPropagation();
  closeDesmosEditor();
}, true);

let dzSwallowClick = false;
function dzOwnsTarget(t) {
  return !!(t && t.closest && t.closest('.dz-inplace, .dz-floatbar, .dz-panel, #copyImgBtn, #snapPop, [class^="dcg-"], [class*=" dcg-"]'));
}
document.addEventListener('pointerdown', (e) => {
  if (!dz || dzOwnsTarget(e.target)) return;
  e.preventDefault();
  e.stopPropagation();
  dzSwallowClick = true;
  setTimeout(() => { dzSwallowClick = false; }, 400);
  closeDesmosEditor();
}, true);
for (const type of ['mousedown', 'mouseup', 'click', 'dblclick']) {
  document.addEventListener(type, (e) => {
    if (!dzSwallowClick && !(dz && !dzOwnsTarget(e.target))) return;
    e.preventDefault();
    e.stopPropagation();
  }, true);
}

window.addEventListener('resize', () => {
  if (!dz || dz.closing) return;
  if (dz.mode === 'expand') { dz.anchorTop = null; dzFitExpand(dz); dzApplyBounds(dz); } else dzRepositionInPlace();
});

/* ---- Live overlays for playing graphs ---- */

function syncDesmosOverlays() {
  dzRepositionInPlace();
  const want = new Set();
  if (window.Desmos && window.Desmos.GraphingCalculator) {
    const r = wrap.getBoundingClientRect();
    for (const layer of state.layers) {
      if (!layer.visible) continue;
      for (const s of layer.strokes) {
        if (s.kind !== 'image' || !s.desmos || !s.desmos.live || !s.desmos.state || s._dzHidden) continue;
        if (!dzTypeAvailable(s.desmos.type || '2d')) continue;
        const b = strokeBounds(s);
        const p0 = worldToScreen(b.x, b.y), p1 = worldToScreen(b.x + b.w, b.y + b.h);
        if (p1.x < 0 || p1.y < 0 || p0.x > r.width || p0.y > r.height) continue;
        want.add(s);
      }
    }
  }
  for (const [s, o] of dzLive) {
    if (!want.has(s) || o.src !== s.src) {
      try { o.calc.destroy(); } catch (_) {}
      o.host.remove();
      dzLive.delete(s);
    }
  }
  for (const s of want) {
    let o = dzLive.get(s);
    if (!o) {
      const host = document.createElement('div');
      host.className = 'dz-live';
      const lp = dzLivePx(s);
      host.style.width = lp.w + 'px';
      host.style.height = lp.h + 'px';
      document.body.appendChild(host);
      const type = s.desmos.type || '2d';
      const calc = dzMakeCalc(type, host, false);
      try { calc.setState(s.desmos.state); } catch (_) {}
      o = { host, calc, type, src: s.src, w: lp.w, h: lp.h, ready: false, playing: dzIsPlaying(s.desmos.state), img: null, pending: false, shotAt: 0 };
      dzLive.set(s, o);
      if (type === '2d' && s.desmos.bounds) { try { calc.setMathBounds(s.desmos.bounds); } catch (_) {} }
      dzWhenReady(calc).then(() => {
        if (dzLive.get(s) !== o) return;
        o.ready = true;
        if (o.type === '3d') dzLiveShot(s, o);
        render();
        if (o.playing) dzStartTick();
      });
    }
    const lp2 = dzLivePx(s);
    if (o.w !== lp2.w || o.h !== lp2.h) {
      o.host.style.width = lp2.w + 'px';
      o.host.style.height = lp2.h + 'px';
      o.w = lp2.w; o.h = lp2.h;
      try { o.calc.resize(); if ((s.desmos.type || '2d') === '2d' && s.desmos.bounds) o.calc.setMathBounds(s.desmos.bounds); } catch (_) {}
      if (o.type === '3d' && o.ready) dzLiveShot(s, o);
    }
  }
}

function dzLiveShot(s, o) {
  if (o.pending) return;
  o.shotAt = performance.now();
  let src;
  const lp = dzLivePx(s);
  try { src = o.calc.screenshot({ width: lp.w, height: lp.h, targetPixelRatio: Math.min(2, window.devicePixelRatio || 1) }); } catch (_) { return; }
  if (!src) return;
  o.pending = true;
  const im = new Image();
  im.onload = im.onerror = () => { o.pending = false; if (dzLive.get(s) === o && im.naturalWidth) { o.img = im; render(); } };
  im.src = src;
}

function dzLiveCanvas(s) {
  const o = dzLive.get(s);
  if (!o || !o.ready) return null;
  if (o.type === '3d') return o.img;
  let best = null, area = 0;
  for (const cv of o.host.querySelectorAll('canvas')) {
    if (cv.width * cv.height > area) { area = cv.width * cv.height; best = cv; }
  }
  return best;
}

let dzTicking = false;
function dzStartTick() {
  if (dzTicking) return;
  dzTicking = true;
  const tick = () => {
    let any = false;
    for (const [s, o] of dzLive) {
      if (!o.ready || !o.playing) continue;
      any = true;
      if (o.type === '3d' && performance.now() - o.shotAt > 80) dzLiveShot(s, o);
    }
    if (!any) { dzTicking = false; return; }
    render();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}


const SIDE_DEFAULT_W = 220;
function setSideWidth(w, save) {
  const v = Math.round(Math.max(180, Math.min(520, w)));
  document.documentElement.style.setProperty('--side-w', v + 'px');
  if (save) { try { localStorage.setItem('chiplot-side-w', String(v)); } catch (_) {} }
  resizeCanvas();
}
(function () {
  const bar = document.getElementById('sideResizer');
  const panel = document.querySelector('.side-panel');
  try { const w = parseFloat(localStorage.getItem('chiplot-side-w')); if (w) document.documentElement.style.setProperty('--side-w', Math.round(Math.max(180, Math.min(520, w))) + 'px'); } catch (_) {}
  let start = null;
  bar.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    start = { x: e.clientX, w: panel.getBoundingClientRect().width };
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging');
    hideLayerPreview();
  });
  bar.addEventListener('pointermove', (e) => {
    if (!start) return;
    setSideWidth(start.w + e.clientX - start.x, false);
  });
  const end = () => {
    if (!start) return;
    start = null;
    bar.classList.remove('dragging');
    setSideWidth(panel.getBoundingClientRect().width, true);
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  bar.addEventListener('dblclick', () => {
    setSideWidth(SIDE_DEFAULT_W, false);
    try { localStorage.removeItem('chiplot-side-w'); } catch (_) {}
  });
})();
