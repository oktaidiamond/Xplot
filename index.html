const LAYER_SHAPE_ICON = SI('<path d="M3 16 L11 16 L7 8 Z"/><circle cx="13.5" cy="7.5" r="4"/>');

const vAdd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const vSub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const vMul = (a, k) => ({ x: a.x * k, y: a.y * k });
const vLen = (a) => Math.hypot(a.x, a.y);
const vDot = (a, b) => a.x * b.x + a.y * b.y;
const vDir = (a, fb) => { const l = vLen(a); return l > 1e-9 ? { x: a.x / l, y: a.y / l } : (fb || { x: 1, y: 0 }); };
const vPerp = (a) => ({ x: a.y, y: -a.x });
const vMid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const vDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const P = (x, y) => ({ x, y });

function shapeInit(type, c, L) {
  const x = c.x, y = c.y;
  const polar = (o, r, deg) => P(o.x + r * Math.cos(deg * Math.PI / 180), o.y - r * Math.sin(deg * Math.PI / 180));
  switch (type) {
    case 'segment': case 'arrow': return [P(x - L / 2, y + L * 0.15), P(x + L / 2, y - L * 0.15)];
    case 'triangle': return [P(x - L / 2, y + L * 0.32), P(x + L / 2, y + L * 0.32), P(x - L * 0.12, y - L * 0.42)];
    case 'rect': return [P(x - L / 2, y + L * 0.3), P(x + L / 2, y + L * 0.3), P(x + L / 2, y - L * 0.3), P(x - L / 2, y - L * 0.3)];
    case 'quad': return [P(x - L / 2, y + L * 0.3), P(x + L / 2, y + L * 0.3), P(x + L * 0.25, y - L * 0.3), P(x - L * 0.25, y - L * 0.3)];
    case 'circle': return [P(x, y), P(x + L * 0.4, y)];
    case 'ellipse': return [P(x, y), P(x + L * 0.5, y), P(x, y - L * 0.3)];
    case 'angle': { const v = P(x - L * 0.4, y + L * 0.25); return [v, polar(v, L * 0.8, 0), polar(v, L * 0.8, 55)]; }
    case 'axes2d': return [P(x, y), P(x + L * 0.55, y), P(x, y - L * 0.55)];
    case 'axes3d': { const o = P(x, y); return [o, polar(o, L * 0.45, 215), polar(o, L * 0.55, -5), polar(o, L * 0.55, 90)]; }
    case 'box': { const o = P(x - L * 0.36, y + L * 0.3); return [o, P(o.x + L * 0.55, o.y), P(o.x, o.y - L * 0.42), polar(o, L * 0.2, 38)]; }
    case 'cube': { const a = L * 0.45, o = P(x - L * 0.3, y + L * 0.3); return [o, P(o.x + a, o.y), P(o.x, o.y - a), polar(o, a / 2, 38)]; }
    case 'triprism': { const o = P(x - L * 0.36, y + L * 0.3); return [o, P(o.x + L * 0.5, o.y), P(o.x + L * 0.25, o.y - L * 0.42), polar(o, L * 0.22, 32)]; }
    case 'pyramid': { const o = P(x - L * 0.34, y + L * 0.32); const w = P(o.x + L * 0.6, o.y), d = polar(o, L * 0.2, 35); const bc = P(o.x + L * 0.3 + (d.x - o.x) / 2, o.y + (d.y - o.y) / 2); return [o, w, d, P(bc.x, bc.y - L * 0.62)]; }
    case 'cylinder': case 'cone': { const cc = P(x, y + L * 0.3); return [cc, P(cc.x + L * 0.3, cc.y), P(cc.x, cc.y - L * 0.09), P(cc.x, cc.y - L * 0.6)]; }
    case 'sphere': return [P(x, y), P(x + L * 0.4, y), P(x, y - L * 0.12)];
  }
  return [P(x, y)];
}

function insertShape(type, into) {
  if (state.selection) commitSelection();
  closeShapePop();
  const r = wrap.getBoundingClientRect();
  const c = screenToWorld(r.width / 2, r.height / 2);
  const L = Math.min(320, r.width * 0.4, r.height * 0.5) / state.view.scale;
  const s = {
    kind: 'shape', type, pts: shapeInit(type, c, L),
    color: state.shapeColor, width: state.shapeWidth / state.view.scale, fs: state.shapeFs / state.view.scale,
    opts: Object.fromEntries(Object.keys(SHAPE_OPT_LABELS).map(k => [k, SHAPE_TYPES[type].opts.includes(k) && k in state.shapeOpts ? state.shapeOpts[k] : SHAPE_TYPES[type].def.includes(k)])),
  };
  if (into) {
    const target = drawTarget();
    if (target) {
      target.strokes.push(s);
      renderLayerList();
      pushHistory('Add ' + SHAPE_TYPES[type].label.toLowerCase());
      openShapeEditor(s);
      return;
    }
  }
  const layer = makeLayer(SHAPE_TYPES[type].label);
  layer.obj = true;
  layer.strokes.push(s);
  const a = activeLayer();
  state.layers.splice(!a ? state.layers.length : a.obj ? state.layers.indexOf(a) + 1 : state.layers.indexOf(a), 0, layer);
  renderLayerList();
  pushHistory('Add ' + SHAPE_TYPES[type].label.toLowerCase());
  openShapeEditor(s);
}

const fmtNum = (v) => { const r = Math.round(v * 10) / 10; return (Math.abs(r) < 1e-9 ? 0 : r).toString(); };

function ellipsePts(c, a, b, t0, t1, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * i / n;
    out.push(P(c.x + a.x * Math.cos(t) + b.x * Math.sin(t), c.y + a.y * Math.cos(t) + b.y * Math.sin(t)));
  }
  return out;
}

function convexHull(pts) {
  const p = pts.map((q, i) => ({ x: q.x, y: q.y, i })).sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 1e-9) lo.pop(); lo.push(q); }
  for (let k = p.length - 1; k >= 0; k--) { const q = p[k]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 1e-9) up.pop(); up.push(q); }
  return new Set(lo.slice(0, -1).concat(up.slice(0, -1)).map(q => q.i));
}

function polyArea(v) {
  let a = 0;
  for (let i = 0; i < v.length; i++) { const p = v[i], q = v[(i + 1) % v.length]; a += p.x * q.y - q.x * p.y; }
  return Math.abs(a) / 2;
}

function shapeGeom(s) {
  const p = s.pts, o = s.opts || {}, U = SHAPE_U;
  const g = { solid: [], dashed: [], arrows: [], verts: [], lens: [], angs: [], stats: [], dots: [], axisLabels: [] };
  const L = (a, b) => vDist(a, b) / U;
  const poly = (v, closed) => g.solid.push({ pts: v, closed });
  const names = 'ABCDEFGH';
  const polygon = (v) => {
    poly(v, true);
    const cen = v.reduce((m, q) => vAdd(m, vMul(q, 1 / v.length)), P(0, 0));
    v.forEach((q, i) => g.verts.push({ p: q, name: names[i], from: cen }));
    for (let i = 0; i < v.length; i++) g.lens.push({ a: v[i], b: v[(i + 1) % v.length], text: fmtNum(L(v[i], v[(i + 1) % v.length])), from: cen });
    for (let i = 0; i < v.length; i++) g.angs.push({ v: v[i], a: v[(i + v.length - 1) % v.length], b: v[(i + 1) % v.length] });
    let per = 0;
    for (let i = 0; i < v.length; i++) per += L(v[i], v[(i + 1) % v.length]);
    g.stats.push('Area: ' + fmtNum(polyArea(v) / (U * U)), 'Perimeter: ' + fmtNum(per));
  };
  const polyhedron = (V, E, back, labelEdges) => {
    const hull = convexHull(V);
    const hidden = new Set(back.filter(i => !hull.has(i)));
    for (const [i, j] of E) (hidden.has(i) || hidden.has(j) ? g.dashed : g.solid).push({ pts: [V[i], V[j]] });
    const cen = V.reduce((m, q) => vAdd(m, vMul(q, 1 / V.length)), P(0, 0));
    V.forEach((q, i) => {
      const ang = E.filter(e => e[0] === i || e[1] === i).map(e => { const d = vSub(V[e[0] === i ? e[1] : e[0]], q); return Math.atan2(d.y, d.x); }).sort((a, b) => a - b);
      let best = 0, at = 0;
      for (let k = 0; k < ang.length; k++) {
        const gap = (k + 1 < ang.length ? ang[k + 1] : ang[0] + 2 * Math.PI) - ang[k];
        if (gap > best) { best = gap; at = ang[k] + gap / 2; }
      }
      g.verts.push({ p: q, name: names[i], from: cen, dir: ang.length ? P(Math.cos(at), Math.sin(at)) : null });
    });
    for (const e of labelEdges) g.lens.push({ a: V[e[0]], b: V[e[1]], text: fmtNum(e[2]), from: cen });
  };
  switch (s.type) {
    case 'segment': case 'arrow': {
      poly([p[0], p[1]], false);
      if (s.type === 'arrow') g.arrows.push([p[0], p[1]]);
      else { g.verts.push({ p: p[0], name: 'A', from: p[1] }, { p: p[1], name: 'B', from: p[0] }); g.dots.push(p[0], p[1]); }
      const mid = vMid(p[0], p[1]);
      g.lens.push({ a: p[0], b: p[1], text: fmtNum(L(p[0], p[1])), from: vAdd(mid, vPerp(vDir(vSub(p[1], p[0])))) });
      break;
    }
    case 'triangle': case 'quad': polygon(p); break;
    case 'rect': polygon(p); g.lens = g.lens.slice(0, 2); g.angs = g.angs.map(a => ({ ...a, right: true })); break;
    case 'circle': {
      const r = vDist(p[0], p[1]);
      g.solid.push({ pts: ellipsePts(p[0], P(r, 0), P(0, r), 0, Math.PI * 2, 96), closed: true });
      if (o.labels || o.lengths) g.dots.push(p[0]);
      g.verts.push({ p: p[0], name: 'O', from: vAdd(p[0], vMul(vDir(vSub(p[1], p[0])), r)), inside: true });
      if (o.lengths) g.solid.push({ pts: [p[0], p[1]] });
      g.lens.push({ a: p[0], b: p[1], text: fmtNum(r / U), from: vAdd(vMid(p[0], p[1]), P(0, 1)) });
      g.stats.push('Area: ' + fmtNum(Math.PI * (r / U) ** 2), 'Circumference: ' + fmtNum(2 * Math.PI * r / U));
      g.bound = { x: p[0].x - r, y: p[0].y - r, w: 2 * r, h: 2 * r };
      break;
    }
    case 'ellipse': {
      const a = vSub(p[1], p[0]), b = vSub(p[2], p[0]);
      g.solid.push({ pts: ellipsePts(p[0], a, b, 0, Math.PI * 2, 96), closed: true });
      if (o.lengths) { g.solid.push({ pts: [p[0], p[1]] }, { pts: [p[0], p[2]] }); g.dots.push(p[0]); }
      g.lens.push({ a: p[0], b: p[1], text: fmtNum(vLen(a) / U), from: p[2] }, { a: p[0], b: p[2], text: fmtNum(vLen(b) / U), from: p[1] });
      const A = vLen(a) / U, B = vLen(b) / U, h = ((A - B) / (A + B)) ** 2;
      g.stats.push('Area: ' + fmtNum(Math.PI * A * B), 'Perimeter: ' + fmtNum(Math.PI * (A + B) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h)))));
      break;
    }
    case 'angle': {
      poly([p[1], p[0], p[2]], false);
      const bis = vDir(vAdd(vDir(vSub(p[1], p[0])), vDir(vSub(p[2], p[0]))));
      g.verts.push({ p: p[0], name: 'B', from: vAdd(p[0], bis) }, { p: p[1], name: 'A', from: p[0] }, { p: p[2], name: 'C', from: p[0] });
      g.angs.push({ v: p[0], a: p[1], b: p[2], always: true });
      const rad = Math.acos(Math.max(-1, Math.min(1, vDot(vDir(vSub(p[1], p[0])), vDir(vSub(p[2], p[0]))))));
      g.stats.push('Angle: ' + fmtNum(rad * 180 / Math.PI) + '°', 'Radians: ' + (Math.round(rad * 100) / 100));
      break;
    }
    case 'axes2d': {
      const ox = vSub(p[0], vSub(p[1], p[0])), oy = vSub(p[0], vSub(p[2], p[0]));
      poly([ox, p[1]], false); poly([oy, p[2]], false);
      g.arrows.push([p[0], p[1]], [p[0], ox], [p[0], p[2]], [p[0], oy]);
      g.axisLabels.push({ p: p[1], name: 'x', from: p[0] }, { p: p[2], name: 'y', from: p[0] });
      break;
    }
    case 'axes3d': {
      for (let i = 1; i <= 3; i++) { poly([p[0], p[i]], false); g.arrows.push([p[0], p[i]]); }
      g.axisLabels.push({ p: p[1], name: 'x', from: p[0] }, { p: p[2], name: 'y', from: p[0] }, { p: p[3], name: 'z', from: p[0] });
      break;
    }
    case 'box': case 'cube': {
      const w = vSub(p[1], p[0]), h = vSub(p[2], p[0]), d = vSub(p[3], p[0]);
      const f = [p[0], p[1], vAdd(p[1], h), p[2]];
      const V = f.concat(f.map(q => vAdd(q, d)));
      const W = vLen(w) / U, H = vLen(h) / U, D = 2 * vLen(d) / U;
      polyhedron(V, [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]], [4, 5, 6, 7], [[0, 1, W], [1, 2, H], [1, 5, D]]);
      g.stats.push('Volume: ' + fmtNum(W * H * D), 'Surface area: ' + fmtNum(2 * (W * H + W * D + H * D)));
      break;
    }
    case 'triprism': {
      const d = vSub(p[3], p[0]);
      const f = [p[0], p[1], p[2]];
      const V = f.concat(f.map(q => vAdd(q, d)));
      const a = L(p[0], p[1]), b = L(p[1], p[2]), c = L(p[2], p[0]), D = 2 * vLen(d) / U;
      polyhedron(V, [[0, 1], [1, 2], [2, 0], [3, 4], [4, 5], [5, 3], [0, 3], [1, 4], [2, 5]], [3, 4, 5], [[0, 1, a], [1, 2, b], [2, 0, c], [1, 4, D]]);
      const T = polyArea(f) / (U * U);
      g.stats.push('Volume: ' + fmtNum(T * D), 'Surface area: ' + fmtNum(2 * T + (a + b + c) * D));
      break;
    }
    case 'pyramid': {
      const d = vSub(p[2], p[0]);
      const V = [p[0], p[1], vAdd(p[1], d), p[2], p[3]];
      const bc = vMul(vAdd(vAdd(V[0], V[1]), vAdd(V[2], V[3])), 0.25);
      const W = L(p[0], p[1]), D = 2 * vLen(d) / U, H = vDist(bc, p[3]) / U;
      polyhedron(V, [[0, 1], [1, 2], [2, 3], [3, 0], [0, 4], [1, 4], [2, 4], [3, 4]], [2, 3], [[0, 1, W], [1, 2, D]]);
      if (o.lengths) { g.dashed.push({ pts: [bc, p[3]] }); g.dots.push(bc); }
      g.lens.push({ a: bc, b: p[3], text: fmtNum(H), from: vAdd(vMid(bc, p[3]), vDir(vSub(p[1], p[0]))) });
      g.stats.push('Volume: ' + fmtNum(W * D * H / 3), 'Surface area: ' + fmtNum(W * D + W * Math.sqrt(H * H + (D / 2) ** 2) + D * Math.sqrt(H * H + (W / 2) ** 2)));
      break;
    }
    case 'cylinder': case 'cone': case 'sphere': {
      const c0 = p[0], a = vSub(p[1], p[0]), b = vSub(p[2], p[0]);
      const r = vLen(a) / U;
      if (s.type === 'sphere') {
        const R = vLen(a);
        g.solid.push({ pts: ellipsePts(c0, P(R, 0), P(0, R), 0, Math.PI * 2, 96), closed: true });
        g.solid.push({ pts: ellipsePts(c0, a, b, Math.PI, Math.PI * 2, 48) });
        g.dashed.push({ pts: ellipsePts(c0, a, b, 0, Math.PI, 48) });
        if (o.lengths) { g.dashed.push({ pts: [c0, p[1]] }); g.dots.push(c0); }
        g.lens.push({ a: c0, b: p[1], text: fmtNum(r), at: vAdd(vMid(c0, p[1]), vMul(vDir(b), -s.fs * 0.8)) });
        g.stats.push('Volume: ' + fmtNum(4 / 3 * Math.PI * r ** 3), 'Surface area: ' + fmtNum(4 * Math.PI * r * r));
        g.bound = { x: c0.x - R, y: c0.y - R, w: 2 * R, h: 2 * R };
        break;
      }
      const top = p[3], h = vDist(c0, top) / U;
      g.solid.push({ pts: ellipsePts(c0, a, b, Math.PI, Math.PI * 2, 48) });
      g.dashed.push({ pts: ellipsePts(c0, a, b, 0, Math.PI, 48) });
      if (s.type === 'cylinder') {
        g.solid.push({ pts: ellipsePts(top, a, b, 0, Math.PI * 2, 96), closed: true });
        g.solid.push({ pts: [vAdd(c0, a), vAdd(top, a)] }, { pts: [vSub(c0, a), vSub(top, a)] });
        g.stats.push('Volume: ' + fmtNum(Math.PI * r * r * h), 'Surface area: ' + fmtNum(2 * Math.PI * r * r + 2 * Math.PI * r * h));
      } else {
        g.solid.push({ pts: [vAdd(c0, a), top] }, { pts: [vSub(c0, a), top] });
        g.stats.push('Volume: ' + fmtNum(Math.PI * r * r * h / 3), 'Surface area: ' + fmtNum(Math.PI * r * r + Math.PI * r * Math.sqrt(r * r + h * h)));
      }
      if (o.lengths) { g.solid.push({ pts: [c0, p[1]] }); g.dashed.push({ pts: [c0, top] }); g.dots.push(c0); }
      const ua = vDir(a);
      g.lens.push({ a: c0, b: p[1], text: fmtNum(r), at: vAdd(p[1], vMul(ua, s.fs * 0.6)), align: ua.x >= 0 ? 'left' : 'right' });

function shapeText(c, text, x, y, fs, italic, align, base) {

const SNAP_STEP = Math.PI / 12, SNAP_TOL = 1.1 * Math.PI / 180;

function shapeSnap(s, i, q) {

    const a1 = Math.atan2(other.y - p[j].y, other.x - p[j].x), a2 = Math.atan2(q.y - p[j].y, q.x - p[j].x);

    const t = snapNice(th);

    }
    case 'cylinder': case 'cone': case 'sphere': {
      if (i === 0) return moveAll(q);
      p[i] = proj(p[0], p[i], q, min);
      return;
    }
  }
  p[i] = q;
}

function shapeAtPoint(wp) {
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const layer = state.layers[i];
    if (!layer.visible) continue;
    for (let j = layer.strokes.length - 1; j >= 0; j--) {
      const s = layer.strokes[j];
      if (s.kind !== 'shape') continue;
      const b = shapeOutlineBounds(s), pad = 8 / state.view.scale;
      if (wp.x >= b.x - pad && wp.x <= b.x + b.w + pad && wp.y >= b.y - pad && wp.y <= b.y + b.h + pad) return s;
    }
  }
  return null;
}

function shapeSetLength(s, k, v) {
  if (!(v > 0)) return;
  const p = s.pts, Lw = v * SHAPE_U;
  const along = (o, q, len) => vAdd(o, vMul(vDir(vSub(q, o)), len));
  switch (s.type) {
    case 'segment': case 'arrow': case 'circle': case 'sphere': p[1] = along(p[0], p[1], Lw); break;
    case 'triangle':
      if (k === 0) p[1] = along(p[0], p[1], Lw);
      else if (k === 1) p[2] = along(p[1], p[2], Lw);
      else p[2] = along(p[0], p[2], Lw);
      break;
    case 'quad': { const j = (k + 1) % 4; if (j) p[j] = along(p[k], p[j], Lw); else p[k] = along(p[0], p[k], Lw); break; }
    case 'rect':
      if (k === 0) { const nb = along(p[0], p[1], Lw), d = vSub(nb, p[1]); p[1] = nb; p[2] = vAdd(p[2], d); }
      else { const nc = along(p[1], p[2], Lw), d = vSub(nc, p[2]); p[2] = nc; p[3] = vAdd(p[3], d); }
      break;
    case 'ellipse': p[k + 1] = along(p[0], p[k + 1], Lw); break;
    case 'box': if (k < 2) p[k + 1] = along(p[0], p[k + 1], Lw); else p[3] = along(p[0], p[3], Lw / 2); break;
    case 'cube': p[1] = along(p[0], p[1], Lw); p[2] = along(p[0], p[2], Lw); p[3] = along(p[0], p[3], Lw / 2); break;
    case 'triprism':
      if (k === 0) p[1] = along(p[0], p[1], Lw);
      else if (k === 1) p[2] = along(p[1], p[2], Lw);
      else if (k === 2) p[2] = along(p[0], p[2], Lw);
      else p[3] = along(p[0], p[3], Lw / 2);
      break;
    case 'pyramid':
      if (k === 0) p[1] = along(p[0], p[1], Lw);
      else if (k === 1) p[2] = along(p[0], p[2], Lw / 2);
      else { const d = vSub(p[2], p[0]); const bc = vMul(vAdd(vAdd(p[0], p[1]), vAdd(vAdd(p[1], d), p[2])), 0.25); p[3] = along(bc, p[3], Lw); }
      break;
    case 'cylinder': case 'cone': if (k === 0) p[1] = along(p[0], p[1], Lw); else p[3] = along(p[0], p[3], Lw); break;
  }
}

function shapeSetAngle(s, k, deg) {
  const th = deg * Math.PI / 180;
  if (!(th > 0 && th < Math.PI)) return;
  const p = s.pts;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const swing = (o, fixed, moving) => {
    const sg = Math.sign(cross(o, fixed, moving)) || 1;
    const a0 = Math.atan2(fixed.y - o.y, fixed.x - o.x) + sg * th, r = vDist(o, moving);
    return P(o.x + r * Math.cos(a0), o.y + r * Math.sin(a0));
  };
  if (s.type === 'angle') { p[2] = swing(p[0], p[1], p[2]); return; }
  if (s.type === 'triangle') {
    if (k === 0) p[2] = swing(p[0], p[1], p[2]);
    else if (k === 1) p[2] = swing(p[1], p[0], p[2]);
    else {
      const A = p[0], B = p[1], ab = vDist(A, B), M = vMid(A, B);
      let u = vPerp(vDir(vSub(B, A)));
      if (vDot(vSub(p[2], M), u) < 0) u = vMul(u, -1);
      const R = ab / (2 * Math.sin(th)), C = vAdd(M, vMul(u, ab / (2 * Math.tan(th))));
      p[2] = vAdd(C, vMul(vDir(vSub(p[2], C), u), R));
    }
    return;
  }
  if (s.type === 'quad') {
    const a = (k + 3) % 4, b = (k + 1) % 4;
    if (b !== 0) p[b] = swing(p[k], p[a], p[b]);
    else p[a] = swing(p[k], p[b], p[a]);
  }
}

let shapeValInput = null;
function openShapeValueEditor(h) {
  const se = state.shapeEdit;
  if (!se) return;
  closeShapeValueEditor(false);
  const wr = wrap.getBoundingClientRect();
  const a = worldToScreen(h.rect.x0, h.rect.y0), b = worldToScreen(h.rect.x1, h.rect.y1);
  const inp = document.createElement('input');
  inp.className = 'shape-val-input';
  inp.type = 'text';
  const isName = h.kind === 'name';
  if (isName) inp.maxLength = 8; else inp.inputMode = 'decimal';
  inp.value = isName ? String(h.value) : String(h.value).replace('°', '');
  const w = Math.max(54, b.x - a.x + 26);
  inp.style.width = w + 'px';
  inp.style.left = (wr.left + (a.x + b.x) / 2 - w / 2) + 'px';
  inp.style.top = (wr.top + (a.y + b.y) / 2 - 13) + 'px';
  document.body.appendChild(inp);
  shapeValInput = { inp, h, s: se.s };
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); closeShapeValueEditor(true); }
    else if (e.key === 'Escape') { e.preventDefault(); closeShapeValueEditor(false); }
  });
  inp.addEventListener('blur', () => closeShapeValueEditor(true));
  inp.focus();
  inp.select();
}

function closeShapeValueEditor(apply) {
  const v = shapeValInput;
  if (!v) return;
  shapeValInput = null;
  if (apply && v.h.kind === 'name') {
    const txt = v.inp.value.trim();
    const names = { ...(v.s.names || {}) };
    if (txt) names[v.h.k] = txt; else delete names[v.h.k];
    v.s.names = Object.keys(names).length ? names : undefined;
  } else if (apply) {
    const num = parseFloat(v.inp.value.replace(',', '.'));
    if (isFinite(num)) {
      if (v.h.kind === 'len') shapeSetLength(v.s, v.h.k, num);
      else shapeSetAngle(v.s, v.h.k, num);
    }
  }
  v.inp.remove();
  render();
}

function shapeHitLabel(wp) {
  const se = state.shapeEdit;
  if (!se || !se.s._hits) return null;
  const pad = 3 / state.view.scale;
  return se.s._hits.find(h => wp.x >= h.rect.x0 - pad && wp.x <= h.rect.x1 + pad && wp.y >= h.rect.y0 - pad && wp.y <= h.rect.y1 + pad) || null;
}

/* ---- Shape editing ---- */

function openShapeEditor(s) {
  if (state.shapeEdit) finishShapeEdit();
  if (state.selection) commitSelection();
  const layer = state.layers.find(l => l.strokes.includes(s));
  if (!layer) return;
  if (layer.obj) state.activeLayerId = layer.id;
  const bar = document.createElement('div');
  bar.className = 'dz-floatbar shape-bar';
  const lab = document.createElement('span');
  lab.className = 'shape-bar-name';
  lab.textContent = SHAPE_TYPES[s.type].label;
  bar.appendChild(lab);
  bar.appendChild(Object.assign(document.createElement('span'), { className: 'bar-divider' }));
  const colorBtn = document.createElement('button');
  colorBtn.type = 'button';
  colorBtn.className = 'shape-color-btn';
  colorBtn.title = 'Color';
  colorBtn.style.background = s.color;
  colorBtn.onclick = toggleShapeEditColor;
  bar.appendChild(colorBtn);
  for (const k of SHAPE_TYPES[s.type].opts) {
    const ol = SHAPE_TYPES[s.type].optLabels || {};
    bar.appendChild(dzToggle(ol[k] || SHAPE_OPT_LABELS[k], ol[k] ? 'Show ' + ol[k].toLowerCase() : SHAPE_OPT_TIPS[k], !!s.opts[k], (v) => { s.opts[k] = v; render(); }));
  }
  const done = document.createElement('button');
  done.type = 'button';
  done.className = 'ctrl-btn primary dz-done';
  done.textContent = 'Done';
  done.onclick = () => finishShapeEdit();
  bar.appendChild(done);
  document.body.appendChild(bar);
  state.shapeEdit = { s, layerId: layer.id, before: JSON.stringify({ p: s.pts, o: s.opts, c: s.color, n: s.names }), drag: null, bar, colorBtn };
  renderLayerList();
  render();
  requestAnimationFrame(() => bar.classList.add('on'));
}

function finishShapeEdit() {
  const se = state.shapeEdit;
  if (!se) return;
  closeShapeValueEditor(true);
  state.shapeEdit = null;
  shapeEditColorPop.classList.remove('on');
  se.bar.classList.remove('on');
  setTimeout(() => se.bar.remove(), 200);
  canvas.style.cursor = toolCursor();
  render();
  if (JSON.stringify({ p: se.s.pts, o: se.s.opts, c: se.s.color, n: se.s.names }) !== se.before) pushHistory('Edit ' + SHAPE_TYPES[se.s.type].label.toLowerCase());
}

function deleteEditedShape() {
  const se = state.shapeEdit;
  if (!se) return;
  state.shapeEdit = null;
  se.bar.remove();
  shapeEditColorPop.classList.remove('on');
  const layer = state.layers.find(l => l.id === se.layerId);
  if (layer) {
    layer.strokes = layer.strokes.filter(x => x !== se.s);
    if (layer.obj && !layer.strokes.length && !layer.embeds.length && state.layers.length > 1) {
      const i = state.layers.indexOf(layer);
      state.layers.splice(i, 1);
      if (state.activeLayerId === layer.id) {
        let t = null;
        for (let j = i; j < state.layers.length && !t; j++) if (!state.layers[j].obj) t = state.layers[j];
        for (let j = i - 1; j >= 0 && !t; j--) if (!state.layers[j].obj) t = state.layers[j];
        state.activeLayerId = (t || state.layers[Math.max(0, i - 1)]).id;
      }
    }
  }
  canvas.style.cursor = toolCursor();
  renderLayerList();
  render();
  pushHistory('Delete');
}

function shapeHandleAt(sp) {
  const se = state.shapeEdit;
  if (!se) return -1;
  for (let i = se.s.pts.length - 1; i >= 0; i--) {
    const q = worldToScreen(se.s.pts[i].x, se.s.pts[i].y);
    if (Math.hypot(q.x - sp.x, q.y - sp.y) <= 9) return i;
  }
  return -1;
}

function shapeEditPointerDown(e, sp, wp) {
  const se = state.shapeEdit;
  const i = shapeHandleAt(sp);
  if (i >= 0) {
    se.drag = { i };
  } else if (shapeHitLabel(wp)) {
    e.preventDefault();
    const h = shapeHitLabel(wp);
    setTimeout(() => openShapeValueEditor(h), 0);
    return;
  } else {
    const b = shapeOutlineBounds(se.s), pad = 8 / state.view.scale;
    if (wp.x >= b.x - pad && wp.x <= b.x + b.w + pad && wp.y >= b.y - pad && wp.y <= b.y + b.h + pad) {
      se.drag = { move: true, start: wp, orig: se.s.pts.map(q => ({ ...q })) };
    } else {
      finishShapeEdit();
      return;
    }
  }
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
}

function shapeEditPointerMove(sp, wp, e) {
  const se = state.shapeEdit;
  if (!se.drag) {
    const i = shapeHandleAt(sp);
    if (i >= 0) canvas.style.cursor = 'grab';
    else if (shapeHitLabel(wp)) canvas.style.cursor = 'text';
    else {
      const b = shapeOutlineBounds(se.s), pad = 8 / state.view.scale;
      canvas.style.cursor = wp.x >= b.x - pad && wp.x <= b.x + b.w + pad && wp.y >= b.y - pad && wp.y <= b.y + b.h + pad ? 'move' : 'default';
    }
    return;
  }
  if (se.drag.move) {
    const d = vSub(wp, se.drag.start);
    se.s.pts = se.drag.orig.map(q => vAdd(q, d));
  } else {
    shapeHandleDrag(se.s, se.drag.i, P(wp.x, wp.y), !!(e && e.altKey));
  }
  render();
}

function drawShapeEditUI() {
  const se = state.shapeEdit;
  if (!se) return;
  const s = se.s;
  const b = shapeBounds(s);
  const a = worldToScreen(b.x, b.y), c2 = worldToScreen(b.x + b.w, b.y + b.h);
  ctx.save();
  ctx.strokeStyle = 'rgba(107,140,206,0.55)';
  ctx.setLineDash([4, 3]);
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(a.x) - 2.5, Math.round(a.y) - 2.5, Math.round(c2.x - a.x) + 5, Math.round(c2.y - a.y) + 5);
  ctx.setLineDash([]);
  for (const q of s.pts) {
    const h = worldToScreen(q.x, q.y);
    ctx.beginPath();
    ctx.arc(h.x, h.y, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#6b8cce';
    ctx.stroke();
  }
  ctx.restore();
  const bar = se.bar, wr = wrap.getBoundingClientRect();
  const bw = bar.offsetWidth || 300, bh = bar.offsetHeight || 38;
  const bb = shapeBounds(s);
  const ta = worldToScreen(bb.x, bb.y), tb = worldToScreen(bb.x + bb.w, bb.y + bb.h);
  let top = wr.top + Math.min(a.y, ta.y) - bh - 14;
  if (top < wr.top + 8) top = wr.top + Math.max(c2.y, tb.y) + 14;
  top = Math.max(wr.top + 8, Math.min(wr.bottom - bh - 8, top));
  const left = Math.max(wr.left + 8, Math.min(wr.right - bw - 8, wr.left + (a.x + c2.x) / 2 - bw / 2));
  bar.style.left = left + 'px';
  bar.style.top = top + 'px';
  if (shapeEditColorPop.classList.contains('on')) placeColorPop(shapeEditColorPop, bar);
}

document.addEventListener('pointerdown', (e) => {
  if (!state.shapeEdit) return;
  if (state.shapeEdit.bar.contains(e.target) || shapeEditColorPop.contains(e.target) || (shapeValInput && shapeValInput.inp === e.target)) return;
  if (shapeEditColorPop.classList.contains('on')) shapeEditColorPop.classList.remove('on');
  if (e.target === canvas) return;
  finishShapeEdit();
}, true);

function placeColorPop(pop, bar) {
  const r = bar.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const ph = pop.offsetHeight || 42;
  let top = r.top - ph - 6;
  if (top < wr.top + 8) top = r.bottom + 6;
  pop.style.left = Math.max(8, r.left) + 'px';
  pop.style.top = top + 'px';
}

function buildSwatches(wrapEl, custom, onPick, onCommit) {
  for (const c of PEN_SWATCHES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tp-swatch';
    b.dataset.c = c;
    b.style.background = c;
    b.onclick = () => { onPick(c); if (onCommit) onCommit(); };
    wrapEl.insertBefore(b, custom);
  }
  custom.addEventListener('input', (e) => onPick(e.target.value));
  if (onCommit) custom.addEventListener('change', onCommit);
}

function syncSwatches(wrapEl, custom, color) {
  const c = (color || '').toLowerCase();
  let matched = false;
  for (const b of wrapEl.querySelectorAll('.tp-swatch')) {
    const on = b.dataset.c === c;
    b.classList.toggle('on', on);
    if (on) matched = true;
  }
  custom.classList.toggle('on', !matched);
  if (!matched && custom.value.toLowerCase() !== c) custom.value = c;
}

function syncShapeColorUI() {
  document.getElementById('shapeDot').style.background = state.shapeColor;
  syncSwatches(document.getElementById('shapeSetColors'), document.getElementById('shapeSetColor'), state.shapeColor);
}

const shapeEditColorPop = document.getElementById('shapeEditColorPop');
buildSwatches(document.getElementById('shapeSetColors'), document.getElementById('shapeSetColor'), (c) => { state.shapeColor = c; syncShapeColorUI(); });
buildSwatches(document.getElementById('shapeEditColors'), document.getElementById('shapeEditColor'), (c) => {
  const se = state.shapeEdit;
  if (!se) return;
  se.s.color = c;
  se.colorBtn.style.background = c;
  syncSwatches(document.getElementById('shapeEditColors'), document.getElementById('shapeEditColor'), c);
  render();
});

function toggleShapeEditColor() {
  const se = state.shapeEdit;
  if (!se) return;
  if (shapeEditColorPop.classList.contains('on')) { shapeEditColorPop.classList.remove('on'); return; }
  syncSwatches(document.getElementById('shapeEditColors'), document.getElementById('shapeEditColor'), se.s.color);
  shapeEditColorPop.classList.add('on');
  placeColorPop(shapeEditColorPop, se.bar);
}

/* ---- Select tool color ---- */

const selColorPop = document.getElementById('selColorPop');

function selColorTargets() {
  const sel = state.selection;
  if (!sel || !sel.lifted) return { strokes: [], embeds: [] };
  return {
    strokes: sel.strokes.filter(st => st.kind === 'shape' || (st.points && st.mode !== 'eraser')),
    embeds: sel.embeds.filter(em => em.type === 'text' && em.data),
  };
}

function selColors() {
  const t = selColorTargets(), set = [];
  for (const st of t.strokes) if (!set.includes(st.color)) set.push(st.color);
  for (const em of t.embeds) if (!set.includes(em.data.color)) set.push(em.data.color);
  return set;
}

function setSelectionColor(c) {
  const t = selColorTargets();
  if (!t.strokes.length && !t.embeds.length) return;
  for (const st of t.strokes) st.color = c;
  for (const em of t.embeds) { em.data.color = c; if (em.el) em.el.style.color = c; }
  render();
  queueTextEditHistory('Recolor');
}

buildSwatches(document.getElementById('selColors'), document.getElementById('selColor'), setSelectionColor, flushTextEditHistory);

function openSelectColor() {
  if (!selColors().length) return;
  if (toolPopFor) closeToolPop();
  if (textPopOpen) closeTextPop();
  const r = document.querySelector('.tool[data-tool="select"]').getBoundingClientRect();
  selColorPop.style.left = Math.max(8, r.left) + 'px';
  selColorPop.style.top = (r.bottom + 8) + 'px';
  selColorPop.classList.add('on');
  updateSelectIndicator();
}

function closeSelectColor() {
  if (!selColorPop.classList.contains('on')) return;
  selColorPop.classList.remove('on');
  flushTextEditHistory();
}

document.querySelector('.tool[data-tool="select"]').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (selColorPop.classList.contains('on')) closeSelectColor(); else openSelectColor();
});

document.addEventListener('pointerdown', (e) => {
  if (!selColorPop.classList.contains('on')) return;
  if (selColorPop.contains(e.target) || e.target.closest('.tool[data-tool="select"]')) return;
  closeSelectColor();
}, true);

document.addEventListener('keydown', (e) => {
  if (selColorPop.classList.contains('on') && e.key === 'Escape') { closeSelectColor(); e.stopPropagation(); }
}, true);

function updateSelectIndicator() {
  const cols = selColors();
  const dot = document.getElementById('selDot');
  if (!cols.length) {
    dot.classList.remove('on');
    if (selColorPop.classList.contains('on')) closeSelectColor();
    return;
  }
  dot.classList.add('on');
  if (cols.length === 1) dot.style.background = cols[0];
  else {
    const stops = cols.slice(0, 6).map((c, i, a) => c + ' ' + (i * 100 / a.length) + '% ' + ((i + 1) * 100 / a.length) + '%');
    dot.style.background = 'linear-gradient(90deg, ' + stops.join(', ') + ')';
  }
  if (selColorPop.classList.contains('on')) {
    const wrapEl = document.getElementById('selColors'), custom = document.getElementById('selColor');
    if (cols.length === 1) syncSwatches(wrapEl, custom, cols[0]);
    else { for (const b of wrapEl.querySelectorAll('.tp-swatch')) b.classList.remove('on'); custom.classList.remove('on'); }
  }
}

const SHAPE_WIDTH_STEPS = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10, 12];
const SHAPE_FS_STEPS = [8, 10, 12, 14, 15, 16, 18, 20, 24, 28, 32, 40];
const shapeSetPop = document.getElementById('shapeSetPop');
let shapeSetOpen = false;

function stepIndex(steps, v) {
  let best = 0;
  for (let i = 1; i < steps.length; i++) if (Math.abs(steps[i] - v) < Math.abs(steps[best] - v)) best = i;
  return best;
}

function syncShapeSetPop() {
  const w = document.getElementById('shapeWidthSlider'), f = document.getElementById('shapeFsSlider');
  w.max = SHAPE_WIDTH_STEPS.length - 1; w.value = stepIndex(SHAPE_WIDTH_STEPS, state.shapeWidth);
  f.max = SHAPE_FS_STEPS.length - 1; f.value = stepIndex(SHAPE_FS_STEPS, state.shapeFs);
  for (const b of document.querySelectorAll('#shapeOptChips .tp-chip')) {
    const v = state.shapeOpts[b.dataset.k];
    b.classList.toggle('on', v === true);
    b.classList.toggle('off', v === false);
  }
  document.getElementById('shapeWidthVal').textContent = state.shapeWidth;
  document.getElementById('shapeFsVal').textContent = state.shapeFs;
}

function openShapeSetPop() {
  if (shapePopOpen) closeShapePop();
  if (toolPopFor) closeToolPop();
  if (textPopOpen) closeTextPop();
  closeSelectColor();
  syncShapeColorUI();
  syncShapeSetPop();
  shapeSetOpen = true;
  const r = document.getElementById('shapesBtn').getBoundingClientRect();
  shapeSetPop.style.left = Math.max(8, r.left) + 'px';
  shapeSetPop.style.top = (r.bottom + 8) + 'px';
  shapeSetPop.classList.add('on');
}

function closeShapeSetPop() {
  shapeSetOpen = false;
  shapeSetPop.classList.remove('on');
}

(function () {
  const btn = document.getElementById('shapesBtn');
  btn.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (shapeSetOpen) closeShapeSetPop(); else openShapeSetPop();
  });
  document.getElementById('shapeGearBtn').addEventListener('click', openShapeSetPop);
  document.getElementById('shapeWidthSlider').addEventListener('input', (e) => {
    state.shapeWidth = SHAPE_WIDTH_STEPS[+e.target.value];
    syncShapeSetPop();
  });
  document.getElementById('shapeFsSlider').addEventListener('input', (e) => {
    state.shapeFs = SHAPE_FS_STEPS[+e.target.value];
    syncShapeSetPop();
  });
  const chips = document.getElementById('shapeOptChips');
  for (const [k, label] of Object.entries(SHAPE_OPT_LABELS)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tp-chip';
    b.dataset.k = k;
    b.textContent = label;
    b.title = 'Click to cycle: usual / on / off';
    b.addEventListener('click', () => {
      const v = state.shapeOpts[k];
      if (v === undefined) state.shapeOpts[k] = true;
      else if (v === true) state.shapeOpts[k] = false;
      else delete state.shapeOpts[k];
      syncShapeSetPop();
    });
    chips.appendChild(b);
  }
  const fold = document.getElementById('shapeOptFold');
  fold.addEventListener('click', () => {
    const open = chips.hidden;
    chips.hidden = !open;
    fold.setAttribute('aria-expanded', String(open));
  });
  document.getElementById('shapeSetResetBtn').addEventListener('click', () => {
    state.shapeOpts = {};
    state.shapeColor = '#000000';
    state.shapeWidth = 2;
    state.shapeFs = 15;
    syncShapeColorUI();
    syncShapeSetPop();
  });
  document.addEventListener('pointerdown', (e) => {
    if (!shapeSetOpen) return;
    if (shapeSetPop.contains(e.target) || e.target.closest('#shapesBtn')) return;
    closeShapeSetPop();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (shapeSetOpen && e.key === 'Escape') { closeShapeSetPop(); e.stopPropagation(); }
  }, true);
  window.addEventListener('resize', closeShapeSetPop);
})();

function closeShapePop() {
  shapePopOpen = false;
  shapePopInto = false;
  shapePop.classList.remove('on');
  document.getElementById('shapesBtn').classList.remove('active');
}


/* =========================================================================
   CALCULATOR PANEL
   ========================================================================= */
const calcPanel = document.getElementById('calcPanel');
let calcInst = null, calcSaved = null, calcPlaced = false;

function calcGetState() {
  if (calcInst) { try { calcSaved = calcInst.getState(); } catch (_) {} }
  if (!calcSaved || dzIsEmpty(calcSaved)) return null;
  return calcSaved;
}

function calcSetState(st) {
  calcSaved = st || null;
  if (!calcInst) return;
  try { if (st) calcInst.setState(st); else calcInst.setBlank(); } catch (_) {}
}

function calcPlace() {
  const wr = wrap.getBoundingClientRect();
  const w = calcPanel.offsetWidth || 340;
  calcPanel.style.left = Math.max(wr.left + 8, wr.right - w - 12) + 'px';
  calcPanel.style.top = (wr.top + 60) + 'px';
  calcPlaced = true;
}

function openCalc() {
  if (!calcPlaced) calcPlace();
  calcPanel.classList.add('on');
  document.getElementById('calcBtn').classList.add('active');
  if (calcInst) { calcInst.resize(); calcInst.focusFirstExpression && calcInst.focusFirstExpression(); return; }
  const host = document.getElementById('calcHost');
  loadDesmos().then(() => {
    if (calcInst) return;
    calcInst = window.Desmos.GraphingCalculator(host, { graphpaper: false, expressions: true, settingsMenu: false, zoomButtons: false, keypad: false, border: false, expressionsCollapsed: false });
    if (calcSaved) { try { calcInst.setState(calcSaved); } catch (_) {} }
    if (calcPanel.classList.contains('on') && calcInst.focusFirstExpression) calcInst.focusFirstExpression();
  }).catch(() => {
    if (host.querySelector('.dz-msg')) return;
    const msg = document.createElement('div');
    msg.className = 'dz-msg';
    msg.textContent = "Couldn't reach Desmos. Check your connection and try again.";
    host.appendChild(msg);
  });
}

function closeCalc() {
  if (calcInst) { try { calcSaved = calcInst.getState(); } catch (_) {} }
  calcPanel.classList.remove('on');
  document.getElementById('calcBtn').classList.remove('active');
  const msg = document.querySelector('#calcHost .dz-msg');
  if (msg) msg.remove();
}

function toggleCalc() {
  if (calcPanel.classList.contains('on')) closeCalc(); else openCalc();
}

document.getElementById('calcBtn').addEventListener('click', toggleCalc);
wrap.addEventListener('pointerdown', () => {
  const ae = document.activeElement;
  if (ae && calcPanel.contains(ae)) ae.blur();
}, true);
document.getElementById('calcClose').addEventListener('click', closeCalc);

(function () {
  const head = document.getElementById('calcHead');
  let drag = null;
  head.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('.calc-close')) return;
    const r = calcPanel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const w = calcPanel.offsetWidth, h = calcPanel.offsetHeight, wr = wrap.getBoundingClientRect();
    calcPanel.style.left = Math.max(wr.left, Math.min(wr.right - w, e.clientX - drag.dx)) + 'px';
    calcPanel.style.top = Math.max(wr.top, Math.min(wr.bottom - h, e.clientY - drag.dy)) + 'px';
  });
  const end = () => { drag = null; };
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
  for (const h of calcPanel.querySelectorAll('.calc-rz')) {
    let st = null;
    h.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const r = calcPanel.getBoundingClientRect();
      st = { x: e.clientX, y: e.clientY, l: r.left, t: r.top, w: r.width, h: r.height, d: h.dataset.d };
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener('pointermove', (e) => {
      if (!st) return;
      const dx = e.clientX - st.x, dy = e.clientY - st.y, MW = 240, MH = 180, wr = wrap.getBoundingClientRect();
      let { l, t, w, h: hh } = st;
      if (st.d.includes('e')) w = Math.max(MW, Math.min(wr.right - l, st.w + dx));
      if (st.d.includes('s')) hh = Math.max(MH, Math.min(wr.bottom - t, st.h + dy));
      if (st.d.includes('w')) { w = Math.max(MW, Math.min(st.l + st.w - wr.left, st.w - dx)); l = st.l + st.w - w; }
      if (st.d.includes('n')) { hh = Math.max(MH, Math.min(st.t + st.h - wr.top, st.h - dy)); t = st.t + st.h - hh; }
      calcPanel.style.left = l + 'px';
      calcPanel.style.top = t + 'px';
      calcPanel.style.width = w + 'px';
      calcPanel.style.height = hh + 'px';
    });
    const stop = () => { st = null; };
    h.addEventListener('pointerup', stop);
    h.addEventListener('pointercancel', stop);
  }
  const resetCalcPos = () => {
    calcPanel.style.width = '';
    calcPanel.style.height = '';
    calcPlace();
  };
  let gripDown = false;
  head.addEventListener('pointerdown', (e) => { gripDown = !!e.target.closest('.calc-grip-wrap'); }, true);
  head.addEventListener('dblclick', () => { if (gripDown) resetCalcPos(); });
  let calcActive = false;
  document.addEventListener('pointerdown', (e) => { calcActive = calcPanel.contains(e.target); }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !calcPanel.classList.contains('on')) return;
    if (!calcActive && !calcPanel.contains(document.activeElement)) return;
    e.preventDefault();
    e.stopPropagation();
    calcActive = false;
    closeCalc();
    if (document.activeElement && calcPanel.contains(document.activeElement)) document.activeElement.blur();
  }, true);
  if (window.ResizeObserver) new ResizeObserver(() => { if (calcInst) calcInst.resize(); }).observe(calcPanel);
  const clampCalc = () => {
    if (!calcPlaced) return;
    const wr = wrap.getBoundingClientRect(), r = calcPanel.getBoundingClientRect();
    const w = Math.min(r.width, wr.width), h = Math.min(r.height, wr.height);
    if (w !== r.width) calcPanel.style.width = w + 'px';
    if (h !== r.height) calcPanel.style.height = h + 'px';
    calcPanel.style.left = Math.max(wr.left, Math.min(wr.right - w, r.left)) + 'px';
    calcPanel.style.top = Math.max(wr.top, Math.min(wr.bottom - h, r.top)) + 'px';
  };
  if (window.ResizeObserver) new ResizeObserver(clampCalc).observe(wrap);
  window.addEventListener('resize', clampCalc);
})();

function init() {
  const l1 = makeLayer();
  state.layers.push(l1);
  state.activeLayerId = l1.id;
  renderLayerList();
  resizeCanvas();
  setTool('pen');
  syncZoomSlider();
  syncToolPop();
  syncTextPop();
  syncShapeColorUI();
  pushHistory('Start');
}
init();
</script></body></html>
