  const half = Math.max(Math.abs(lo), Math.abs(hi)) * 1.1 || 1;
  document.getElementById('gs_' + dName + 'Min').value = +(-half).toFixed(4);
  document.getElementById('gs_' + dName + 'Max').value = +half.toFixed(4);
  if (dName === 'y') graphYAutoSet = false;
  scheduleLivePreview();
}

function rotateStrokeAbout(s, ox, oy, deg) {
  const a = deg * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
  const R = (x, y) => { const dx = x - ox, dy = y - oy; return [ox + dx * c - dy * sn, oy + dx * sn + dy * c]; };
  if (s.kind === 'polys') {
    s.items = s.items.map(it => {
      const q = it.p.slice();
      for (let i = 0; i < q.length; i += 2) { const r = R(q[i], q[i + 1]); q[i] = r[0]; q[i + 1] = r[1]; }
      return { ...it, p: q };
    });
    s._b = null;
  } else if (s.kind === 'text') {
    const r = R(s.x, s.y); s.x = r[0]; s.y = r[1];
  } else if (s.points) {
    s.points = s.points.map(p => { const r = R(p.x, p.y); return { x: r[0], y: r[1] }; });
  }
}

function buildGraphStrokes(rec, parsed, opts = {}) {
  const { originX, originY, screenSpan, settings } = rec;
  const vs = rec.viewScale || state.view.scale;
  const gid = rec.graphId;
  const color = rec.color || state.penColor;
  const px = 1 / vs;
  const out = [];
  if (is3DKind(parsed.kind)) {
    const sample = opts.sample || sample3D(parsed, settings, opts.fast ? 30 : SURFACE_N);
    if (!sample.any && !opts.allowEmpty) throw new Error('no surface in this range — check the equation or ranges');
    const scene = build3DScene(sample, settings, originX, originY, (screenSpan / vs) * 0.27, px, hexToRgba(color, 0.5));
    out.push({ kind: 'polys', items: scene.items, graphId: gid });
    for (const lab of scene.labels) {
      out.push({ kind: 'text', x: lab.x, y: lab.y, text: lab.text, size: lab.size, italic: lab.italic, color: '#1a1a1a', anchor: 'middle-center', graphId: gid, opacity: lab.opacity });
    }
  } else {
    const curve = generateEquationStrokes(parsed, settings, originX, originY, screenSpan, vs, gid, color, opts.fast);
    if (!curve.length && !opts.allowEmpty) throw new Error('no plot data — check the equation');
    const ww = screenSpan / vs, wh = ww * 0.6;
    if (settings.showBox) {
      const pad = 34 * px;
      const x0 = originX - ww / 2 - pad, y0 = originY - wh / 2 - pad, x1 = originX + ww / 2 + pad, y1 = originY + wh / 2 + pad;
      out.push({ points: [{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }, { x: x0, y: y0 }], color: '#1a1a1a', width: 0.8 * px, mode: 'pen', graphId: gid, opacity: 0.2 });
    }
    out.push(...buildAxes2DStrokes(settings, originX, originY, screenSpan, vs, gid, color));
    out.push(...curve);
    if (settings.showTicks) {
      for (const lab of computeTickLabels(settings, originX, originY, screenSpan, vs)) {
        out.push({ kind: 'text', x: lab.x, y: lab.y, text: lab.text, size: 11 * px, color: '#1a1a1a', anchor: lab.anchor, graphId: gid, opacity: 0.7 });
      }
    }
    let { xMin: xmin, xMax: xmax, yMin: ymin, yMax: ymax } = settings;
    if (!(xmax > xmin)) { xmin = -10; xmax = 10; }
    if (!(ymax > ymin)) { ymin = -6; ymax = 6; }
    const xAxisY = originY - (axisAnchor(ymin, ymax) - (ymin + ymax) / 2) * (wh / (ymax - ymin));
    const yAxisX = originX + (axisAnchor(xmin, xmax) - (xmin + xmax) / 2) * (ww / (xmax - xmin));
    const xl = (settings.xLabel || '').trim(), yl = (settings.yLabel || '').trim();
    if (xl) out.push({ kind: 'text', x: originX + ww / 2 + 7 * px, y: xAxisY, text: xl, size: 15 * px, italic: true, color: '#1a1a1a', anchor: 'middle-left', graphId: gid, opacity: 0.8 });
    if (yl) out.push({ kind: 'text', x: yAxisX, y: originY - wh / 2 - 13 * px, text: yl, size: 15 * px, italic: true, color: '#1a1a1a', anchor: 'middle-center', graphId: gid, opacity: 0.8 });
  }
  if (rec.rotation) for (const st of out) rotateStrokeAbout(st, originX, originY, rec.rotation);
  return out;
}

document.getElementById('graphPlace').onclick = () => {
  const latexFn = document.getElementById('g1d_fn').value;
  if (!latexFn.trim()) {
    state.editingGraphId = null;
    closeModal('graphModal');
    return;
  }
  const settings = readGraphSettings();
  let parsed;
  try { parsed = parseEquation(latexFn); }
  catch (err) { showGraphPreviewError('parse error: ' + err.message); return; }

  const old = state.editingGraphId && state.graphs[state.editingGraphId] ? state.graphs[state.editingGraphId] : null;
  const graphId = old ? state.editingGraphId : 'G' + nextGraphId;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width / 2, r.height / 2);
  const rec = old ? { ...old } : {
    originX: center.x, originY: center.y,
    screenSpan: Math.min(r.width * 0.7, 720),
    viewScale: state.view.scale,
    rotation: 0,
    color: state.penColor,
  };
  if (!rec.viewScale) rec.viewScale = state.view.scale;
  rec.graphId = graphId;
  rec.latex = latexFn;
  rec.settings = settings;
  rec.is3D = is3DKind(parsed.kind);

  let strokes;
  try { strokes = buildGraphStrokes(rec, parsed); }
  catch (err) { showGraphPreviewError(/^no (plot data|surface)/.test(err.message) ? err.message : 'parse error: ' + err.message); return; }

  const previousActiveLayerId = state.activeLayerId;
  let layer = old ? state.layers.find(l => l.id === old.layerId) : null;
  if (!layer) {
    const labelTrunc = parsed.original.length > 32 ? parsed.original.slice(0, 32) + '…' : parsed.original;
    layer = makeLayer('Plot: ' + labelTrunc);
    state.layers.unshift(layer);
  }
  if (!old) nextGraphId++;
  layer.strokes = layer.strokes.filter(st => st.graphId !== graphId).concat(strokes);
  rec.layerId = layer.id;
  state.graphs[graphId] = rec;
  if (!old) state.activeLayerId = previousActiveLayerId;
  state.editingGraphId = null;
  closeModal('graphModal');
  setTool('pen');
  render();
  renderLayerList();
  pushHistory(old ? 'Edit graph' : 'Add graph');
};

// Open the graph modal pre-filled with an existing graph's source and switch to edit mode.
function openGraphModalForGraphId(graphId) {
  const g = state.graphs[graphId];
  if (!g) return;
  state.editingGraphId = graphId;
  document.getElementById('g1d_fn').value = g.latex;
  graphYAutoSet = false;
  graphMode3D = !g.is3D;
  setGraphMode(!!g.is3D);
  writeGraphSettings({ ...defaultGraphSettings(), ...(g.settings || {}) });
  document.getElementById('graphModal').style.display = 'flex';
  renderLatexPreview('g1d_render', g.latex);
  ensureGraphDeps().then(previewGraph);
}

/* =========================================================================
   HISTORY — snapshot-based with click-to-restore
   ========================================================================= */

// Each entry: { id, label, time, snapshot }
// snapshot is a deep-clone of the relevant state needed to restore.
// state.historyIndex points at the "current" entry. Entries after it are "future" (redoable).
// We snapshot the initial state and after every meaningful action.

function snapshotState() {
  // Deep-clone layers (without DOM refs) and embeds (without DOM elements - those are recreated)
  const layers = state.layers.map(layer => ({
    id: layer.id,
    name: layer.name,
    visible: layer.visible,
    base: !!layer.base,
    strokes: layer.strokes.map(cloneStroke),
    embeds: layer.embeds.map(em => ({
      id: em.id,
      type: em.type,
      x: em.x, y: em.y, w: em.w, h: em.h,
      rotation: em.rotation || 0,
      data: { ...em.data },
    })),
  }));
  return {
    layers,
    activeLayerId: state.activeLayerId,
    nextLayerId,
    nextEmbedId,
    nextGraphId,
    graphs: JSON.parse(JSON.stringify(state.graphs || {})),
  };
}

function restoreSnapshot(snap) {
  // Tear down existing embed DOM
  for (const layer of state.layers) {
    for (const em of layer.embeds) em.el && em.el.remove();
  }
  // Cancel any selection
  if (state.selection) {
    for (const em of state.selection.embeds) em.el && em.el.remove();
  }
  state.selection = null;

  // Rebuild layers with fresh embed DOM elements
  state.layers = snap.layers.map(layer => ({
    id: layer.id,
    name: layer.name,
    visible: layer.visible,
    base: !!layer.base,
    strokes: layer.strokes.map(cloneStroke),
    embeds: [],
  }));

  // Recreate embed DOM and attach to their layers
  for (let i = 0; i < snap.layers.length; i++) {
    const snapLayer = snap.layers[i];
    const layer = state.layers[i];
    for (const ed of snapLayer.embeds) {
      const em = createEmbedFromData(ed.type, { ...ed.data }, ed.x, ed.y, ed.w, ed.h);
      em.id = ed.id;
      em.rotation = ed.rotation;
      em.el.dataset.embedId = em.id;
      layer.embeds.push(em);
    }
  }

  state.activeLayerId = snap.activeLayerId;
  // Make sure active layer exists; fall back to last layer
  if (!state.layers.find(l => l.id === state.activeLayerId)) {
    state.activeLayerId = state.layers.length ? state.layers[state.layers.length - 1].id : null;
  }
  nextLayerId = snap.nextLayerId;
  nextEmbedId = snap.nextEmbedId;
  if (snap.nextGraphId) nextGraphId = snap.nextGraphId;
  state.graphs = JSON.parse(JSON.stringify(snap.graphs || {}));

  renderLayerList();
  render();
}

let nextHistoryId = 1;
function pushHistory(label) {
  // If we're not at the end (because of undo), drop "future" entries
  if (state.historyIndex < state.history.length - 1) {
    state.history = state.history.slice(0, state.historyIndex + 1);
  }
  const entry = {
    id: 'H' + (nextHistoryId++),
    label,
    time: new Date(),
    snapshot: snapshotState(),
  };
  state.history.push(entry);
  // Cap at 80 entries to control memory; drop oldest
  if (state.history.length > 80) {
    state.history.shift();
  }
  state.historyIndex = state.history.length - 1;
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  restoreSnapshot(state.history[state.historyIndex].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  restoreSnapshot(state.history[state.historyIndex].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function jumpToHistory(idx) {
  if (idx < 0 || idx >= state.history.length) return;
  state.historyIndex = idx;
  restoreSnapshot(state.history[idx].snapshot);
  renderHistoryPanel();
  syncUndoRedoButtons();
}

function syncUndoRedoButtons() {
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if (undoBtn) undoBtn.classList.toggle('disabled', state.historyIndex <= 0);
  if (redoBtn) redoBtn.classList.toggle('disabled', state.historyIndex >= state.history.length - 1);
}

function renderHistoryPanel() {
  const list = document.getElementById('historyList');
  if (!list) return;
  list.innerHTML = '';
  // Oldest first (top), newest at bottom
  for (let i = 0; i < state.history.length; i++) {
    const entry = state.history[i];
    const row = document.createElement('div');
    row.className = 'history-row';
    if (i === state.historyIndex) row.classList.add('current');
    if (i > state.historyIndex) row.classList.add('future');
    const marker = document.createElement('span');
    marker.className = 'history-marker';
    row.appendChild(marker);
    const text = document.createElement('span');
    text.className = 'history-text';
    text.textContent = entry.label;
    row.appendChild(text);
    row.onclick = () => jumpToHistory(i);
    list.appendChild(row);
  }
  // Auto-scroll to keep the current item visible (defaults to bottom for fresh actions)
  const currentRow = list.querySelector('.history-row.current');
  if (currentRow) currentRow.scrollIntoView({ block: 'nearest' });
}

/* =========================================================================
   TOOLS HOOKUP
   ========================================================================= */
document.getElementById('toolCluster').addEventListener('click', (e) => {
  const btn = e.target.closest('.tool'); if (!btn) return;
  setTool(btn.dataset.tool);
});

function setTool(t) {
  if (state.graphInteract) { exitGraphInteract(); }
  state.tool = t;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  if (t !== 'select') cancelSelection();
  if (t === 'graph') {
    // Don't re-open the modal if it's already showing
    const gm = document.getElementById('graphModal');
    if (gm.style.display !== 'flex') openGraphModal();
  }
  // Axes tools: insert immediately at viewport center, then revert to pen
  if (t === 'axes2d' || t === 'axes3d') {
    insertAxes(t);
    state.tool = 'pen';
    document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === 'pen'));
    canvas.style.cursor = 'crosshair';
    return;
  }
  if (t === 'pen') canvas.style.cursor = 'crosshair';
  else if (t === 'eraser') canvas.style.cursor = 'none';
  else if (t === 'select') canvas.style.cursor = 'crosshair';
  else if (t === 'text') canvas.style.cursor = 'text';
  else canvas.style.cursor = 'default';
  // Sync size select to whichever tool's size is active now. The select only has fixed
  // common values; snap to the nearest one for display.
  const sizeInput = document.getElementById('penSize');
  if (sizeInput) {
    sizeInput.value = nearestSizeOption(activeToolSize());
  }
}

// Snap a numeric size to the nearest value in the size select's options.
function nearestSizeOption(target) {
  const opts = [1, 2, 4, 8, 16, 32, 64];
  let best = opts[0], bestDiff = Math.abs(opts[0] - target);
  for (const o of opts) {
    const d = Math.abs(o - target);
    if (d < bestDiff) { best = o; bestDiff = d; }
  }
  return best;
}

// Recolor: debounce-push history so a continuous picker drag becomes one undo step.
// We track whether the current "recolor session" has affected anything so we only push when needed.
let _recolorPending = null;
let _recolorAffected = false;
function commitRecolorHistory() {
  _recolorPending = null;
  if (!_recolorAffected) return;
  _recolorAffected = false;
  if (state.selection && (state.selection.strokes.length || state.selection.embeds.length)) {
    // Commit the lifted selection so the recolored strokes/embeds are captured by snapshotState
    commitSelection();
  }
  pushHistory('Recolor');
}
document.getElementById('penColor').addEventListener('input', e => {
  const c = e.target.value;
  state.penColor = c;
  // If there's a current selection, recolor everything in it (strokes + text embeds).
  // Eraser strokes are skipped — color is meaningless for them.
  if (state.selection) {
    for (const s of state.selection.strokes) {
      if (s.mode !== 'eraser') s.color = c;
    }
    for (const em of state.selection.embeds) {
      if (em.type === 'text' && em.data) {
        em.data.color = c;
        if (em.el) em.el.style.color = c;
      }
    }
    render();
    _recolorAffected = true;
    if (_recolorPending) clearTimeout(_recolorPending);
    _recolorPending = setTimeout(commitRecolorHistory, 400);
  }
});
// Also fire on `change` (when the picker closes) as a backstop in case the timer hasn't fired.
document.getElementById('penColor').addEventListener('change', () => {
  if (_recolorPending) { clearTimeout(_recolorPending); commitRecolorHistory(); }
});
// Throttle bgColor renders to once per animation frame so the native color picker doesn't flicker
// (continuous render() calls during the input drag can starve the picker UI).
let _bgColorRafPending = false;
document.getElementById('bgColor').addEventListener('input', e => {
  state.bgColor = e.target.value;
  if (_bgColorRafPending) return;
  _bgColorRafPending = true;
  requestAnimationFrame(() => { _bgColorRafPending = false; render(); });
});
document.getElementById('penSize').addEventListener('change', e => {
  const v = parseInt(e.target.value, 10);
  setActiveToolSize(v);
  if (state.tool === 'eraser') render();
});
document.getElementById('sizeResetBtn').addEventListener('click', () => {
  // Default sizes per tool — keep these aligned with the initial state
  const defaults = { pen: 4, eraser: 32 };
  const def = defaults[state.tool];
  if (def === undefined) return;
  setActiveToolSize(def);
  document.getElementById('penSize').value = nearestSizeOption(def);
  if (state.tool === 'eraser') render();
});
// Size-lock toggle: when ON, captures the current zoom and uses it for all subsequent stroke
// widths, so strokes stay visually constant on screen as the user zooms.
document.getElementById('sizeLockBtn').addEventListener('click', () => {
  const btn = document.getElementById('sizeLockBtn');
  const icon = document.getElementById('sizeLockIcon');
  if (state.sizeLockedScale == null) {
    state.sizeLockedScale = state.view.scale;
    btn.classList.add('locked');
    btn.title = 'Unlock stroke size (L) — currently locked at ' + Math.round(state.view.scale * 100) + '% zoom';
    // Closed-padlock icon
    icon.innerHTML = '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V7 a4 4 0 0 1 8 0 V11"/>';
  } else {
    state.sizeLockedScale = null;
    btn.classList.remove('locked');
    btn.title = 'Lock stroke size to current zoom (L)';
    // Open-padlock icon
    icon.innerHTML = '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V7 a4 4 0 0 1 8 0"/>';
  }
});
document.getElementById('gridBtn').addEventListener('click', () => {
  state.showGrid = !state.showGrid;
  document.getElementById('gridBtn').classList.toggle('active', state.showGrid);
  render();
});
document.getElementById('resetViewBtn').onclick = () => { state.view = { x: 0, y: 0, scale: 1 }; render(); };
document.getElementById('undoBtn').onclick = undo;
document.getElementById('redoBtn').onclick = redo;
document.getElementById('resetBtn').onclick = () => {
  showConfirmModal(
    'Reset everything?',
    'This clears all layers, embeds, history, and settings.',
    doFullReset
  );
};

function doFullReset() {
  // Cancel any active selection first (remove its embed DOM nodes)
  if (state.selection) {
    for (const em of state.selection.embeds) em.el && em.el.remove();
    state.selection = null;
  }
  state.selDrag = null;

  // Remove ALL embeds from DOM by clearing the embed layer entirely (catches any orphans)
  embedLayer.innerHTML = '';

  // Reset core data state
  state.layers = [];
  state.history = [];
  state.historyIndex = -1;
  state.view = { x: 0, y: 0, scale: 1 };
  state.clipboard = null;
  state.currentStroke = null;
  state.drawing = false;
  state.panning = false;

  // Reset settings to defaults
  state.penColor = '#1a1a1a';
  state.bgColor = '#ffffff';
  state.penSize = 4;
  state.eraserSize = 32;
  state.showGrid = false;
  state.graphs = {};

  // Reset ID counters
  nextLayerId = 1;
  nextEmbedId = 1;
  nextHistoryId = 1;

  // Sync UI controls back to defaults
  document.getElementById('penColor').value = state.penColor;
  document.getElementById('bgColor').value = state.bgColor;
  document.getElementById('penSize').value = nearestSizeOption(activeToolSize());
  document.getElementById('gridBtn').classList.remove('active');

  // Close any open modals
  document.getElementById('graphModal').style.display = 'none';

  // Create a fresh starter layer
  const l = makeLayer('Sketch');
  l.base = true;
  state.layers.push(l);
  state.activeLayerId = l.id;

  // Update UI + render
  setTool('pen');
  renderLayerList();
  syncZoomSlider();
  render();

  // Snapshot the clean state as the new starting point
  pushHistory('Reset');
}

/* =========================================================================
   ZOOM SLIDER — log scale between min and max zoom
   ========================================================================= */
const ZOOM_MIN = 0.01, ZOOM_MAX = 40;

function zoomToSlider(scale) {
  // log scale: slider value 0..1000 maps to log(ZOOM_MIN)..log(ZOOM_MAX)
  const logMin = Math.log(ZOOM_MIN), logMax = Math.log(ZOOM_MAX);
  const t = (Math.log(scale) - logMin) / (logMax - logMin);
  return Math.max(0, Math.min(1000, Math.round(t * 1000)));
}
function sliderToZoom(value) {
  const logMin = Math.log(ZOOM_MIN), logMax = Math.log(ZOOM_MAX);
  const t = value / 1000;
  return Math.exp(logMin + t * (logMax - logMin));
}
function syncZoomSlider() {
  const slider = document.getElementById('zoomSlider');
  if (!slider) return;
  const v = zoomToSlider(state.view.scale);
  slider.value = v;
  // Update fill via CSS variable
  const pct = (v / 1000) * 100;
  slider.style.setProperty('--zoom-fill', pct + '%');
}
document.getElementById('zoomSlider').addEventListener('input', e => {
  const newScale = sliderToZoom(parseFloat(e.target.value));
  // Zoom around viewport center
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wp0 = screenToWorld(cx, cy);
  state.view.scale = newScale;
  const wp1 = screenToWorld(cx, cy);
  state.view.x += wp0.x - wp1.x;
  state.view.y += wp0.y - wp1.y;
  // Update fill
  const pct = (parseFloat(e.target.value) / 1000) * 100;
  e.target.style.setProperty('--zoom-fill', pct + '%');
  render();
});

// Zoom readout as a text input: click to type a percentage directly. Parses "150", "150%",
// or "1.5" (treated as 150%) and clamps to the zoom range. Enter commits, Escape reverts.
(function setupZoomReadoutInput() {
  const zoomEl = document.getElementById('zoomReadout');
  if (!zoomEl) return;
  const commit = () => {
    const raw = zoomEl.value.trim().replace(/%/g, '');
    let n = parseFloat(raw);
    if (!isFinite(n) || n <= 0) {
      // Reset to current on invalid input
      zoomEl.value = Math.round(state.view.scale * 100) + '%';
      return;
    }
    // Under 4 → treated as a direct multiplier (e.g. "1.5" → 150%); otherwise as a percentage.
    const targetScale = n < 4 ? n : n / 100;
    const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetScale));
    // Zoom around viewport center so the change stays visually anchored.
    const r = wrap.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wp0 = screenToWorld(cx, cy);
    state.view.scale = clamped;
    const wp1 = screenToWorld(cx, cy);
    state.view.x += wp0.x - wp1.x;
    state.view.y += wp0.y - wp1.y;
    render();  // triggers re-sync of the readout
  };
  zoomEl.addEventListener('focus', () => {
    // Show plain number without % on focus so typing is easier
    zoomEl.value = Math.round(state.view.scale * 100);
    zoomEl.select();
  });
  zoomEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); zoomEl.blur(); }
    else if (e.key === 'Escape') {
      // Restore without applying, then blur
      zoomEl.value = Math.round(state.view.scale * 100) + '%';
      zoomEl.blur();
    }
  });
  zoomEl.addEventListener('blur', commit);
})();

(function setupTooltips() {
  const tip = document.createElement('div');
  tip.className = 'ui-tip';
  document.body.appendChild(tip);
  let target = null, timer = null;
  const hide = () => { clearTimeout(timer); timer = null; target = null; tip.classList.remove('show'); };
  const place = (el) => {
    const r = el.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let top = r.bottom + 6;
    if (top + tr.height > window.innerHeight - 4) top = r.top - 6 - tr.height;
    const left = Math.max(4, Math.min(window.innerWidth - tr.width - 4, r.left + r.width / 2 - tr.width / 2));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };
  document.addEventListener('mouseover', (e) => {
    if (e.buttons) { hide(); return; }
    const el = e.target.closest && e.target.closest('[title], [data-tip]');
    if (el && el.hasAttribute('title')) {
      el.dataset.tip = el.getAttribute('title');
      el.removeAttribute('title');
    }
    if (el === target) return;
    hide();
    if (!el || !el.dataset.tip) return;
    target = el;
    timer = setTimeout(() => {
      if (target !== el || !el.isConnected) return;
      tip.textContent = el.dataset.tip;
      place(el);
      tip.classList.add('show');
    }, 350);
  });
  document.addEventListener('mousedown', hide, true);
  document.addEventListener('keydown', hide, true);
  document.addEventListener('wheel', hide, { passive: true, capture: true });
  document.documentElement.addEventListener('mouseleave', hide);
  window.addEventListener('blur', hide);
})();

/* =========================================================================
   KEYBOARD
   ========================================================================= */
document.addEventListener('keydown', (e) => {
  if (state.graphInteract && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
    if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); exitGraphInteract(); return; }
    if (!['Shift', 'Meta', 'Control', 'Alt'].includes(e.key)) exitGraphInteract();
  }
  // Escape closes any open modal regardless of focus context
  if (e.key === 'Escape') {
    const confirmM = document.getElementById('confirmModal');
    const graphM = document.getElementById('graphModal');
    if (confirmM.style.display !== 'none') {
      confirmM.style.display = 'none';
      _confirmCallback = null;
      return;
    }
    if (graphM.style.display !== 'none') { closeModal('graphModal'); return; }
    if (state.selection) { cancelSelection(); return; }
  }

  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;

  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); redo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c') { copySelection(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'v') { pasteClipboard(); return; }

  if (e.key === 'Backspace' || e.key === 'Delete') {
    if (state.selection) { e.preventDefault(); deleteSelection(); }
    return;
  }
  if (e.key === 'Enter') { if (state.selection) { e.preventDefault(); commitSelection(); } return; }

  // Tool hotkeys (letters and digits)
  const k = e.key.toLowerCase();
  if (k === 'l') { document.getElementById('sizeLockBtn').click(); return; }
  if (k === 'p') setTool('pen');
  else if (k === 'e') setTool('eraser');
  else if (k === 's') setTool('select');
  else if (k === 't') setTool('text');
  else if (k === '1') { e.preventDefault(); setTool('graph'); }
  else if (k === '2') setTool('axes2d');
  else if (k === '3') setTool('axes3d');
});

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
  if (id === 'graphModal') {
    state.editingGraphId = null;
  }
  if (state.tool === 'text' || state.tool === 'graph') setTool('pen');
}
document.querySelectorAll('[data-close]').forEach(b => {
  b.addEventListener('click', () => closeModal(b.dataset.close));
});

/* In-page confirm modal — works in sandboxed iframes where window.confirm is blocked */
let _confirmCallback = null;
function showConfirmModal(title, message, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmModal').style.display = 'flex';
  _confirmCallback = onConfirm;
  // Focus the Confirm button so Enter activates it (and Tab stays inside the modal).
  setTimeout(() => document.getElementById('confirmOk').focus(), 50);
}
document.getElementById('confirmOk').addEventListener('click', () => {
  document.getElementById('confirmModal').style.display = 'none';
  const cb = _confirmCallback;
  _confirmCallback = null;
  if (cb) cb();
});
document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmModal').style.display = 'none';
  _confirmCallback = null;
});
// Enter inside the open confirm modal triggers Confirm regardless of which element has focus.
document.getElementById('confirmModal').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('confirmOk').click();
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
function boardData() {
  const snap = snapshotState();
  const sel = state.selection;
  if (sel && sel.lifted) {
    const L = snap.layers.find(l => l.id === sel.layerId);
    if (L) {
      L.strokes.push(...sel.strokes.map(cloneStroke));
      L.embeds.push(...sel.embeds.map(em => ({ id: em.id, type: em.type, x: em.x, y: em.y, w: em.w, h: em.h, rotation: em.rotation || 0, data: { ...em.data } })));
    }
  }
  return { app: 'chiplot', version: 1, snapshot: snap, view: { ...state.view }, bgColor: state.bgColor };
}

function applyBoard(data, label, freshHistory) {
  if (!data || !data.snapshot || !Array.isArray(data.snapshot.layers) || !data.snapshot.layers.length) {
    throw new Error('not a board file');
  }
  if (state.graphInteract) exitGraphInteract(true);
  if (document.querySelector('.embed.editing')) document.querySelector('.embed.editing').blur();
  restoreSnapshot(data.snapshot);
  const v = data.view;
  if (v && isFinite(v.scale) && v.scale > 0) state.view = { x: +v.x || 0, y: +v.y || 0, scale: Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +v.scale)) };
  if (typeof data.bgColor === 'string' && /^#[0-9a-f]{6}$/i.test(data.bgColor)) {
    state.bgColor = data.bgColor;
    document.getElementById('bgColor').value = data.bgColor;
  }
  if (freshHistory) { state.history = []; state.historyIndex = -1; }
  syncZoomSlider();
  render();
  pushHistory(label);
}

function downloadBoard() {
  const blob = new Blob([JSON.stringify(boardData())], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chiplot-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const _boardFileInput = document.createElement('input');
_boardFileInput.type = 'file';
_boardFileInput.accept = '.json,application/json';
_boardFileInput.style.display = 'none';
document.body.appendChild(_boardFileInput);
_boardFileInput.addEventListener('change', () => {
  const f = _boardFileInput.files[0];
  _boardFileInput.value = '';
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { applyBoard(JSON.parse(reader.result), 'Open file', false); }
    catch (_) { showConfirmModal("Couldn't open that file", "It isn't a χplot board file.", () => {}); }
  };
  reader.readAsText(f);
});
document.getElementById('openBoardBtn').addEventListener('click', () => _boardFileInput.click());
document.getElementById('saveBoardBtn').addEventListener('click', downloadBoard);

function init() {
  const l1 = makeLayer('Sketch');
  l1.base = true;
  state.layers.push(l1);
  state.activeLayerId = l1.id;
  renderLayerList();
  resizeCanvas();
  setTool('pen');
  syncZoomSlider();
  pushHistory('Start');
}
init();
</script></body></html>
