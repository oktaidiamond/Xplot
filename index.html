  const idMap = {};
  for (const st of newSel.strokes) {
    if (!st.graphId) continue;
    if (!(st.graphId in idMap)) {
      const nid = (st.graphId[0] === 'A' ? 'A' : 'G') + (nextGraphId++);
      idMap[st.graphId] = nid;
      const src = cb.graphs && cb.graphs[st.graphId];
      if (src) {
        const g = JSON.parse(JSON.stringify(src));
        g.originX += dx; g.originY += dy;
        g.layerId = layer.id;
        g.graphId = nid;
        state.graphs[nid] = g;
      }
    }
    st.graphId = idMap[st.graphId];
  }
  for (const ed of cb.embedsData) {
    const em = createEmbedFromData(ed.type, { ...ed.data }, ed.x + dx, ed.y + dy, ed.w, ed.h);
    em.rotation = ed.rotation;
    em.el.classList.add('selected');
    newSel.embeds.push(em);
  }
  newSel._origCx = newSel.bbox.x + newSel.bbox.w/2;
  newSel._origCy = newSel.bbox.y + newSel.bbox.h/2;
  state.selection = newSel;
  setTool('select');
  ensureSelectionOrigin();
  render();
  pushHistory('Paste');
}

// Make sure the selection has its origin (centre) recorded — used by resize math.
function ensureSelectionOrigin() {
  const sel = state.selection; if (!sel) return;
  if (sel._origCx === undefined) {
    sel._origCx = sel.bbox.x + sel.bbox.w/2;
    sel._origCy = sel.bbox.y + sel.bbox.h/2;
  }
}

/* =========================================================================
   EMBEDS
   ========================================================================= */
let nextEmbedId = 1;
function createEmbedFromData(type, data, x, y, w, h) {
  const el = document.createElement('div');
  el.className = 'embed' + (type === 'text' ? ' text-embed' : '');
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  if (type === 'text') {
    el.style.fontFamily = "'KaTeX_Main', 'Latin Modern Roman', 'Computer Modern', 'CMU Serif', Georgia, serif";
    el.style.fontSize = data.size + 'px';
    el.style.color = data.color;
    el.style.lineHeight = '1.3';
    el.style.whiteSpace = 'pre-wrap';
    el.innerHTML = textToHTML(data.text, true);
    renderTextMath(el);
  }
  embedLayer.appendChild(el);
  const em = { id: 'E' + (nextEmbedId++), type, data, x, y, w, h, el, rotation: 0 };
  el.dataset.embedId = em.id;
  if (type === 'text') fitTextEmbedToContent(em);

  attachEmbedDrag(em);
  return em;
}

function attachEmbedDrag(em) {
  em.el.addEventListener('pointerdown', (e) => {
    // If this embed is currently being edited inline, let the contenteditable handle the click
    if (em.el.classList.contains('editing')) return;
    if (state.tool === 'select' && state.selection && state.selection.embeds.includes(em) && hitSelectionHandle(eventScreenCoords(e))) {
      e.stopPropagation();
      canvasPointerDown(e);
      return;
    }
    // If a DIFFERENT embed is being edited, commit it first (the blur listener fires
    // exitTextEditMode). Don't proceed to drag this embed — let the user click again to act.
    const otherEditing = document.querySelector('.embed.editing');
    if (otherEditing) {
      e.stopPropagation();
      otherEditing.blur();
      return;
    }
    e.stopPropagation();
    // Special case: text tool + text embed → enter edit mode instead of selecting for transform.
    // The tool stays as 'text' while editing; exitTextEditMode switches to pen on commit, so
    // the next click after editing doesn't trigger another text placement.
    if (state.tool === 'text' && em.type === 'text') {
      if (state.selection) cancelSelection();
      enterTextEditMode(em);
      return;
    }
    // If this embed is already part of the current selection, set up a move-drag against
    // that selection (don't re-lift, which would fail because the embed is no longer in any layer).
    // For text embeds: if the second click doesn't drag, treat it as a request to enter edit mode
    // (more reliable than relying on a precise double-click with pointer capture).
    if (state.selection && state.selection.embeds.includes(em)) {
      const sp = eventScreenCoords(e);
      const wp = screenToWorld(sp.x, sp.y);
      state.selDrag = {
        mode: 'move',
        startWx: wp.x, startWy: wp.y,
        startBx: state.selection.bbox.x, startBy: state.selection.bbox.y,
        startSx: sp.x, startSy: sp.y,
        editOnClick: em.type === 'text' ? em : null,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    // Clicking an embed (in any tool except text-on-text) auto-switches to select mode and lifts it as a selection,
    // so rotate/resize handles appear immediately and the user can drag to move.
    const layer = state.layers.find(l => l.embeds.includes(em));
    if (!layer) return;
    if (state.tool !== 'select') setTool('select');
    cancelSelection();
    const sel = {
      layerId: layer.id,
      bbox: { x: em.x, y: em.y, w: em.w, h: em.h },
      strokes: [], embeds: [em],
      rotation: 0, scale: 1, lifted: true,
    };
    sel._origCx = em.x + em.w/2; sel._origCy = em.y + em.h/2;
    layer.embeds = layer.embeds.filter(e => e !== em);
    em.el.classList.add('selected');
    state.selection = sel;
    const sp = eventScreenCoords(e);
    const wp = screenToWorld(sp.x, sp.y);
    state.selDrag = { mode: 'move', startWx: wp.x, startWy: wp.y, startBx: sel.bbox.x, startBy: sel.bbox.y };
    canvas.setPointerCapture(e.pointerId);
    ensureSelectionOrigin(); render();
  });
  em.el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    if (em.type === 'text') {
      if (state.selection) cancelSelection();
      enterTextEditMode(em);
    }
  });
}

/* =========================================================================
   INLINE TEXT EDITING
   ========================================================================= */
function placeInlineText(wx, wy) {
  const layer = activeLayer(); if (!layer) return;
  const size = 28 / state.view.scale;
  const w = TEXT_BOX_DEFAULT_W / state.view.scale;
  const data = { text: '', size, color: '#1a1a1a', autoW: true, maxW: w };
  const em = createEmbedFromData('text', data, wx - 0.2 * size, wy - 0.77 * size, w, 1.54 * size);
  layer.embeds.push(em);
  render();
  // Immediately enter edit mode. The tool stays as 'text' until the user commits the edit
  // (clicks outside, hits Escape, or Cmd+Enter); exitTextEditMode then switches to pen so
  // the next click doesn't place another text box.
  enterTextEditMode(em, /*isNew=*/ true);
}

// Place an image from a File or Blob at the given world coords. The natural image
// dimensions are used (scaled into world units), with a sensible cap so massive photos
// don't fill the whole canvas. The image is stored as a `kind: 'image'` stroke on its
// own dedicated layer — drawn into the canvas via the per-layer offscreen render so it
// behaves correctly with layer order, visibility, and the eraser.
function placeImageFromBlob(blob, wx, wy) {
  if (!blob || !blob.type || !blob.type.startsWith('image/')) return;
  const previousActiveLayerId = state.activeLayerId;
  const reader = new FileReader();
  reader.onload = () => {
    const dataURL = reader.result;
    const probe = new Image();
    probe.onload = () => {
      const naturalW = probe.naturalWidth || 200;
      const naturalH = probe.naturalHeight || 200;
      const r = wrap.getBoundingClientRect();
      const maxWorldW = (r.width * 0.6) / state.view.scale;
      const maxWorldH = (r.height * 0.6) / state.view.scale;
      let worldW = naturalW / state.view.scale;
      let worldH = naturalH / state.view.scale;
      const scale = Math.min(1, maxWorldW / worldW, maxWorldH / worldH);
      worldW *= scale;
      worldH *= scale;
      const baseName = (blob.name || 'Image').replace(/\.[^.]+$/, '');
      const labelTrunc = baseName.length > 32 ? baseName.slice(0, 32) + '…' : baseName;
      const imageLayer = makeLayer('Image: ' + labelTrunc);
      state.layers.unshift(imageLayer);
      imageLayer.strokes.push({
        kind: 'image',
        x: wx - worldW/2,
        y: wy - worldH/2,
        w: worldW, h: worldH,
        src: dataURL,
      });
      state.activeLayerId = previousActiveLayerId;
      renderLayerList();
      render();
      pushHistory('Add image');
    };
    probe.src = dataURL;
  };
  reader.readAsDataURL(blob);
}

function enterTextEditMode(em, isNew) {
  if (em._editing) return;
  em._editing = true;
  em._editStartText = em.data.text || '';  // capture for change-detection on exit
  // Switch to text tool universally on entering edit mode — the toolbar reflects what
  // the user is doing (typing), and exitTextEditMode switches back to pen on commit.
  if (state.tool !== 'text') setTool('text');
  em.el.classList.add('editing');
  // Show raw source text (with no LaTeX rendering) so the user can edit it
  em.el.contentEditable = 'true';
  em.el.spellcheck = false;
  em.el.style.whiteSpace = 'pre-wrap';
  em.el.style.cursor = 'text';
  // CRITICAL: don't seed contenteditable with raw \n characters — Chromium's contenteditable
  // models lines via <br>/<div>, NOT \n in text nodes. If we put \n chars in the text node,
  // then the user inserts a new line, Chromium wraps the new content in a <div> while leaving
  // the original \n in the text node — and readRawSourceFromEl ends up counting BOTH (the \n
  // AND the implicit line from the <div>), producing one extra phantom newline.
  // Convert each \n to a <br> tag up front so the DOM uses one consistent model.
  em.el.innerHTML = textToHTML(em.data.text, false);
  // Resize the bounding box to fit the (potentially wider) raw source — switching from
  // rendered LaTeX to source can expand the text width.
  fitTextEmbedToContent(em);
  render();
  // Defer focus and caret placement until after the current click event cycle finishes,
  // otherwise the pointerup that follows pointerdown can steal focus back.
  setTimeout(() => {
    em.el.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(em.el);
    range.collapse(false);
    sel.removeAllRanges(); sel.addRange(range);
  }, 0);

  // No live LaTeX rendering — the user sees their raw source while editing and only gets
  // the rendered math when they exit the textbox (blur, Escape, or Cmd/Ctrl+Enter).
  const onInput = () => {
    em.data.text = readRawSourceFromEl(em.el);
    fitTextEmbedToContent(em);
    render();
  };
  let done = false;
  let inserting = false;
  const finish = () => {
    if (done) return;
    done = true;
    em.el.removeEventListener('input', onInput);
    em.el.removeEventListener('keydown', onKeydown);
    em.el.removeEventListener('beforeinput', onBeforeInput);
    em.el.removeEventListener('blur', onBlur);
    if (document.activeElement === em.el) em.el.blur();
    const s = window.getSelection();
    if (s) s.removeAllRanges();
    exitTextEditMode(em, isNew);
  };
  const onKeydown = (e) => {
    e.stopPropagation();
    if (e.isComposing) return;
    const fmt = { b: 'bold', i: 'italic', u: 'underline' }[e.key.toLowerCase()];
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && fmt) {
      e.preventDefault();
      document.execCommand(fmt);
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      finish();
    } else if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      inserting = true;
      document.execCommand('insertText', false, '\n');
      inserting = false;
      em.data.text = readRawSourceFromEl(em.el);
      fitTextEmbedToContent(em);
      render();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      finish();
    }
  };
  const onBeforeInput = (e) => {
    if (inserting) return;
    if (e.inputType === 'insertParagraph') {
      e.preventDefault();
      finish();
    }
  };
  const onBlur = () => finish();
  em.el.addEventListener('input', onInput);
  em.el.addEventListener('keydown', onKeydown);
  em.el.addEventListener('beforeinput', onBeforeInput);
  em.el.addEventListener('blur', onBlur);
}

// Reconstruct raw source text from an editable element. Math spans (rendered LaTeX)
// keep their original delimited source in data-math-source — use that instead of the
// visible rendered text, so we don't lose the user's actual input.
function readRawSourceFromEl(root) {
  const runs = [];
  let cur = { b: false, i: false, u: false };
  let any = false;
  const styleOf = (el) => {
    const f = { b: false, i: false, u: false };
    if (!el || el === root || !root.contains(el)) return f;
    const cs = getComputedStyle(el);
    const n = parseInt(cs.fontWeight, 10);
    f.b = (isNaN(n) ? (/bold/.test(cs.fontWeight) ? 700 : 400) : n) >= 600;
    f.i = cs.fontStyle === 'italic' || cs.fontStyle.startsWith('oblique');
    for (let a = el; a && a !== root; a = a.parentElement) {
      if ((getComputedStyle(a).textDecorationLine || '').includes('underline')) { f.u = true; break; }
    }
    return f;
  };
  const emit = (str, el) => {
    if (!str) return;
    cur = styleOf(el);
    runs.push({ t: str.replace(STYLE_MARK_RE, ''), ...cur });
    any = true;
  };
  const newline = () => { runs.push({ t: '\n', ...cur }); any = true; };
  const isBlock = (el) => el.tagName === 'DIV' || el.tagName === 'P';
  const isPlaceholderBR = (br) => {
    let blk = br.parentElement;
    while (blk && blk !== root && !isBlock(blk)) blk = blk.parentElement;
    if (!blk || blk === root) return false;
    return blk.textContent === '' && blk.querySelectorAll('br').length === 1;
  };
  const walk = (node) => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        emit(child.textContent, child.parentElement);
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.dataset && child.dataset.mathSource) emit(child.dataset.mathSource, child.parentElement);
        else if (child.tagName === 'BR') { if (!isPlaceholderBR(child)) newline(); }
        else if (isBlock(child)) { if (any) newline(); walk(child); any = true; }
        else walk(child);
      }
    }
  };
  walk(root);
  return serializeStyled(runs);
}

function exitTextEditMode(em, wasNew) {
  em._editing = false;
  em.el.classList.remove('editing');
  em.el.contentEditable = 'false';
  em.el.style.cursor = 'grab';
  // Snapshot the current raw source from the DOM (reading math spans' data-math-source).
  // This is more reliable than em.data.text which might be stale if a live-render happened
  // between the last input event and blur.
  em.data.text = readRawSourceFromEl(em.el);
  const txt = plainText(em.data.text).trim();
  // If empty, delete the embed
  if (!txt) {
    const layer = state.layers.find(l => l.embeds.includes(em));
    if (layer) layer.embeds = layer.embeds.filter(x => x !== em);
    em.el.remove();
    render();
    setTool('pen');
    return;
  }
  // Final render: full LaTeX rendering using renderMathInElement.
  //
  // Display-math delimiters (\[...\], $$...$$) render as block elements, which means the math
  // is ALWAYS on its own line — its leading edge naturally absorbs one preceding newline.
  // To get symmetric behavior on the trailing edge (so 1 trailing \n is also "absorbed"),
  // we strip ONE \n immediately after each display-math closer. We do NOT strip the leading
  // \n — the block's intrinsic line break already handles that. Result: each user-typed \n
  // adjacent to display math is invisible (absorbed), and additional \n produce visible
  // blank lines symmetrically above and below.
  em.el.innerHTML = textToHTML(em.data.text, true);
  renderTextMath(em.el);
  fitTextEmbedToContent(em);
  render();
  // Only push history if the text actually changed (or it's a new embed being added).
  // Re-opening an embed and immediately closing without changes shouldn't pollute history.
  const changed = (em.data.text !== em._editStartText);
  if (wasNew || changed) {
    pushHistory(wasNew ? 'Add text' : 'Edit text');
  }
  em._editStartText = undefined;
  // After exiting a text edit (whether the user committed changes or not), default to the
  // pen tool so the next click on the canvas isn't interpreted as another text placement.
  setTool('pen');
}

function renderTextMath(el) {
  if (!window.renderMathInElement) return;
  try {
    window.renderMathInElement(el, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$',  right: '$',  display: false },
      ],
      throwOnError: false,
    });
  } catch (_) {}
}

function fitTextEmbedToContent(em) {
  const el = em.el;
  const size = em.data.size;
  let fpx = textFontPx(size, state.view.scale);
  if (fpx < 8) fpx = 16;
  const ls = fpx / size;
  const prev = { t: el.style.transform, w: el.style.width, h: el.style.height, f: el.style.fontSize };
  el.style.transform = 'none';
  el.style.fontSize = fpx + 'px';
  if (em.data.autoW) {
    el.style.height = 'auto';
    el.style.width = 'max-content';
    const natPx = el.getBoundingClientRect().width;
    const maxW = em.data.maxW || em.w;
    em.w = Math.min(maxW, Math.max(size * 1.5, natPx * 1.02 / ls + size * 0.08));
  }
  el.style.width = (em.w * ls) + 'px';
  el.style.height = 'auto';
  const hPx = el.getBoundingClientRect().height;
  el.style.transform = prev.t; el.style.width = prev.w; el.style.height = prev.h; el.style.fontSize = prev.f;
  em.h = Math.max(hPx / ls, size * 1.54);
}

function positionEmbeds() {
  for (const layer of state.layers) {
    for (const em of layer.embeds) updateEmbedTransform(em, false);
  }
  if (state.selection) {
    for (const em of state.selection.embeds) updateEmbedTransform(em, true);
  }
}

function updateEmbedTransform(em, inSel) {
  const v = state.view;
  if (em.type === 'text') {
    let left, top, fs, rot;
    if (inSel) {
      const sel = state.selection;
      const sc = sel.scale || 1;
      const rotSel = (sel.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(rotSel), sin = Math.sin(rotSel);
      const dx = em.x + em.w/2 - sel._origCx, dy = em.y + em.h/2 - sel._origCy;
      const cx = sel.bbox.x + sel.bbox.w/2 + (dx * cos - dy * sin) * sc;
      const cy = sel.bbox.y + sel.bbox.h/2 + (dx * sin + dy * cos) * sc;
      const tl = worldToScreen(cx - em.w * sc / 2, cy - em.h * sc / 2);
      left = tl.x; top = tl.y; fs = v.scale * sc;
      rot = (em.rotation || 0) + (sel.rotation || 0);
    } else {
      const tl = worldToScreen(em.x, em.y);
      left = tl.x; top = tl.y; fs = v.scale;
      rot = em.rotation || 0;
    }
    const fpx = textFontPx(em.data.size, fs);
    const ls = fpx / em.data.size;
    em.el.style.transformOrigin = '50% 50%';
    em.el.style.left = Math.round(left) + 'px';
    em.el.style.top = Math.round(top) + 'px';
    em.el.style.width = (em.w * ls) + 'px';
    em.el.style.height = (em.h * ls) + 'px';
    em.el.style.fontSize = fpx + 'px';
    em.el.style.transform = `rotate(${rot}deg)`;
    return;
  }
  if (inSel) {
    const sel = state.selection;
    const sc = sel.scale || 1;
    const rotSel = (sel.rotation || 0) * Math.PI / 180;
    const cos = Math.cos(rotSel), sin = Math.sin(rotSel);
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const dx = ecx - sel._origCx, dy = ecy - sel._origCy;
    const nx = (dx * cos - dy * sin) * sc;
    const ny = (dx * sin + dy * cos) * sc;
    const cx = sel.bbox.x + sel.bbox.w/2, cy = sel.bbox.y + sel.bbox.h/2;
    const newCx = nx + cx, newCy = ny + cy;
    const totalRot = (em.rotation || 0) + (sel.rotation || 0);
    const finalScale = v.scale * sc;
    const pxW = em.w * finalScale;
    const pxH = em.h * finalScale;
    const centerScreen = worldToScreen(newCx, newCy);
    em.el.style.transformOrigin = '50% 50%';
    // Pixel-snap position and font-size so the embed locks to whole-pixel boundaries.
    // Without snapping, embeds sub-pixel-drift relative to the canvas-drawn strokes
    // around them as zoom changes. Tradeoff: text "jumps" by 1 pixel each time zoom
    // crosses a rounding threshold instead of moving continuously — but alignment with
    // strokes is what matters for a math sketchpad.
    em.el.style.left = Math.round(centerScreen.x - pxW/2) + 'px';
    em.el.style.top  = Math.round(centerScreen.y - pxH/2) + 'px';
    em.el.style.width = pxW + 'px';
    em.el.style.height = pxH + 'px';
    em.el.style.transform = `rotate(${totalRot}deg)`;
    if (em.type === 'text') {
      em.el.style.fontSize = Math.round(em.data.size * finalScale) + 'px';
    }
  } else {
    const ecx = em.x + em.w/2, ecy = em.y + em.h/2;
    const centerScreen = worldToScreen(ecx, ecy);
    const pxW = em.w * v.scale;
    const pxH = em.h * v.scale;
    em.el.style.transformOrigin = '50% 50%';
    em.el.style.left = Math.round(centerScreen.x - pxW/2) + 'px';
    em.el.style.top  = Math.round(centerScreen.y - pxH/2) + 'px';
    em.el.style.width = pxW + 'px';
    em.el.style.height = pxH + 'px';
    em.el.style.transform = `rotate(${em.rotation || 0}deg)`;
    if (em.type === 'text') {
      em.el.style.fontSize = Math.round(em.data.size * v.scale) + 'px';
    }
  }
}

/* =========================================================================
   IMAGE INPUT — paste, drop, and file picker
   ========================================================================= */

// Hidden file input wired to the toolbar "Image" button. Multiple selection allowed so
// users can drop several images at once.
const _imageFileInput = document.createElement('input');
_imageFileInput.type = 'file';
_imageFileInput.accept = 'image/*';
_imageFileInput.multiple = true;
_imageFileInput.style.display = 'none';
document.body.appendChild(_imageFileInput);
_imageFileInput.addEventListener('change', () => {
  const files = [..._imageFileInput.files];
  _imageFileInput.value = '';  // reset so the same file can be re-picked
  if (!files.length) return;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width/2, r.height/2);
  // Stack multiple images with a small offset so they don't fully overlap
  files.forEach((f, i) => {
    placeImageFromBlob(f, center.x + i * 20 / state.view.scale, center.y + i * 20 / state.view.scale);
  });
});
document.getElementById('imageUploadBtn').addEventListener('click', () => {
  _imageFileInput.click();
});

// Paste: grab any image data from the clipboard and place it at the viewport center.
// Skipped when focus is in an input/textarea (the paste should target the field, not the
// canvas — e.g. pasting "y=sin(x)" into the equation field).
window.addEventListener('paste', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      if (!blob) continue;
      const r = wrap.getBoundingClientRect();
      const center = screenToWorld(r.width/2, r.height/2);
      placeImageFromBlob(blob, center.x, center.y);
      return;  // place only the first image
    }
  }
});

// Drag-and-drop: image files dropped onto the canvas are placed where the drop happens.
// Both dragover (with preventDefault to allow drop) and drop must be handled.
wrap.addEventListener('dragover', (e) => {
  // Only show the "copy" cursor when something draggable is involved (usually files).
  if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  }
});
wrap.addEventListener('drop', (e) => {
  const files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  const imageFiles = [...files].filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;
  e.preventDefault();
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);
  imageFiles.forEach((f, i) => {
    placeImageFromBlob(f, wp.x + i * 20 / state.view.scale, wp.y + i * 20 / state.view.scale);
  });
});

/* =========================================================================
   GRAPHS — LATEX → MATHJS
   ========================================================================= */
function latexToExpr(latex) {
  let s = latex;
  s = s.replace(/\\cdot/g, '*').replace(/\\times/g, '*').replace(/\\div/g, '/');
  s = s.replace(/\\pi/g, 'pi').replace(/\\theta/g, 'theta').replace(/\\alpha/g, 'alpha').replace(/\\beta/g, 'beta');
  s = s.replace(/\\left/g, '').replace(/\\right/g, '');
  for (let i = 0; i < 5; i++) s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '(($1)/($2))');
  for (let i = 0; i < 5; i++) s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, 'sqrt($1)');
  // Absolute value: |...| → abs(...). Iterate so nested bars resolve from the inside out
  // (each pass converts the innermost pair, where the contents have no further |).
  for (let i = 0; i < 5; i++) {
    const next = s.replace(/\|([^|]+)\|/g, 'abs($1)');
    if (next === s) break;
    s = next;
  }
  s = s.replace(/\\sin/g, 'sin').replace(/\\cos/g, 'cos').replace(/\\tan/g, 'tan');
  s = s.replace(/\\arcsin/g, 'asin').replace(/\\arccos/g, 'acos').replace(/\\arctan/g, 'atan');
  s = s.replace(/\\sinh/g, 'sinh').replace(/\\cosh/g, 'cosh').replace(/\\tanh/g, 'tanh');
  s = s.replace(/\\log/g, 'log10').replace(/\\ln/g, 'log').replace(/\\exp/g, 'exp');
  for (let i = 0; i < 5; i++) s = s.replace(/\^\{([^{}]*)\}/g, '^($1)');
  s = s.replace(/\s+/g, '');
  // Implicit multiplication between adjacent single-letter variables.
  // mathjs treats `xy` as an undefined symbol, not as `x*y`. We rewrite multi-letter
  // identifiers using greedy tokenization: at each position, consume the longest known
  // function/constant name; otherwise consume one character as a single-letter variable.
  // Then join the resulting tokens with `*`.
  const KNOWN = [
    // longest first matters for greedy matching
    'arcsin','arccos','arctan',
    'log10','sinh','cosh','tanh','sqrt','asin','acos','atan',
    'theta','alpha','beta',
    'sin','cos','tan','log','abs','exp',
    'ln','pi','e',
  ];
  // sort by length desc so the matcher always sees longer candidates first
  KNOWN.sort((a, b) => b.length - a.length);
  const tokenize = (id) => {
    const out = [];
    let i = 0;
    while (i < id.length) {
      // try matching a known name at i
      let matched = null;
      for (const name of KNOWN) {
        if (id.startsWith(name, i)) { matched = name; break; }
      }
      if (matched) { out.push(matched); i += matched.length; }
      else { out.push(id[i]); i++; }
    }
    return out.join('*');
  };
  s = s.replace(/[A-Za-z][A-Za-z0-9]*/g, (id) => {
    if (id.length === 1) return id;
    return tokenize(id);
  });
  return s;
}

// Normalize a user-entered equation into proper LaTeX for KaTeX rendering.
// User input might already be partial LaTeX (\sin, \pi, \frac{...}) or plain math syntax
// (sin(x), abs(xy), pi). We need to convert plain words like "sin", "cos", "abs", "pi" into
// \sin, \cos, \left|...\right|, \pi etc. without double-escaping things the user already typed.
function normalizeForLatex(s) {
  if (!s) return '';
  let out = s;
  // First convert abs(...) into \left|...\right| — bracket-balanced match.
  // Iterate so nested abs resolve from the inside out.
  for (let i = 0; i < 8; i++) {
    const next = out.replace(/\babs\s*\(([^()]*)\)/g, '\\left|$1\\right|');
    if (next === out) break;
    out = next;
  }
  // Function names: prepend backslash if the word is currently plain text (not already \name).
  // Order longest-first so e.g. "arcsin" matches before "sin" gets a chance.
  const fns = [
    'arcsin','arccos','arctan',
    'sinh','cosh','tanh',
    'sin','cos','tan',
    'log','ln','exp','sqrt','min','max',
  ];
  for (const fn of fns) {
    // Match the word but only when not preceded by a backslash (i.e. user didn't already write \fn).
    const re = new RegExp('(^|[^\\\\A-Za-z])' + fn + '(?![A-Za-z])', 'g');
    out = out.replace(re, (m, lead) => lead + '\\' + fn);
  }
  // Constants: pi, theta, alpha, beta — same treatment
  const consts = ['theta','alpha','beta','pi'];
  for (const c of consts) {
    const re = new RegExp('(^|[^\\\\A-Za-z])' + c + '(?![A-Za-z])', 'g');
    out = out.replace(re, (m, lead) => lead + '\\' + c);
  }
  // Convert `*` to `\cdot` for prettier rendering
  out = out.replace(/\*/g, ' \\cdot ');
  return out;
}

function renderLatexPreview(elemId, latex) {
  const el = document.getElementById(elemId); if (!el) return;
  const tex = normalizeForLatex(latex);
  try { katex.render(tex, el, { throwOnError: false, displayMode: false }); }
  catch (_) { el.textContent = latex; }
}

// Default settings for a new plot. Re-edit reuses the graph's stored settings instead.
function defaultGraphSettings() {
  return {
    xLabel: 'x', yLabel: 'y', zLabel: 'z',
    xMin: -10, xMax: 10,
    yMin: -6, yMax: 6,
    zMin: -10, zMax: 10,
    showTicks: false,
    showBox: true,
    azim: 25, elev: 20,
  };
}

const graph3DView = { azim: 25, elev: 20 };
let graphMode3D = false;
let graphYAutoSet = false;

function is3DKind(kind) {
  return kind === 'z_of_xy' || kind === 'x_of_yz' || kind === 'y_of_xz';
}

function setGraphMode(is3D) {
  if (is3D === graphMode3D) return;
  graphMode3D = is3D;
  document.querySelector('.graph-modal').classList.toggle('mode-3d', is3D);
  const yMin = document.getElementById('gs_yMin'), yMax = document.getElementById('gs_yMax');
  if (is3D && +yMin.value === -6 && +yMax.value === 6) {
    yMin.value = -10; yMax.value = 10; graphYAutoSet = true;
  } else if (!is3D && graphYAutoSet && +yMin.value === -10 && +yMax.value === 10) {
    yMin.value = -6; yMax.value = 6; graphYAutoSet = false;
  }
  updateFitButtonLabel();
}

function updateFitButtonLabel() {
  let v = 'y';
  if (graphMode3D) {
    v = 'z';
    try {
      const k = parseEquation(document.getElementById('g1d_fn').value).kind;
      if (k === 'x_of_yz') v = 'x';
      else if (k === 'y_of_xz') v = 'y';
    } catch (_) {}
  }
  const btn = document.getElementById('gs_autoFitBtn');
  btn.textContent = 'Fit ' + v + ' to plot';
  btn.title = 'Fit ' + v + ' range to function values';
}

function syncGraphModeFromInput() {
  const text = document.getElementById('g1d_fn').value.trim();
  if (!text) return;
  try { setGraphMode(is3DKind(parseEquation(text).kind)); } catch (_) {}
  updateFitButtonLabel();
}

// Validate min/max ordering on settings, falling back to defaults if reversed/equal.
// Mutates and returns the input for chaining; safe to call on a fresh copy of settings.
function validateGraphRanges(s) {
  if (!(s.xMax > s.xMin)) { s.xMin = -10; s.xMax = 10; }
  if (!(s.yMax > s.yMin)) { s.yMin = -6; s.yMax = 6; }
  if (!(s.zMax > s.zMin)) { s.zMin = -10; s.zMax = 10; }
  return s;
}

// Pick a "nice" tick spacing for a given range — one of 1, 2, 5 × 10^n — aiming for
// roughly `target` ticks across the range.
function niceTickStep(range, target) {
  if (!(range > 0)) return 1;
  const rough = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let nice;
  if (norm < 1.5) nice = 1;
  else if (norm < 3.5) nice = 2;
  else if (norm < 7.5) nice = 5;
  else nice = 10;
  return nice * mag;
}

// Read the current values from the settings inputs in the modal.
function readGraphSettings() {
  const num = (id, def) => {
    const v = parseFloat(document.getElementById(id).value);
    return isFinite(v) ? v : def;
  };
  return {
    xLabel: document.getElementById('gs_xLabel').value,
    yLabel: document.getElementById('gs_yLabel').value,
    zLabel: document.getElementById('gs_zLabel').value,
    xMin: num('gs_xMin', -10),
    xMax: num('gs_xMax', 10),
    yMin: num('gs_yMin', -6),
    yMax: num('gs_yMax', 6),
    zMin: num('gs_zMin', -10),
    zMax: num('gs_zMax', 10),
    showTicks: document.getElementById('gs_showTicks').checked,
    showBox: document.getElementById('gs_showBox').checked,
    azim: graph3DView.azim,
    elev: graph3DView.elev,
  };
}

// Write settings into the input fields.
function writeGraphSettings(s) {
  document.getElementById('gs_xLabel').value = s.xLabel ?? 'x';
  document.getElementById('gs_yLabel').value = s.yLabel ?? 'y';
  document.getElementById('gs_xMin').value = s.xMin ?? -10;
  document.getElementById('gs_xMax').value = s.xMax ?? 10;
  document.getElementById('gs_yMin').value = s.yMin ?? -6;
  document.getElementById('gs_yMax').value = s.yMax ?? 6;
  document.getElementById('gs_zLabel').value = s.zLabel ?? 'z';
  document.getElementById('gs_zMin').value = s.zMin ?? -10;
  document.getElementById('gs_zMax').value = s.zMax ?? 10;
  document.getElementById('gs_showTicks').checked = !!s.showTicks;
  document.getElementById('gs_showBox').checked = s.showBox ?? true;
  graph3DView.azim = s.azim ?? 25;
  graph3DView.elev = s.elev ?? 20;
}

// Wait until Plotly and mathjs are available. They're loaded with `defer` so the app
// boots fast; this is the gate that ensures the graph modal has what it needs.
function ensureGraphDeps() {
  return new Promise((resolve) => {
    if (typeof Plotly !== 'undefined' && typeof math !== 'undefined') {
      resolve(); return;
    }
    const start = Date.now();
    const tick = () => {
      if (typeof Plotly !== 'undefined' && typeof math !== 'undefined') resolve();
      else if (Date.now() - start > 10000) resolve();  // give up after 10s; modal will show errors
      else setTimeout(tick, 30);
    };
    tick();
  });
}

function openGraphModal() {
  // Show the modal immediately for responsiveness; the preview waits for deps.
  if (!state.editingGraphId) {
    document.getElementById('g1d_fn').value = '';
    document.getElementById('graphPreview_box').innerHTML = '';
    graphYAutoSet = false;
    setGraphMode(false);
    writeGraphSettings(defaultGraphSettings());
  }
  document.getElementById('graphModal').style.display = 'flex';
  renderLatexPreview('g1d_render', '');
  document.getElementById('g1d_fn').focus();
  // Render the preview as soon as Plotly/mathjs are ready. If they're already loaded,
  // this is effectively synchronous after the focus.
  ensureGraphDeps().then(previewGraph);
}

/* =========================================================================
   AXES — insert 1D / 2D / 3D coordinate systems as vector strokes.
   Strokes are stored in world units, so they pan/zoom/erase like everything else.
   ========================================================================= */
function insertAxes(kind) {
  const layer = activeLayer(); if (!layer) return;
  const r = wrap.getBoundingClientRect();
  const center = screenToWorld(r.width / 2, r.height / 2);

  const screenSpan = Math.min(r.width, r.height) * 0.6;
  const span = screenSpan / state.view.scale;
  const half = span / 2;
  const lineWidth = 2 / state.view.scale;
  const arrowLen = 9 / state.view.scale;
  const arrowWidth = 9 / state.view.scale;
  const color = state.penColor;
  // groupId so all axes from this call select/move together
  const groupId = 'A' + (nextGraphId++);

  const strokes = [];
  const axisStroke = (ax, ay, bx, by, ends) => {
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const px = -uy, py = ux;
    const pts = [];
    if (ends === 'both' || ends === 'neg') {
      const baseX = ax + ux * arrowLen, baseY = ay + uy * arrowLen;
      pts.push({ x: baseX + px * arrowWidth/2, y: baseY + py * arrowWidth/2 });
      pts.push({ x: ax, y: ay });
      pts.push({ x: baseX - px * arrowWidth/2, y: baseY - py * arrowWidth/2 });
      pts.push({ x: ax, y: ay });
    } else {
      pts.push({ x: ax, y: ay });
    }
    pts.push({ x: bx, y: by });
    if (ends === 'both' || ends === 'pos') {
      const baseX = bx - ux * arrowLen, baseY = by - uy * arrowLen;
      pts.push({ x: baseX + px * arrowWidth/2, y: baseY + py * arrowWidth/2 });
      pts.push({ x: bx, y: by });
      pts.push({ x: baseX - px * arrowWidth/2, y: baseY - py * arrowWidth/2 });
    }
    strokes.push({ points: pts, color, width: lineWidth, mode: 'pen', graphId: groupId, opacity: 0.5 });
  };

  if (kind === 'axes2d') {
    const cx = center.x, cy = center.y;
    axisStroke(cx - half, cy, cx + half, cy, 'both');
    axisStroke(cx, cy - half, cx, cy + half, 'both');
  } else if (kind === 'axes3d') {
    // 3D coordinate system, z-up, right-handed.
    // Each axis has length L (world units): |(L*cos θ, -L*sin θ)| = L*sqrt(cos²+sin²) = L.
    //
    // The xy-plane is tilted toward the viewer slightly (less flat than fully horizontal),
    // and rotated about z so x leans more toward the camera (more downward) and y is
    // pushed counter-clockwise away from the camera (more horizontal-right).
    // x and y remain perpendicular in world-space (they're true coord axes); their screen
    // projections aren't 90° apart due to oblique projection.
    //   z: angle =  90°  → straight up
    //   x: angle = 215°  → down-left, leaning toward viewer (35° below horizontal-left)
    //   y: angle =  -5°  → mostly horizontal-right, very slight downward
    // Right-hand rule: x × y = z. ✓
    const cx = center.x, cy = center.y;
    const L = half;
    const zAng =  90 * Math.PI / 180;
    axisStroke(cx, cy, cx + L * Math.cos(zAng), cy - L * Math.sin(zAng), 'pos');
    const xAng = 215 * Math.PI / 180;
    const xL = L * 0.85;  // slight shortening — diagonal axes appear longer than vertical/horizontal at the same length
    axisStroke(cx, cy, cx + xL * Math.cos(xAng), cy - xL * Math.sin(xAng), 'pos');
    const yAng =  -5 * Math.PI / 180;
    axisStroke(cx, cy, cx + L * Math.cos(yAng), cy - L * Math.sin(yAng), 'pos');
  }

  for (const s of strokes) layer.strokes.push(s);
  render();
  pushHistory(kind === 'axes2d' ? 'Add 2D axes' : 'Add 3D axes');
}

/* =========================================================================
   EQUATION PLOT — supports y = f(x), x = f(y), and implicit F(x,y) = 0.
   Placed as VECTOR STROKES (not an image), so it pans/zooms/edits like everything else.
   ========================================================================= */
// In-modal live preview: redraws via Plotly (static, non-interactive) as the user types,
// so they see the curve before placing. Debounced to avoid thrashing on every keystroke.
const _liveDebounce = { t: null };
function scheduleLivePreview() {
  if (_liveDebounce.t) clearTimeout(_liveDebounce.t);
  _liveDebounce.t = setTimeout(previewGraph, 120);
}
document.getElementById('g1d_fn').addEventListener('input', e => {
  renderLatexPreview('g1d_render', e.target.value);
  syncGraphModeFromInput();
  scheduleLivePreview();
});
document.getElementById('g1d_fn').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('graphPlace').click();
  }
});
// Document-level Enter: triggers Place when the graph modal is open and focus isn't in
// another text input. Typing in label/range fields and pressing Enter should NOT submit
// (let the field handle it normally) — only fire when focus is on the body or a non-input.
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const modal = document.getElementById('graphModal');
  if (!modal || modal.style.display === 'none') return;
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
  e.preventDefault();
  document.getElementById('graphPlace').click();
});

// Settings inputs: any change triggers a live re-render of the preview.
for (const id of ['gs_xLabel','gs_yLabel','gs_zLabel','gs_xMin','gs_xMax','gs_yMin','gs_yMax','gs_zMin','gs_zMax']) {
  document.getElementById(id).addEventListener('input', scheduleLivePreview);
}
for (const id of ['gs_yMin','gs_yMax']) {
  document.getElementById(id).addEventListener('input', () => { graphYAutoSet = false; });
}
document.getElementById('gs_showTicks').addEventListener('change', scheduleLivePreview);
document.getElementById('gs_showBox').addEventListener('change', scheduleLivePreview);

// "fit y to plot" button: sample the function over the current x range and pick a y range
// that's symmetric about y=0 (so the x-axis stays centered) and contains all function values.
document.getElementById('gs_autoFitBtn').addEventListener('click', () => {
  const fnText = document.getElementById('g1d_fn').value.trim();
  if (!fnText) return;
  let parsed;
  try { parsed = parseEquation(fnText); } catch (_) { return; }
  if (is3DKind(parsed.kind)) { autoFit3D(parsed); return; }
  if (parsed.kind !== 'y_of_x') return;  // only meaningful for y=f(x)
  const num = (id, def) => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : def; };
  let xMin = num('gs_xMin', -10), xMax = num('gs_xMax', 10);
  if (!(xMax > xMin)) { xMin = -10; xMax = 10; }
  try {
    const compiled = math.compile(parsed.expr);
    let lo = Infinity, hi = -Infinity;
    const N = 400;
    for (let i = 0; i <= N; i++) {
      const x = xMin + (xMax - xMin) * i / N;
      let v; try { v = compiled.evaluate({x}); } catch (_) { v = NaN; }
      if (typeof v === 'number' && isFinite(v)) {
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    if (!isFinite(lo) || !isFinite(hi) || hi <= lo) return;
    // Clamp to a sane absolute bound so a single divergent value doesn't ruin the fit.
    lo = Math.max(lo, -1e6); hi = Math.min(hi, 1e6);
    // Make the range symmetric about 0: use the larger absolute value as the half-range.
    const half = Math.max(Math.abs(lo), Math.abs(hi)) * 1.1 || 1;
    document.getElementById('gs_yMin').value = +(-half).toFixed(4);
    document.getElementById('gs_yMax').value = +half.toFixed(4);
    scheduleLivePreview();
  } catch (_) {}
});

// Scroll on the preview to zoom in/out. Zoom is symmetric about each axis's midpoint, so
// scrolling preserves the visible center. Wheel-up zooms in (smaller range), wheel-down out.
document.getElementById('graphPreview_box').addEventListener('wheel', (e) => {
  e.preventDefault();
  const num = (id, def) => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : def; };
  let xMin = num('gs_xMin', -10), xMax = num('gs_xMax', 10);
  let yMin = num('gs_yMin', -6), yMax = num('gs_yMax', 6);
  if (!(xMax > xMin)) { xMin = -10; xMax = 10; }
  if (!(yMax > yMin)) { yMin = -6; yMax = 6; }
  // Multiplier: each notch is ~10% zoom. deltaY > 0 = scroll down = zoom out.
  const factor = Math.pow(1.0015, e.deltaY);
  const xc = (xMin + xMax) / 2, halfX = (xMax - xMin) / 2 * factor;
  const yc = (yMin + yMax) / 2, halfY = (yMax - yMin) / 2 * factor;
  // Round to a sane precision to keep the input fields readable.
  const round = v => Math.abs(v) >= 100 ? +v.toFixed(1) : +v.toFixed(4);
  document.getElementById('gs_xMin').value = round(xc - halfX);
  document.getElementById('gs_xMax').value = round(xc + halfX);
  document.getElementById('gs_yMin').value = round(yc - halfY);
  document.getElementById('gs_yMax').value = round(yc + halfY);
  if (graphMode3D) {
    let zMin = num('gs_zMin', -10), zMax = num('gs_zMax', 10);
    if (!(zMax > zMin)) { zMin = -10; zMax = 10; }
    const zc = (zMin + zMax) / 2, halfZ = (zMax - zMin) / 2 * factor;
    document.getElementById('gs_zMin').value = round(zc - halfZ);
    document.getElementById('gs_zMax').value = round(zc + halfZ);
  }
  graphYAutoSet = false;
  scheduleLivePreview();
}, { passive: false });

// Show an error message inside the graph preview box. Used by previewGraph and the
// place handler when the equation can't be parsed or doesn't produce any output.
function showGraphPreviewError(message) {
  const box = document.getElementById('graphPreview_box');
  box.innerHTML =
    '<div style="padding:20px;color:#a64a3a;font-family:var(--mono);font-size:12px">' +
    escapeHTML(message) +
    '</div>';
}

function previewGraph() {
  const box = document.getElementById('graphPreview_box');
  // Defer-loaded deps may not be ready yet on the first preview call; bail and let the
  // openGraphModal promise call us again once they're ready.
  if (typeof Plotly === 'undefined' || typeof math === 'undefined') {
    box.innerHTML = '<div style="padding:20px;color:var(--chrome-text-soft);font-family:var(--mono);font-size:11px;letter-spacing:0.04em">loading…</div>';
    return;
  }
  const fnText = document.getElementById('g1d_fn').value.trim();
  const settings = readGraphSettings();
  // Validate ranges; fall back to defaults if user typed nonsense (min ≥ max).
  let { xMin, xMax, yMin, yMax } = settings;
  if (!(xMax > xMin)) { xMin = -10; xMax = 10; }
  if (!(yMax > yMin)) { yMin = -6; yMax = 6; }

  if (graphMode3D) {
    let parsed = null;
    if (fnText) {
      try { parsed = parseEquation(fnText); }
      catch (err) { showGraphPreviewError('parse error: ' + err.message); return; }
    }
    if (!parsed || is3DKind(parsed.kind)) {
      try { preview3D(parsed, settings); }
      catch (err) { showGraphPreviewError('parse error: ' + err.message); }
      return;
    }
  }

  // Empty input → render bare axes only (no curve), so the preview is always present.
  if (!fnText) {
    const layout = baseLayout(settings, xMin, xMax, yMin, yMax);
    plot2D(box, [], layout);
    return;
  }
  let traces = [], layout = {};
  try {
    const parsed = parseEquation(fnText);

    layout = baseLayout(settings, xMin, xMax, yMin, yMax);
    if (parsed.kind === 'y_of_x') {
      const compiled = math.compile(parsed.expr);
      const xs = [], ys = [];
      const N = 400;
      for (let i = 0; i <= N; i++) {
        const x = xMin + (xMax - xMin) * i / N;
        try { ys.push(compiled.evaluate({x})); xs.push(x); } catch (_) { ys.push(null); xs.push(x); }
      }
      traces = [{ x: xs, y: ys, mode: 'lines', line: { color: '#2b3a5f', width: 2 } }];
    } else if (parsed.kind === 'x_of_y') {
      const compiled = math.compile(parsed.expr);
      const xs = [], ys = [];
      const N = 240;
      for (let i = 0; i <= N; i++) {
        const y = yMin + (yMax - yMin) * i / N;
        try { xs.push(compiled.evaluate({y})); ys.push(y); } catch (_) { xs.push(null); ys.push(y); }
      }
      traces = [{ x: xs, y: ys, mode: 'lines', line: { color: '#2b3a5f', width: 2 } }];
    } else if (parsed.kind === 'implicit') {
      const compiled = math.compile(parsed.expr);
      const NX = 160, NY = 96;
      const dx = (xMax - xMin) / NX, dy = (yMax - yMin) / NY;
      const F = new Float64Array((NX+1)*(NY+1));
      for (let j = 0; j <= NY; j++) for (let i = 0; i <= NX; i++) {
        const x = xMin + i*dx, y = yMin + j*dy;
        let v; try { v = compiled.evaluate({x, y}); } catch(_) { v = NaN; }
        F[j*(NX+1)+i] = (typeof v === 'number' && isFinite(v)) ? v : NaN;
      }
      const interp = (a, b, fa, fb) => { const t = fa/(fa-fb); return [a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])]; };
      const xs = [], ys = [];
      for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
        const f00=F[j*(NX+1)+i], f10=F[j*(NX+1)+i+1], f01=F[(j+1)*(NX+1)+i], f11=F[(j+1)*(NX+1)+i+1];
        if (isNaN(f00)||isNaN(f10)||isNaN(f01)||isNaN(f11)) continue;
        const code = (f00>0?1:0)|(f10>0?2:0)|(f11>0?4:0)|(f01>0?8:0);
        if (code === 0 || code === 15) continue;
        const x0=xMin+i*dx, x1=x0+dx, y0=yMin+j*dy, y1=y0+dy;
        const c00=[x0,y0], c10=[x1,y0], c11=[x1,y1], c01=[x0,y1];
        const eb = () => interp(c00,c10,f00,f10);
        const er = () => interp(c10,c11,f10,f11);
        const et = () => interp(c01,c11,f01,f11);
        const el = () => interp(c00,c01,f00,f01);
        let segs=[];
        switch(code){
          case 1:case 14: segs=[[el(),eb()]]; break;
          case 2:case 13: segs=[[eb(),er()]]; break;
          case 4:case 11: segs=[[er(),et()]]; break;
          case 8:case 7:  segs=[[et(),el()]]; break;
          case 3:case 12: segs=[[el(),er()]]; break;
          case 6:case 9:  segs=[[eb(),et()]]; break;
          case 5:  segs=[[el(),et()],[eb(),er()]]; break;
          case 10: segs=[[el(),eb()],[et(),er()]]; break;
        }
        for (const [a,b] of segs) {
          xs.push(a[0], b[0], null);
          ys.push(a[1], b[1], null);
        }
      }
      traces = [{ x: xs, y: ys, mode: 'lines', line: { color: '#2b3a5f', width: 2 } }];
    }
    plot2D(box, traces, layout);
  } catch (err) {
    showGraphPreviewError('parse error: ' + err.message);
  }
}

function plot2D(box, traces, layout) {
  const cfg = { staticPlot: true, displayModeBar: false, responsive: true };
  if (box.querySelector('canvas.p3d') || !box.querySelector('.plot-container')) {
    try { Plotly.purge(box); } catch (_) {}
    box.innerHTML = '';
    Plotly.newPlot(box, traces, layout, cfg);
  } else {
    Plotly.react(box, traces, layout, cfg);
  }
}

function baseLayout(settings, xMin, xMax, yMin, yMax) {
  const xAxis = {
    title: settings.xLabel || '',
    gridcolor: '#e8e6df',
    zerolinecolor: '#c9c5b8',
    range: [xMin, xMax],
  };
  const yAxis = {
    title: settings.yLabel || '',
    gridcolor: '#e8e6df',
    zerolinecolor: '#c9c5b8',
    range: [yMin, yMax],
  };
  for (const ax of [xAxis, yAxis]) {
    ax.showline = !!settings.showBox;
    ax.mirror = !!settings.showBox;
    ax.linecolor = '#c9c5b8';
  }
  if (settings.showTicks) {
    // Auto-pick a "nice" step for each axis based on its range, aiming for ~10 ticks across.
    xAxis.dtick = niceTickStep(xMax - xMin, 10);
    yAxis.dtick = niceTickStep(yMax - yMin, 10);
    xAxis.showticklabels = true;
    yAxis.showticklabels = true;
    xAxis.ticks = 'outside';
    yAxis.ticks = 'outside';
  } else {
    xAxis.showticklabels = false;
    yAxis.showticklabels = false;
    xAxis.ticks = '';
    yAxis.ticks = '';
  }
  return {
    margin: { l: 44, r: 20, t: 20, b: 40 },
    paper_bgcolor: '#ffffff',
    plot_bgcolor: '#ffffff',
    font: { family: 'Fraunces, serif', size: 12, color: '#1a1a1a' },
    xaxis: xAxis,
    yaxis: yAxis,
    showlegend: false,
  };
}

// Parse a typed equation string into one of three structured forms:
//   { kind: 'y_of_x', expr }       — plot y = expr(x)
//   { kind: 'x_of_y', expr }       — plot x = expr(y)
//   { kind: 'implicit', expr }     — plot expr(x,y) = 0  (zero level set)
// Throws on parse failure. `original` keeps the raw user input for layer naming.
function parseEquation(latex) {
  const original = latex.trim();
  if (!original) throw new Error('empty equation');
  // Split on the FIRST "=" — anything beyond is RHS
  const eqIdx = original.indexOf('=');
  const usesVar = (expr, v) => new RegExp('(^|[^A-Za-z])' + v + '(?![A-Za-z])').test(expr);
  const unsupported3D = () => new Error("implicit 3D surfaces aren't supported — write it as z = f(x, y)");
  if (eqIdx < 0) {
    // No "=" at all: treat as bare RHS, default to y = expr(x)
    const expr = latexToExpr(original);
    if (usesVar(expr, 'z')) throw unsupported3D();
    if (usesVar(expr, 'y')) return { kind: 'z_of_xy', expr, original: 'z = ' + original };
    return { kind: 'y_of_x', expr, original: 'y = ' + original };
  }
  const lhsRaw = original.slice(0, eqIdx).trim();
  const rhsRaw = original.slice(eqIdx + 1).trim();
  {
    const lhs3 = lhsRaw.replace(/\s/g, '');
    const rhs3 = rhsRaw.replace(/\s/g, '');
    const lhsE = latexToExpr(lhsRaw), rhsE = latexToExpr(rhsRaw);
    if (lhs3 === 'z' || /^[a-zA-Z]\(x,y\)$/.test(lhs3)) {
      if (usesVar(rhsE, 'z')) throw unsupported3D();
      return { kind: 'z_of_xy', expr: rhsE, original };
    }
    if (rhs3 === 'z') {
      if (usesVar(lhsE, 'z')) throw unsupported3D();
      return { kind: 'z_of_xy', expr: lhsE, original };
    }
    if (lhs3 === 'x' && usesVar(rhsE, 'z')) {
      if (usesVar(rhsE, 'x')) throw unsupported3D();
      return { kind: 'x_of_yz', expr: rhsE, original };
    }
    if (lhs3 === 'y' && usesVar(rhsE, 'z')) {
      if (usesVar(rhsE, 'y')) throw unsupported3D();
      return { kind: 'y_of_xz', expr: rhsE, original };
    }
    if (usesVar(lhsE, 'z') || usesVar(rhsE, 'z')) throw unsupported3D();
  }

  // Detect explicit forms by examining the LHS:
  //   y, f(x), g(x), h(x), F(x), etc. → y_of_x with rhs as expr in x
  //   x, p(y), q(y) → x_of_y
  // Anything else → implicit
  const lhs = lhsRaw.replace(/\s/g, '');
  const yOfX = /^([a-zA-Z]\(x\)|y)$/.test(lhs);
  const xOfY = /^([a-zA-Z]\(y\)|x)$/.test(lhs);

  if (yOfX) {
    return { kind: 'y_of_x', expr: latexToExpr(rhsRaw), original };
  }
  if (xOfY) {
    return { kind: 'x_of_y', expr: latexToExpr(rhsRaw), original };
  }
  // Implicit: F(x,y) = G(x,y) → form expr = (LHS) - (RHS), find zero level set
  const lhsExpr = latexToExpr(lhsRaw);
  const rhsExpr = latexToExpr(rhsRaw);
  return { kind: 'implicit', expr: '(' + lhsExpr + ')-(' + rhsExpr + ')', original };
}

// Generate vector stroke segments for any of the three equation kinds.
// Output coordinates are in world units (origin at originX, originY), with the
// math viewport (settings.xMin..xMax) × (yMin..yMax) mapped into a screen-space box of
// `screenSpan` pixels wide.
function generateEquationStrokes(parsed, settings, originX, originY, screenSpan, viewScale, graphId, color, fast) {
  let { xMin: xmin, xMax: xmax, yMin: ymin, yMax: ymax } = settings;
  if (!(xmax > xmin)) { xmin = -10; xmax = 10; }
  if (!(ymax > ymin)) { ymin = -6; ymax = 6; }

  // The placed graph always occupies a fixed world-space box: screenSpan wide × 60% tall.
  // Independent ux/uy scales map each axis's math range into the same world extent regardless
  // of how wide or narrow the user set it, so changing the range zooms the plot in/out
  // rather than resizing the graph.
  const worldWidth = screenSpan / viewScale;
  const worldHeight = worldWidth * 0.6;
  const ux = worldWidth / (xmax - xmin);
  const uy = worldHeight / (ymax - ymin);
  const lineWidth = 2 / viewScale;

  // Convert math coords to world coords. Origin (0,0) maps to (originX, originY) in world space
  // IF that's inside the math range; otherwise the math range is centered at the world origin.
  const W = (mx, my) => ({ x: originX + (mx - (xmin+xmax)/2) * ux, y: originY - (my - (ymin+ymax)/2) * uy });

  const compiled = math.compile(parsed.expr);
  let segments = [];

  if (parsed.kind === 'y_of_x') {
    const N = fast ? 300 : 600;
    let cur = [];
    let prevY = null;
    const flush = () => { if (cur.length >= 2) segments.push(cur); cur = []; };
    for (let i = 0; i <= N; i++) {
      const x = xmin + (xmax - xmin) * i / N;
      let y; try { y = compiled.evaluate({ x }); } catch (_) { y = NaN; }
      // Clip to the visible y range so the curve stays within the configured box.
      if (typeof y !== 'number' || !isFinite(y) || y > ymax || y < ymin) {
        flush(); prevY = null; continue;
      }
      // Break on sudden jumps (asymptotes) — proportional to the y range so it works
      // for any scale.
      if (prevY !== null && Math.abs(y - prevY) > (ymax - ymin) * 0.4) flush();
      cur.push(W(x, y));
      prevY = y;
    }
    flush();
  } else if (parsed.kind === 'x_of_y') {
    const N = 360;
    let cur = [];
    let prevX = null;
    const flush = () => { if (cur.length >= 2) segments.push(cur); cur = []; };
    for (let i = 0; i <= N; i++) {
      const y = ymin + (ymax - ymin) * i / N;
      let x; try { x = compiled.evaluate({ y }); } catch (_) { x = NaN; }
      // Clip to the visible x range
      if (typeof x !== 'number' || !isFinite(x) || x > xmax || x < xmin) {
        flush(); prevX = null; continue;
      }
      if (prevX !== null && Math.abs(x - prevX) > (xmax - xmin) * 0.4) flush();
      cur.push(W(x, y));
      prevX = x;
    }
    flush();
  } else if (parsed.kind === 'implicit') {
    // Marching squares on a fine grid: find zero contour of F(x,y).
    const NX = fast ? 90 : 200, NY = fast ? 54 : 120;
    const dx = (xmax - xmin) / NX;
    const dy = (ymax - ymin) / NY;
    const F = new Float64Array((NX + 1) * (NY + 1));
    for (let j = 0; j <= NY; j++) {
      const y = ymin + j * dy;
      for (let i = 0; i <= NX; i++) {
        const x = xmin + i * dx;
        let v; try { v = compiled.evaluate({ x, y }); } catch (_) { v = NaN; }
        F[j * (NX + 1) + i] = (typeof v === 'number' && isFinite(v)) ? v : NaN;
      }
    }
    const interp = (a, b, fa, fb) => {
      const t = fa / (fa - fb);
      return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
    };
    for (let j = 0; j < NY; j++) {
      for (let i = 0; i < NX; i++) {
        const f00 = F[j*(NX+1) + i];
        const f10 = F[j*(NX+1) + i + 1];
        const f01 = F[(j+1)*(NX+1) + i];
        const f11 = F[(j+1)*(NX+1) + i + 1];
        if (isNaN(f00) || isNaN(f10) || isNaN(f01) || isNaN(f11)) continue;
        const code =
          (f00 > 0 ? 1 : 0) |
          (f10 > 0 ? 2 : 0) |
          (f11 > 0 ? 4 : 0) |
          (f01 > 0 ? 8 : 0);
        if (code === 0 || code === 15) continue;
        const x0 = xmin + i * dx, x1 = x0 + dx;
        const y0 = ymin + j * dy, y1 = y0 + dy;
        const c00 = { x: x0, y: y0 };
        const c10 = { x: x1, y: y0 };
        const c11 = { x: x1, y: y1 };
        const c01 = { x: x0, y: y1 };
        const eb = () => interp(c00, c10, f00, f10);
        const er = () => interp(c10, c11, f10, f11);
        const et = () => interp(c01, c11, f01, f11);
        const el = () => interp(c00, c01, f00, f01);
        let segs = [];
        switch (code) {
          case 1:  case 14: segs = [[el(), eb()]]; break;
          case 2:  case 13: segs = [[eb(), er()]]; break;
          case 4:  case 11: segs = [[er(), et()]]; break;
          case 8:  case 7:  segs = [[et(), el()]]; break;
          case 3:  case 12: segs = [[el(), er()]]; break;
          case 6:  case 9:  segs = [[eb(), et()]]; break;
          case 5:  segs = [[el(), et()], [eb(), er()]]; break;
          case 10: segs = [[el(), eb()], [et(), er()]]; break;
        }
        for (const [a, b] of segs) {
          segments.push([ W(a.x, a.y), W(b.x, b.y) ]);
        }
      }
    }
  }

  return segments.map(pts => ({
    points: pts,
    color: color || state.penColor,
    width: lineWidth,
    mode: 'pen',
    graphId,
  }));
}

// Build 2D axes stroke list (single polyline for x, single for y), centered at (originX, originY).
// The placed axes always span a fixed world-space box (screenSpan wide × 60% tall), with the
// math range stretched to fill it — so changing xMin/xMax/yMin/yMax adjusts the visible math
// extent without changing the physical size of the placed graph.
// If settings.showTicks, also draws small perpendicular tick marks at auto-picked nice steps.
function buildAxes2DStrokes(settings, originX, originY, screenSpan, viewScale, graphId, color) {
  let { xMin: xmin, xMax: xmax, yMin: ymin, yMax: ymax } = settings;
  if (!(xmax > xmin)) { xmin = -10; xmax = 10; }
  if (!(ymax > ymin)) { ymin = -6; ymax = 6; }
  const worldWidth = screenSpan / viewScale;
  const worldHeight = worldWidth * 0.6;
  const ux = worldWidth / (xmax - xmin);
  const uy = worldHeight / (ymax - ymin);
  const cxMath = (xmin + xmax) / 2;
  const cyMath = (ymin + ymax) / 2;
  // World half-spans of the axes (constant — don't depend on math range)
  const halfX = worldWidth / 2;
  const halfY = worldHeight / 2;
  // Where in world coords the math origin (0,0) actually is:
  const ox = originX + (0 - cxMath) * ux;
  const oy = originY - (0 - cyMath) * uy;
  // But the axis LINES extend across the full visible math range — so the x-axis line goes
  // from (xmin, 0) to (xmax, 0), i.e. world (originX - halfX, oy) to (originX + halfX, oy).
  // (Only valid if 0 is inside the y range; otherwise draw the x-axis at the closest edge.)
  const axisY_math = (0 >= ymin && 0 <= ymax) ? 0 : (Math.abs(ymin) < Math.abs(ymax) ? ymin : ymax);
  const axisX_math = (0 >= xmin && 0 <= xmax) ? 0 : (Math.abs(xmin) < Math.abs(xmax) ? xmin : xmax);
  const xAxisWorldY = originY - (axisY_math - cyMath) * uy;
  const yAxisWorldX = originX + (axisX_math - cxMath) * ux;

  const lineWidth = 2 / viewScale;
  const arrowLen = 9 / viewScale;
  const arrowWidth = 9 / viewScale;
  const tickLen = 5 / viewScale;
  const out = [];

  // Helper: build an arrowed-line stroke for one axis.
  const makeAxis = (ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const dirX = dx / len, dirY = dy / len;
    const perpX = -dirY, perpY = dirX;
    const pts = [];
    let baseX = ax + dirX * arrowLen, baseY = ay + dirY * arrowLen;
    pts.push({ x: baseX + perpX * arrowWidth/2, y: baseY + perpY * arrowWidth/2 });
    pts.push({ x: ax, y: ay });
    pts.push({ x: baseX - perpX * arrowWidth/2, y: baseY - perpY * arrowWidth/2 });
    pts.push({ x: ax, y: ay });
    pts.push({ x: bx, y: by });
    baseX = bx - dirX * arrowLen; baseY = by - dirY * arrowLen;
    pts.push({ x: baseX + perpX * arrowWidth/2, y: baseY + perpY * arrowWidth/2 });
    pts.push({ x: bx, y: by });
    pts.push({ x: baseX - perpX * arrowWidth/2, y: baseY - perpY * arrowWidth/2 });
    out.push({ points: pts, color, width: lineWidth, mode: 'pen', graphId, opacity: 0.5 });
  };

  // x axis: spans world x = originX - halfX → originX + halfX, at the chosen y line
  makeAxis(originX - halfX, xAxisWorldY, originX + halfX, xAxisWorldY);
  // y axis: spans world y = originY - halfY → originY + halfY, at the chosen x line
  makeAxis(yAxisWorldX, originY - halfY, yAxisWorldX, originY + halfY);

  // Tick marks (if enabled). Each tick is a tiny perpendicular line.
  // Step is auto-picked per axis based on its range, so the count of ticks stays sane
  // regardless of how wide or narrow the user's range is.
  if (settings.showTicks) {
    const xStep = niceTickStep(xmax - xmin, 10);
    const yStep = niceTickStep(ymax - ymin, 10);
    const maxTicks = 200;
    const xStart = Math.ceil(xmin / xStep) * xStep;
    const yStart = Math.ceil(ymin / yStep) * yStep;
    // Math-coord thresholds for where the arrows sit at each axis endpoint. Any tick
    // within this distance of the axis tip would be overdrawn by the arrowhead, so we
    // skip those for a cleaner look.
    const xArrowZone = arrowLen / ux;
    const yArrowZone = arrowLen / uy;
    let xCount = 0, yCount = 0;
    for (let v = xStart; v <= xmax + xStep * 0.001 && xCount < maxTicks; v += xStep, xCount++) {
      if (Math.abs(v) < xStep * 0.0001) continue;  // skip the origin tick
      if (v < xmin + xArrowZone || v > xmax - xArrowZone) continue;  // under an arrow
      const wx = originX + (v - cxMath) * ux;
      out.push({
        points: [
          { x: wx, y: xAxisWorldY - tickLen/2 },
          { x: wx, y: xAxisWorldY + tickLen/2 },
        ],
        color, width: lineWidth, mode: 'pen', graphId, opacity: 0.5,
      });
    }
    for (let v = yStart; v <= ymax + yStep * 0.001 && yCount < maxTicks; v += yStep, yCount++) {
      if (Math.abs(v) < yStep * 0.0001) continue;
      if (v < ymin + yArrowZone || v > ymax - yArrowZone) continue;  // under an arrow
      const wy = originY - (v - cyMath) * uy;
      out.push({
        points: [
          { x: yAxisWorldX - tickLen/2, y: wy },
          { x: yAxisWorldX + tickLen/2, y: wy },
        ],
        color, width: lineWidth, mode: 'pen', graphId, opacity: 0.5,
      });
    }
  }

  return out;
}

// Compute tick-label positions and values for a placed graph. Returns an array of
// { x, y, text, anchor } where (x, y) is the world position to place the text and
// anchor describes alignment ('top-center' for x-axis labels, 'middle-right' for y-axis).
// Skips ticks under the arrow zones and the origin (which is covered by the axis cross).
function computeTickLabels(settings, originX, originY, screenSpan, viewScale) {
  let { xMin: xmin, xMax: xmax, yMin: ymin, yMax: ymax } = settings;
  if (!(xmax > xmin)) { xmin = -10; xmax = 10; }
  if (!(ymax > ymin)) { ymin = -6; ymax = 6; }
  const worldWidth = screenSpan / viewScale;
  const worldHeight = worldWidth * 0.6;
  const ux = worldWidth / (xmax - xmin);
  const uy = worldHeight / (ymax - ymin);
  const cxMath = (xmin + xmax) / 2;
  const cyMath = (ymin + ymax) / 2;
  const axisY_math = (0 >= ymin && 0 <= ymax) ? 0 : (Math.abs(ymin) < Math.abs(ymax) ? ymin : ymax);
  const axisX_math = (0 >= xmin && 0 <= xmax) ? 0 : (Math.abs(xmin) < Math.abs(xmax) ? xmin : xmax);
  const xAxisWorldY = originY - (axisY_math - cyMath) * uy;
  const yAxisWorldX = originX + (axisX_math - cxMath) * ux;
  const arrowLen = 9 / viewScale;
  const tickLen = 5 / viewScale;
  const labelGap = 3 / viewScale;  // tight space between tick mark and label text

  const xStep = niceTickStep(xmax - xmin, 10);
  const yStep = niceTickStep(ymax - ymin, 10);
  const xArrowZone = arrowLen / ux;
  const yArrowZone = arrowLen / uy;

  // Format tick values: integers stay clean, decimals trimmed to step's precision.
  const fmt = (v, step) => {
    if (Math.abs(v) < step * 0.0001) return '0';
    const decimals = step >= 1 ? 0 : Math.max(0, -Math.floor(Math.log10(step)));
    return Number(v.toFixed(decimals)).toString();
  };

  const labels = [];
  const xStart = Math.ceil(xmin / xStep) * xStep;
  const yStart = Math.ceil(ymin / yStep) * yStep;
  for (let v = xStart, n = 0; v <= xmax + xStep * 0.001 && n < 200; v += xStep, n++) {
    if (Math.abs(v) < xStep * 0.0001) continue;
    if (v < xmin + xArrowZone || v > xmax - xArrowZone) continue;
    const wx = originX + (v - cxMath) * ux;
    labels.push({ x: wx, y: xAxisWorldY + tickLen/2 + labelGap, text: fmt(v, xStep), anchor: 'top-center' });
  }
  for (let v = yStart, n = 0; v <= ymax + yStep * 0.001 && n < 200; v += yStep, n++) {
    if (Math.abs(v) < yStep * 0.0001) continue;
    if (v < ymin + yArrowZone || v > ymax - yArrowZone) continue;
    const wy = originY - (v - cyMath) * uy;
    labels.push({ x: yAxisWorldX - tickLen/2 - labelGap, y: wy, text: fmt(v, yStep), anchor: 'middle-right' });
  }
  return labels;
}

/* =========================================================================
   3D SURFACES — z = f(x, y), x = f(y, z), y = f(x, z)
   Orthographic projection of the [min,max]^3 box normalized to a cube, painter's-sorted
   into filled quads + line segments, placed as a single 'polys' stroke.
   ========================================================================= */
const SURFACE_N = 44;

function ranges3D(settings) {
  const r = (a, b, da, db) => (b > a ? [a, b] : [da, db]);
  return {
    x: r(settings.xMin, settings.xMax, -10, 10),
    y: r(settings.yMin, settings.yMax, -10, 10),
    z: r(settings.zMin, settings.zMax, -10, 10),
  };
}

function axisAnchor(lo, hi) {
  if (0 >= lo && 0 <= hi) return 0;
  return Math.abs(lo) < Math.abs(hi) ? lo : hi;
}

function sample3D(parsed, settings, N) {
  const R = ranges3D(settings);
  const map = { z_of_xy: ['x', 'y', 'z'], x_of_yz: ['y', 'z', 'x'], y_of_xz: ['x', 'z', 'y'] }[parsed.kind];
  const [uName, vName, dName] = map;
  const compiled = math.compile(parsed.expr);
  const [u0, u1] = R[uName], [v0, v1] = R[vName], [d0, d1] = R[dName];
  const norm = (val, [a, b]) => (val - (a + b) / 2) / ((b - a) / 2);
  const cnt = (N + 1) * (N + 1);
  const pts = new Float64Array(cnt * 3);
  const dep = new Float64Array(cnt);
  const ok = new Uint8Array(cnt);
  const idx = { x: 0, y: 1, z: 2 };
  const eps = (d1 - d0) * 1e-9;
  let any = false;
  for (let j = 0; j <= N; j++) {
    const v = v0 + (v1 - v0) * j / N;
    for (let i = 0; i <= N; i++) {
      const u = u0 + (u1 - u0) * i / N;
      const k = j * (N + 1) + i;
      let val;
      try { val = compiled.evaluate({ [uName]: u, [vName]: v }); } catch (_) { val = NaN; }
      if (typeof val !== 'number' || !isFinite(val)) continue;
      const nd = norm(val, R[dName]);
      if (Math.abs(nd) > 1e6) continue;
      pts[k * 3 + idx[uName]] = norm(u, R[uName]);
      pts[k * 3 + idx[vName]] = norm(v, R[vName]);
      pts[k * 3 + idx[dName]] = nd;
      dep[k] = nd;
      ok[k] = 1;
      if (val >= d0 - eps && val <= d1 + eps) any = true;
    }
  }
  return { N, pts, dep, ok, any, di: idx[dName] };
}

function clipPolyDep(poly, di) {
  const clip = (pl, keep, bound) => {
    const out = [];
    for (let i = 0; i < pl.length; i++) {
      const a = pl[i], b = pl[(i + 1) % pl.length];
      const ka = keep(a[di]), kb = keep(b[di]);
      if (ka) out.push(a);
      if (ka !== kb) {
        const t = (bound - a[di]) / (b[di] - a[di]);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]);
      }
    }
    return out;
  };
  let r = clip(poly, v => v <= 1, 1);
  if (r.length < 3) return r;
  r = clip(r, v => v >= -1, -1);
  return r;
}

function surfaceColor(t, shade) {
  const stops = [[40, 72, 135], [110, 150, 205], [232, 200, 135]];
  const tt = Math.max(0, Math.min(1, t)) * 2;
  const i = Math.min(1, Math.floor(tt));
  const f = tt - i;
  const a = stops[i], b = stops[i + 1];
  const ch = (k) => Math.round((a[k] + (b[k] - a[k]) * f) * shade);
  return 'rgb(' + ch(0) + ',' + ch(1) + ',' + ch(2) + ')';
}

function hexToRgba(hex, alpha) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  const n = m ? parseInt(m[1], 16) : 0x1a1a1a;
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function fmtTick(v, step) {
  if (Math.abs(v) < step * 0.0001) return '0';
  const decimals = step >= 1 ? 0 : Math.max(0, -Math.floor(Math.log10(step)));
  return Number(v.toFixed(decimals)).toString();
}

function build3DScene(sample, settings, cx, cy, unit, px, axisColor) {
  const th = (settings.azim ?? 25) * Math.PI / 180;
  const ph = (settings.elev ?? 20) * Math.PI / 180;
  const ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
  const rv = [-st, ct, 0], uv = [-sp * ct, -sp * st, cp], dv = [cp * ct, cp * st, sp];
  const proj = (x, y, z) => [cx + unit * (rv[0] * x + rv[1] * y), cy - unit * (uv[0] * x + uv[1] * y + uv[2] * z), dv[0] * x + dv[1] * y + dv[2] * z];
  const L = [0.3 * rv[0] + 0.6 * uv[0] + 0.75 * dv[0], 0.3 * rv[1] + 0.6 * uv[1] + 0.75 * dv[1], 0.6 * uv[2] + 0.75 * dv[2]];
  const Ll = Math.hypot(L[0], L[1], L[2]);
  const items = [];
  const labels = [];
  const lineBias = 0.02;

  if (sample && sample.any) {
    const { N, pts, dep, ok } = sample;
    let dLo = Infinity, dHi = -Infinity;
    for (let k = 0; k < dep.length; k++) if (ok[k]) { const v = Math.max(-1, Math.min(1, dep[k])); if (v < dLo) dLo = v; if (v > dHi) dHi = v; }
    const dSpan = dHi - dLo > 1e-9 ? dHi - dLo : 1;
    const edge = 'rgba(20,28,45,0.32)';
    const ew = 0.6 * px;
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * (N + 1) + i, b = a + 1, c = a + N + 2, d = a + N + 1;
        if (!ok[a] || !ok[b] || !ok[c] || !ok[d]) continue;
        const dmin = Math.min(dep[a], dep[b], dep[c], dep[d]), dmax = Math.max(dep[a], dep[b], dep[c], dep[d]);
        if (dmax - dmin > 1.0 || dmin > 1 || dmax < -1) continue;
        const A = [pts[a * 3], pts[a * 3 + 1], pts[a * 3 + 2]], B = [pts[b * 3], pts[b * 3 + 1], pts[b * 3 + 2]];
        const C = [pts[c * 3], pts[c * 3 + 1], pts[c * 3 + 2]], D = [pts[d * 3], pts[d * 3 + 1], pts[d * 3 + 2]];
        const e1 = [C[0] - A[0], C[1] - A[1], C[2] - A[2]], e2 = [D[0] - B[0], D[1] - B[1], D[2] - B[2]];
        const n = [e1[1] * e2[2] - e1[2] * e2[1], e1[2] * e2[0] - e1[0] * e2[2], e1[0] * e2[1] - e1[1] * e2[0]];
        const nl = Math.hypot(n[0], n[1], n[2]) || 1;
        const lam = Math.abs((n[0] * L[0] + n[1] * L[1] + n[2] * L[2]) / (nl * Ll));
        const inside = dmin >= -1 && dmax <= 1;
        const poly = inside ? [A, B, C, D] : clipPolyDep([A, B, C, D], sample.di);
        if (poly.length < 3) continue;
        const q = [];
        let zs = 0, ds = 0;
        for (const v of poly) {
          const pr = proj(v[0], v[1], v[2]);
          q.push(pr[0], pr[1]);
          zs += pr[2];
          ds += v[sample.di];
        }
        const t = dHi - dLo > 1e-9 ? (ds / poly.length - dLo) / dSpan : 0.5;
        items.push({ z: zs / poly.length, p: q, f: surfaceColor(t, 0.62 + 0.38 * lam), s: edge, w: ew });
      }
    }
  }

  const addLine = (A, B, segs, color, w) => {
    for (let k = 0; k < segs; k++) {
      const t0 = k / segs, t1 = (k + 1) / segs;
      const a = proj(A[0] + (B[0] - A[0]) * t0, A[1] + (B[1] - A[1]) * t0, A[2] + (B[2] - A[2]) * t0);
      const b = proj(A[0] + (B[0] - A[0]) * t1, A[1] + (B[1] - A[1]) * t1, A[2] + (B[2] - A[2]) * t1);
      items.push({ z: (a[2] + b[2]) / 2 + lineBias, p: [a[0], a[1], b[0], b[1]], s: color, w });
    }
  };

  if (settings.showBox) {
    const boxColor = 'rgba(26,26,26,0.2)';
    const c = [-1, 1];
    for (const y of c) for (const z of c) addLine([-1, y, z], [1, y, z], 8, boxColor, 0.8 * px);
    for (const x of c) for (const z of c) addLine([x, -1, z], [x, 1, z], 8, boxColor, 0.8 * px);
    for (const x of c) for (const y of c) addLine([x, y, -1], [x, y, 1], 8, boxColor, 0.8 * px);
  }

  const R = ranges3D(settings);
  const nrm = (v, [a, b]) => (v - (a + b) / 2) / ((b - a) / 2);
  const o = [nrm(axisAnchor(...R.x), R.x), nrm(axisAnchor(...R.y), R.y), nrm(axisAnchor(...R.z), R.z)];
  const aColor = axisColor;
  const aw = 2 * px, aLen = 9 * px, aWid = 9 * px, tickLen = 5 * px;
  const labelSize = 11 * px, letterSize = 15 * px;
  const names = ['x', 'y', 'z'];
  const letters = [settings.xLabel, settings.yLabel, settings.zLabel];
  for (let ax = 0; ax < 3; ax++) {
    const A = o.slice(), B = o.slice();
    A[ax] = -1; B[ax] = 1;
    addLine(A, B, 24, aColor, aw);
    const pA = proj(...A), pB = proj(...B);
    const sx = pB[0] - pA[0], sy = pB[1] - pA[1];
    const slen = Math.hypot(sx, sy);
    const dir = slen > 1e-9 ? [sx / slen, sy / slen] : [0, -1];
    const perp = [-dir[1], dir[0]];
    if (Math.abs(dir[1]) > Math.abs(dir[0])) { if (perp[0] > 0) { perp[0] = -perp[0]; perp[1] = -perp[1]; } }
    else if (perp[1] < 0) { perp[0] = -perp[0]; perp[1] = -perp[1]; }
    const hasArrow = slen > aLen * 3;
    if (hasArrow) {
      const bx = pB[0] - dir[0] * aLen, by = pB[1] - dir[1] * aLen;
      items.push({
        z: pB[2] + lineBias,
        p: [bx + perp[0] * aWid / 2, by + perp[1] * aWid / 2, pB[0], pB[1], bx - perp[0] * aWid / 2, by - perp[1] * aWid / 2],
        s: aColor, w: aw,
      });
    }
    const letter = (letters[ax] || '').trim();
    if (letter) {
      const off = 13 * px;
      labels.push({ x: pB[0] + (hasArrow ? dir[0] * off : 0), y: pB[1] + (hasArrow ? dir[1] * off : -off), text: letter, size: letterSize, italic: true, opacity: 0.8 });
    }
    if (settings.showTicks && slen > 20 * px) {
      const [lo, hi] = R[names[ax]];
      const step = niceTickStep(hi - lo, 8);
      const zone = (aLen / (slen / 2)) * ((hi - lo) / 2);
      for (let v = Math.ceil(lo / step) * step, n = 0; v <= hi + step * 1e-3 && n < 200; v += step, n++) {
        if (Math.abs(v) < step * 1e-4) continue;
        if (hasArrow && v > hi - zone) continue;
        const Pt = o.slice(); Pt[ax] = nrm(v, [lo, hi]);
        const q = proj(...Pt);
        items.push({ z: q[2] + lineBias, p: [q[0] - perp[0] * tickLen / 2, q[1] - perp[1] * tickLen / 2, q[0] + perp[0] * tickLen / 2, q[1] + perp[1] * tickLen / 2], s: aColor, w: aw });
        const text = fmtTick(v, step);
        const off = tickLen / 2 + 4 * px + Math.abs(perp[0]) * 0.3 * labelSize * text.length + Math.abs(perp[1]) * 0.5 * labelSize;
        labels.push({ x: q[0] + perp[0] * off, y: q[1] + perp[1] * off, text, size: labelSize, opacity: 0.7 });
      }
    }
  }

  items.sort((a, b) => a.z - b.z);
  return {
    items: items.map(it => (it.f ? { p: it.p, f: it.f, s: it.s, w: it.w } : { p: it.p, s: it.s, w: it.w })),
    labels,
  };
}

const preview3DState = { key: null, sample: null, parsed: null, settings: null };

function preview3D(parsed, settings) {
  const box = document.getElementById('graphPreview_box');
  let cv = box.querySelector('canvas.p3d');
  if (!cv) {
    try { Plotly.purge(box); } catch (_) {}
    box.innerHTML = '';
    cv = document.createElement('canvas');
    cv.className = 'p3d';
    box.appendChild(cv);
    attachPreview3DDrag(cv);
  }
  let sample = null;
  if (parsed) {
    const key = parsed.kind + '|' + parsed.expr + '|' + [settings.xMin, settings.xMax, settings.yMin, settings.yMax, settings.zMin, settings.zMax].join(',');
    if (preview3DState.key !== key) {
      preview3DState.key = key;
      preview3DState.sample = sample3D(parsed, settings, SURFACE_N);
    }
    sample = preview3DState.sample;
  }
  preview3DState.parsed = parsed;
  preview3DState.settings = settings;
  preview3DState.drawSample = sample;
  draw3DPreview();
}

function draw3DPreview() {
  const box = document.getElementById('graphPreview_box');
  const cv = box.querySelector('canvas.p3d');
  if (!cv || !preview3DState.settings) return;
  const rect = box.getBoundingClientRect();
  const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  const settings = { ...preview3DState.settings, azim: graph3DView.azim, elev: graph3DView.elev };
  const scene = build3DScene(preview3DState.drawSample, settings, w / 2, h / 2, Math.min(w, h) * 0.28, 1, hexToRgba(state.penColor, 0.5));
  drawPolyItems(c, scene.items);
  for (const lab of scene.labels) {
    drawStroke({ kind: 'text', x: lab.x, y: lab.y, text: lab.text, size: lab.size, italic: lab.italic, color: '#1a1a1a', anchor: 'middle-center', opacity: lab.opacity }, c);
  }
  if (preview3DState.parsed && !(preview3DState.drawSample && preview3DState.drawSample.any)) {
    c.fillStyle = '#a64a3a';
    c.font = '12px ui-monospace, Menlo, monospace';
    c.textAlign = 'left'; c.textBaseline = 'top';
    c.fillText('no surface in this range', 4, 4);
  }
  c.fillStyle = 'rgba(26,26,26,0.4)';
  c.font = '11px ui-monospace, Menlo, monospace';
  c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText('drag to rotate · scroll to zoom', w - 2, h - 2);
}

function attachPreview3DDrag(cv) {
  let drag = null;
  cv.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, azim: graph3DView.azim, elev: graph3DView.elev };
    cv.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    graph3DView.azim = ((drag.azim - (e.clientX - drag.x) * 0.5) % 360 + 360) % 360;
    graph3DView.elev = Math.max(-89, Math.min(89, drag.elev + (e.clientY - drag.y) * 0.5));
    draw3DPreview();
  });
  const end = (e) => { if (!drag) return; drag = null; try { cv.releasePointerCapture(e.pointerId); } catch (_) {} };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

function autoFit3D(parsed) {
  const s = readGraphSettings();
  const R = ranges3D(s);
  const map = { z_of_xy: ['x', 'y', 'z'], x_of_yz: ['y', 'z', 'x'], y_of_xz: ['x', 'z', 'y'] }[parsed.kind];
  const [uName, vName, dName] = map;
  let lo = Infinity, hi = -Infinity;
  try {
    const compiled = math.compile(parsed.expr);
    const N = 80;
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
      const u = R[uName][0] + (R[uName][1] - R[uName][0]) * i / N;
      const v = R[vName][0] + (R[vName][1] - R[vName][0]) * j / N;
      let val; try { val = compiled.evaluate({ [uName]: u, [vName]: v }); } catch (_) { val = NaN; }
      if (typeof val === 'number' && isFinite(val)) { if (val < lo) lo = val; if (val > hi) hi = val; }
    }
  } catch (_) { return; }
  if (!isFinite(lo) || !isFinite(hi)) return;
  lo = Math.max(lo, -1e6); hi = Math.min(hi, 1e6);
