<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>χplot</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c1f25; }
body { font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="app">
  <!-- Top toolbar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">χ</span>
      <span class="brand-name">plot</span>
    </div>
    <div class="tool-cluster" id="toolCluster">
      <button class="tool" data-tool="pen" title="Pen">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 17 L13 7 L15 9 L5 19 Z M14 6 L16 4 L18 6 L16 8 Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">P</span>
        <span class="tool-color-dot" id="penDot"></span>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 14 L10 4 L17 8 L13 16 L7 16 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7" y1="16" x2="13" y2="16" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">E</span>
      </button>
      <button class="tool" data-tool="select" title="Select">
        <svg viewBox="0 0 20 20" width="16" height="16"><rect x="3" y="3" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/></svg>
        <span class="tool-key">S</span>
        <span class="tool-color-dot" id="selDot"></span>
      </button>
      <button class="tool" data-tool="text" title="Text">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 5 L16 5 M10 5 L10 16" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="tool-key">T</span>
        <span class="tool-color-dot" id="textDot"></span>
      </button>
    </div>
    <div class="tool-cluster insert-cluster">
      <button class="tool" id="imageUploadBtn" title="Insert image">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="14" height="12" rx="1"/>
          <circle cx="7.5" cy="8.5" r="1.3"/>
          <path d="M3 14 L7 10 L11 13 L14 10 L17 13"/>
        </svg>
        <span class="tool-key">I</span>
      </button>
      <button class="tool" data-tool="graph" title="Desmos graph">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="15" height="15" rx="3.5"/><path d="M5.2 12.6 C 7 6.2, 9.2 6.2, 10 10 S 13 13.8, 14.8 7.4"/></svg>
        <span class="tool-key">1</span>
      </button>
      <button class="tool" id="shapesBtn" title="Geometry">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16.5 L10.5 16.5 L6.5 9 Z"/><circle cx="13" cy="7" r="4.5"/></svg>
        <span class="tool-key">2</span>
        <span class="tool-color-dot" id="shapeDot"></span>
      </button>
    </div>

    <div class="action-cluster">
      <button class="ctrl-btn icon-only" id="openBoardBtn" title="Open">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-7l-2-2.5H5a2 2 0 0 0-2 2z"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="saveBoardBtn" title="Save">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v11"/><path d="M7 10.5 12 15.5l5-5"/><path d="M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="copyImgBtn" title="Snapshot">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>
        </svg>
      </button>
      <span class="cluster-divider"></span>
      <button class="ctrl-btn icon-only" id="undoBtn" title="Undo">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
      </button>
      <button class="ctrl-btn icon-only" id="redoBtn" title="Redo">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 14 20 9l-5-5"/>
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
        </svg>
      </button>
      <span class="cluster-divider"></span>
      <button class="ctrl-btn" id="resetBtn" title="Clear all">Reset</button>
    </div>
  </div>

  <!-- Main work area -->
  <div class="work-area">
    <aside class="side-panel">
      <div class="side-resizer" id="sideResizer"></div>
      <div class="panel-header">
        <span class="panel-title">Layers</span>
        <div class="panel-actions">
          <button class="icon-btn" id="flattenBtn" title="Merge all layers"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5 V5.5 M5.5 4 L8 6.5 L10.5 4 M8 14.5 V10.5 M5.5 12 L8 9.5 L10.5 12 M2.5 8 H13.5" stroke-linecap="round"/></svg></button>
          <button class="icon-btn" id="addLayerBtn" title="Add layer">+</button>
        </div>
      </div>
      <div class="layer-list" id="layerList"></div>

      <div class="history-panel" id="historyPanel">
        <div class="panel-header">
          <span class="panel-title">History</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="panel-footer">
        <div class="zoom-bar-wrap">
          <div class="zoom-bar-row">
            <span class="zoom-label">Zoom</span>
            <input type="text" id="zoomReadout" class="zoom-readout" value="100%" title="Zoom" spellcheck="false">
          </div>
          <input type="range" id="zoomSlider" class="zoom-slider" min="0" max="1000" value="500" step="1">
          <div class="zoom-bar-row zoom-range-labels">
            <span>1%</span>
            <span>4000%</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
      <div class="embed-layer" id="embedLayer"></div>
      <!-- Top-right floating toolbar: grid + reset view (always visible) -->
      <div class="canvas-view-toolbar">
        <button class="ctrl-btn icon-only" id="gridBtn" title="Grid">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="1"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
        </button>
        <label class="ctrl-btn icon-only paper-btn" title="Paper color">
          <input type="color" id="bgColor" value="#ffffff">
        </label>
        <button class="ctrl-btn icon-only" id="calcBtn" title="Calculator">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7 H16 M8.5 12 H9.5 M11.5 12 H12.5 M14.5 12 H15.5 M8.5 16 H9.5 M11.5 16 H12.5 M14.5 16 H15.5"/></svg>
        </button>
        <button class="ctrl-btn icon-only" id="resetViewBtn" title="Reset view">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12 L12 3 L21 12"/>
            <path d="M5 10 L5 21 L19 21 L19 10"/>
            <path d="M10 21 L10 14 L14 14 L14 21"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="tool-pop" id="toolPop">
    <div class="tp-colors" id="tpColors">
      <input type="color" id="penColor" class="tp-custom" value="#ffffff" title="Custom color">
    </div>
    <div class="tp-size">
      <span class="tp-preview"><span id="tpDot"></span></span>
      <input type="range" id="penSize" class="tp-range" min="0" max="1" step="1" value="0">
      <span class="tp-val" id="tpVal">6</span>
    </div>
    <div class="tp-actions">
      <button class="tp-btn" id="sizeResetBtn" title="Reset size" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
      <button class="tp-btn" id="sizeLockBtn" title="Keep size when zooming" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sizeLockIcon"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11 V7 a4 4 0 0 1 8 0"/></svg>
        <span>Lock</span>
      </button>
    </div>
  </div>

  <div class="tool-pop" id="textPop">
    <div class="tp-colors" id="textColors">
      <input type="color" id="textColor" class="tp-custom" value="#ffffff" title="Custom color">
    </div>
    <div class="tp-size">
      <span class="tp-preview"><span class="tp-aa" id="textAa">Aa</span></span>
      <input type="range" id="textSize" class="tp-range" min="0" max="1" step="1" value="0">
      <span class="tp-val" id="textVal">36</span>
    </div>
    <div class="tp-actions">
      <button class="tp-btn" id="textResetBtn" title="Reset size" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </div>

  <div class="tool-pop shape-pop" id="shapePop">
    <button class="sp-gear" id="shapeGearBtn" type="button" title="Settings"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <div class="tool-pop" id="shapeSetPop">
    <div class="tp-colors" id="shapeSetColors">
      <input type="color" id="shapeSetColor" class="tp-custom" value="#ffffff" title="Custom color">
    </div>
    <div class="tp-size">
      <span class="tp-lbl">Line</span>
      <input type="range" id="shapeWidthSlider" class="tp-range" min="0" max="1" step="1" value="0">
      <span class="tp-val" id="shapeWidthVal">2</span>
    </div>
    <div class="tp-size">
      <span class="tp-lbl">Label</span>
      <input type="range" id="shapeFsSlider" class="tp-range" min="0" max="1" step="1" value="0">
      <span class="tp-val" id="shapeFsVal">15</span>
    </div>
    <button class="tp-fold" id="shapeOptFold" type="button" aria-expanded="false"><span>Defaults</span><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 L6 7.5 L9 4.5"/></svg></button>
    <div class="tp-chips" id="shapeOptChips" hidden></div>
    <div class="tp-actions">
      <button class="tp-btn" id="shapeSetResetBtn" title="Reset settings" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </div>
  <div class="tool-pop" id="snapPop">
    <div class="sp-head">Capture</div>
    <div class="snap-row" data-key="mode">
      <button class="snap-lab" type="button" data-side="0">Window</button>
      <button class="snap-sw" type="button" role="switch" aria-label="Window or Canvas"><i></i><i></i><span></span></button>
      <button class="snap-lab" type="button" data-side="1">Canvas</button>
    </div>
    <div class="sp-head">Action</div>
    <div class="snap-row" data-key="action">
      <button class="snap-lab" type="button" data-side="0">Copy</button>
      <button class="snap-sw" type="button" role="switch" aria-label="Copy or Save"><i></i><i></i><span></span></button>
      <button class="snap-lab" type="button" data-side="1">Save</button>
    </div>
    <div class="tp-actions">
      <button class="tp-btn" id="snapResetBtn" title="Reset snapshot settings" type="button">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </div>
  <div class="tool-pop color-pop" id="selColorPop">
    <div class="tp-colors" id="selColors">
      <input type="color" id="selColor" class="tp-custom" value="#ffffff" title="Custom color">
    </div>
  </div>
  <div class="tool-pop color-pop" id="shapeEditColorPop">
    <div class="tp-colors" id="shapeEditColors">
      <input type="color" id="shapeEditColor" class="tp-custom" value="#ffffff" title="Custom color">
    </div>
  </div>

  <div class="calc-panel" id="calcPanel">
    <div class="calc-head" id="calcHead">
      <span class="calc-title">Calculator</span>
      <span class="calc-grip-wrap"><svg class="calc-grip" viewBox="0 0 22 10" width="22" height="10" aria-hidden="true"><circle cx="3" cy="2.5" r="1.5" fill="currentColor"/><circle cx="11" cy="2.5" r="1.5" fill="currentColor"/><circle cx="19" cy="2.5" r="1.5" fill="currentColor"/><circle cx="3" cy="7.5" r="1.5" fill="currentColor"/><circle cx="11" cy="7.5" r="1.5" fill="currentColor"/><circle cx="19" cy="7.5" r="1.5" fill="currentColor"/></svg></span>
      <span class="calc-head-btns">
      <button class="calc-close" id="calcClose" type="button" title="Close">
        <svg viewBox="0 0 14 14" width="11" height="11" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg>
      </button>
      </span>
    </div>
    <div class="calc-host" id="calcHost"></div>
    <div class="calc-rz n" data-d="n"></div><div class="calc-rz s" data-d="s"></div><div class="calc-rz e" data-d="e"></div><div class="calc-rz w" data-d="w"></div>
    <div class="calc-rz nw" data-d="nw"></div><div class="calc-rz ne" data-d="ne"></div><div class="calc-rz sw" data-d="sw"></div><div class="calc-rz se" data-d="se"></div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-backdrop" id="confirmModal" style="display:none;">
    <div class="modal confirm-modal">
      <div class="modal-head">
        <span id="confirmTitle">Confirm</span>
      </div>
      <div class="modal-body">
        <div id="confirmMessage" class="confirm-message"></div>
      </div>
      <div class="modal-foot">
        <button class="ctrl-btn" id="confirmCancel">Cancel</button>
        <button class="ctrl-btn primary warn" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500&display=swap');

:root {
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 0.12s;
  --t-med: 0.2s;
  --t-slow: 0.3s;
  --backdrop: rgba(0,0,0,0.55);
  --paper: #ffffff;
  --ink: #1a1a1a;
  --chrome-bg: #1f2127;
  --chrome-bg-2: #272a31;
  --chrome-line: #353841;
  --chrome-line-strong: #454853;
  --chrome-text: #d8d6d0;
  --chrome-text-soft: #8a8c93;
  --accent: #6b8cce;
  --accent-soft: #2c3548;
  --warn: #d97765;
  --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.18);
  --serif: 'Fraunces', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --hand: 'Caveat', cursive;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #15171b;
  font-family: var(--serif);
  color: var(--chrome-text);
  font-feature-settings: "ss01", "ss02";
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
/* Re-enable text selection only inside actual editable fields */
input, textarea, [contenteditable="true"], .embed.editing {
  user-select: text !important;
  -webkit-user-select: text !important;
}
#app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

.topbar {
  position: relative; z-index: 101;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--chrome-bg);
  border-bottom: 1px solid var(--chrome-line); flex-wrap: nowrap; min-width: 0;
}
.brand { display: flex; align-items: center; gap: 6px; }
.brand-mark { font-family: var(--serif); font-size: 22px; font-weight: 500; font-style: italic; color: var(--accent); line-height: 1; transform: translateY(-5px); }
.brand-name { font-family: var(--serif); font-size: 14px; letter-spacing: 0.02em; color: var(--chrome-text-soft); font-weight: 500; }

.tool-cluster, .action-cluster { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
.action-cluster { margin-left: auto; gap: 6px; }
.tool-cluster { position: relative; padding-left: 13px; }
.tool-cluster::before { content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 20px; transform: translateY(-50%); background: var(--chrome-line); }
.cluster-divider { width: 1px; height: 20px; background: var(--chrome-line); margin: 0 6px; }
.action-cluster .ctrl-btn { height: 32px; box-sizing: border-box; }
.action-cluster .ctrl-btn.icon-only { width: 32px; padding: 0; }
.paper-btn { width: 31px; height: 29px; box-sizing: border-box; padding: 0; cursor: pointer; }
.paper-btn input[type="color"] { width: 15px; height: 15px; border: 1px solid var(--chrome-text-soft); border-radius: 50%; padding: 0; background: none; cursor: pointer; }
.paper-btn input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.paper-btn input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
.paper-btn input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }
.canvas-view-toolbar .ctrl-btn.icon-only { width: 31px; height: 29px; box-sizing: border-box; padding: 0; }
.dz-floatbar.failed > :not(.dz-done), .dz-panel.failed .dz-head > :not(.dz-done):not(.dz-spacer) { display: none; }
.dz-floatbar.failed { padding-left: 4px; }

.tool {
  position: relative; width: 36px; height: 36px;
  border: 1px solid transparent; background: transparent; border-radius: 6px;
  cursor: pointer; color: var(--chrome-text-soft);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast);
}
.tool:hover { background: var(--chrome-line); color: var(--chrome-text); }
.tool:focus:not(:focus-visible) { outline: none; }
.tool.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(107,140,206,0.3); }
.tool-key {
  position: absolute; bottom: 1px; right: 2px;
  font-family: var(--mono); font-size: 8px; color: var(--chrome-text-soft); opacity: 0.7;
}
.tool.active .tool-key { color: var(--accent); opacity: 1; }



#selDot { display: none; }
#selDot.on { display: block; }
.tool-color-dot { position: absolute; left: 50%; bottom: 5px; width: 10px; height: 2px; margin-left: -5px; border-radius: 2px; background: #000000; box-shadow: 0 0 0 1px rgba(255,255,255,0.22); }
.tool-pop { position: fixed; z-index: 1200; width: 212px; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--chrome-bg); border: 1px solid var(--chrome-line-strong); border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity var(--t-fast) ease, transform var(--t-fast) var(--ease); }
.tool-pop.on { opacity: 1; transform: none; pointer-events: auto; }
.tool-pop.eraser .tp-colors { display: none; }
.tp-colors { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; justify-items: center; }

    // Eye icon when visible; eye-with-slash when hidden. Both share the same outer
    // size so the row layout doesn't shift when toggling.
    const eyeOn  = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 8 C 3 4.5, 5.5 3, 8 3 S 13 4.5, 14.5 8 C 13 11.5, 10.5 13, 8 13 S 3 11.5, 1.5 8 Z"/><circle cx="8" cy="8" r="2.2"/></svg>';
    const eyeOff = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5 C 4 4, 6 3, 8 3 S 12.5 4.5, 14.5 8 C 13.8 9, 13 9.9, 12.2 10.6 M10 11.7 C 9.4 11.9, 8.7 12, 8 12 C 5.5 12, 3 10.5, 1.5 8 C 2.1 7, 2.9 6.1, 3.8 5.4"/><line x1="2" y1="2" x2="14" y2="14"/></svg>';
    const setIcon = () => { vis.innerHTML = layer.visible ? eyeOn : eyeOff; };
    setIcon();
    vis.onclick = (e) => {
      e.stopPropagation();
      layer.visible = !layer.visible;
      vis.classList.toggle('on', layer.visible);
      vis.removeAttribute('title');
      vis.dataset.tip = layer.visible ? 'Hide layer' : 'Show layer';
      setIcon();
      render();
      pushHistory(layer.visible ? 'Show layer' : 'Hide layer');
    };
    vis.draggable = false;
    row.appendChild(vis);

    const name = document.createElement('input');
    name.className = 'layer-name';
    name.draggable = false;
    name.onclick = (e) => e.stopPropagation();
    name.onmousedown = (e) => e.stopPropagation();

    const display = document.createElement('span');
    display.className = 'layer-name-display';
    display.draggable = false;
    const labelOf = () => layer.name.replace(/^(Desmos|Image):\s*/, '');
    let labelEl = null;
    function updateNameDisplay() {
      const imgStroke = layerImageStroke(layer);
      const isGraph = !!(imgStroke && imgStroke.desmos);
      const thumbSrc = imgStroke ? imgStroke.src : null;
      const shp = !thumbSrc && layer.obj ? layer.strokes.concat(state.selection && state.selection.layerId === layer.id ? state.selection.strokes : []).find(st => st.kind === 'shape') : null;
      display.classList.toggle('has-thumb', !!thumbSrc);
      display.classList.toggle('has-icon', !!shp);
      display.title = thumbSrc ? labelOf() : '';
      display.textContent = '';
      row._thumb = null;
      if (thumbSrc || shp) {
        const icon = document.createElement('span');
        icon.className = 'layer-kind-icon';
        icon.innerHTML = shp ? SHAPE_TYPES[shp.type].icon : isGraph ? LAYER_GRAPH_ICON : LAYER_IMAGE_ICON;
        display.appendChild(icon);
      }
      labelEl = document.createElement('span');
      labelEl.className = thumbSrc ? 'layer-thumb-label' : 'layer-plain-label';
      labelEl.textContent = labelOf() || (thumbSrc ? (isGraph ? 'Graph' : 'Image') : '');
      display.appendChild(labelEl);
      if (thumbSrc) {
        const img = document.createElement('img');
        img.className = 'layer-thumb';
        img.draggable = false;
        img.alt = '';
        img.src = thumbSrc;
        display.appendChild(img);
        row._thumb = img;
      }
    }
    updateNameDisplay();
    row.addEventListener('mousemove', () => { if (row._thumb && !layerPreview.classList.contains('on') && !row.classList.contains('dragging') && !display.classList.contains('renaming')) showLayerPreview(row._thumb, row); });
    row.addEventListener('mouseleave', hideLayerPreview);
    let nameBefore = null;
    display.ondblclick = (e) => {
      e.stopPropagation();
      if (display.classList.contains('renaming')) return;
      nameBefore = layer.name;
      hideLayerPreview();
      name.value = labelOf();
      display.classList.add('renaming');
      labelEl.replaceWith(name);
      fitName();
      name.focus();
      name.select();
    };
    const finishRename = () => {
      if (nameBefore === null) return;
      const v = name.value.trim();
      if (v && v !== labelOf()) layer.name = v;
      const changed = layer.name !== nameBefore;
      nameBefore = null;
      display.classList.remove('renaming');
      updateNameDisplay();
      if (changed) pushHistory('Rename layer');
    };
    const fitName = () => {
      const c = fitName.c || (fitName.c = document.createElement('canvas').getContext('2d'));
      c.font = getComputedStyle(name).font;
      name.style.width = Math.ceil(c.measureText(name.value || ' ').width + 4) + 'px';
    };
    name.oninput = fitName;
    name.onblur = finishRename;
    name.onkeydown = (e) => {
      if (e.key === 'Enter') { name.blur(); }
      else if (e.key === 'Escape') { name.value = labelOf(); name.blur(); }
    };
    row.appendChild(display);

    if (layer.obj) {
      const loc = document.createElement('button');
      loc.className = 'layer-locate';
      loc.title = 'Zoom to layer';
      loc.draggable = false;
      loc.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 5.5 V2 H5.5 M10.5 2 H14 V5.5 M14 10.5 V14 H10.5 M5.5 14 H2 V10.5"/><circle cx="8" cy="8" r="2"/></svg>';
      loc.onclick = (e) => { e.stopPropagation(); zoomToLayer(layer); };
      loc.onmousedown = (e) => e.stopPropagation();
      row.appendChild(loc);
      row.classList.add('has-locate');
    }

    if (state.layers.indexOf(layer) > 0) {
      const mg = document.createElement('button');
      mg.className = 'layer-merge';
      mg.title = 'Merge down';
      mg.draggable = false;
      mg.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 V10 M4.5 6.5 L8 10 L11.5 6.5 M3 13.5 H13"/></svg>';
      mg.onclick = (e) => { e.stopPropagation(); mergeLayerWithNeighbor(layer); };
      mg.onmousedown = (e) => e.stopPropagation();
      row.appendChild(mg);
    }

    // Delete button — hidden by default, fades in on row hover
    const del = document.createElement('button');
    del.className = 'layer-del';
    del.title = 'Delete layer';
    del.draggable = false;
    del.innerHTML = '<svg viewBox="0 0 14 14" width="11" height="11" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg>';
    del.onclick = (e) => {
      e.stopPropagation();
      if (state.layers.length <= 1) return;
      const idx = state.layers.findIndex(l => l.id === layer.id);
      if (state.selection && state.selection.layerId === layer.id) cancelSelection();
      layer.embeds.forEach(em => em.el && em.el.remove());
      state.layers.splice(idx, 1);
      if (state.activeLayerId === layer.id) state.activeLayerId = state.layers[Math.max(0, idx - 1)].id;
      render(); renderLayerList();
      pushHistory('Delete layer');
    };
    del.onmousedown = (e) => e.stopPropagation();
    row.appendChild(del);

    row.tabIndex = 0;
    row.onclick = () => {
      if (layer.obj) {
        selectObjectLayer(layer, true);
        for (const r of list.children) r.classList.toggle('active', r.dataset.layerId === layer.id);
        row.focus();
        return;
      }
      if (state.activeLayerId === layer.id) return;
      state.activeLayerId = layer.id;
      commitSelection();
      // Toggle the .active class in place rather than re-rendering the whole list — a
      // full re-render would destroy this row's DOM element mid-click, breaking the
      // dblclick-to-rename behavior on the name span.
      for (const r of list.children) r.classList.toggle('active', r.dataset.layerId === layer.id);
      row.focus();
    };

    // Drag-and-drop reordering
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', layer.id);
      row.classList.add('dragging');
      hideLayerPreview();
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      list.querySelectorAll('.drop-above, .drop-below').forEach(el => {
        el.classList.remove('drop-above', 'drop-below');
      });
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const r = row.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height / 2;
      // Clear other indicators
      list.querySelectorAll('.drop-above, .drop-below').forEach(el => {
        if (el !== row) el.classList.remove('drop-above', 'drop-below');
      });
      row.classList.toggle('drop-above', above);
      row.classList.toggle('drop-below', !above);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drop-above', 'drop-below');
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const draggedId = e.dataTransfer.getData('text/plain');
      const targetId = layer.id;
      if (!draggedId || draggedId === targetId) return;
      const r = row.getBoundingClientRect();
      const above = (e.clientY - r.top) < r.height / 2;
      moveLayer(draggedId, targetId, above);
    });

    list.appendChild(row);
  });
}

// Move layer with id `srcId` to be visually `above`/below the layer with id `targetId`.
// "Above" in the list panel = higher z-index (drawn on top) = later in state.layers.
function moveLayer(srcId, targetId, above) {
  const srcIdx = state.layers.findIndex(l => l.id === srcId);
  const tgtIdx = state.layers.findIndex(l => l.id === targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  const [moved] = state.layers.splice(srcIdx, 1);
  // After removing src, target's index may have shifted by 1
  const newTgtIdx = state.layers.findIndex(l => l.id === targetId);
  // List is rendered reversed: top of list (above) -> end of state.layers (top of z-stack)
  // If "above" target in the list, we want src to be AFTER target in state.layers (higher z)
  const insertAt = above ? newTgtIdx + 1 : newTgtIdx;
  state.layers.splice(insertAt, 0, moved);
  renderLayerList();
  render();
  pushHistory('Reorder layers');
}

function autoLayerName() {
  let n = 0;
  for (const l of state.layers) { const m = /^Layer (\d+)$/.exec(l.name); if (m) n = Math.max(n, +m[1]); }
  return 'Layer ' + (n + 1);
}

function bakeLayerStrokes(layer) {
  const ink = layer.strokes.filter(s => s.mode !== 'eraser');
  if (!ink.length) { layer.strokes = []; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, pad = 2;
  for (const s of ink) {
    const b = strokeBounds(s);
    if (b.x < x0) x0 = b.x; if (b.y < y0) y0 = b.y;
    if (b.x + b.w > x1) x1 = b.x + b.w; if (b.y + b.h > y1) y1 = b.y + b.h;
    if (s.width) pad = Math.max(pad, s.width / 2 + 2);
  }
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  const w = x1 - x0, h = y1 - y0;
  const k = Math.min(Math.max(state.view.scale, 1) * (window.devicePixelRatio || 1), 4096 / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.ceil(w * k));
  cv.height = Math.max(1, Math.ceil(h * k));
  const c = cv.getContext('2d');
  c.scale(k, k);
  c.translate(-x0, -y0);
  for (const s of layer.strokes) drawStroke(s, c);
  layer.strokes = [{ kind: 'image', x: x0, y: y0, w, h, rot: 0, src: cv.toDataURL('image/png') }];
}

function mergeLayerPair(lower, upper) {
  if (upper.strokes.some(s => s.mode === 'eraser') && lower.strokes.some(s => s.mode !== 'eraser')) bakeLayerStrokes(upper);
  const target = lower.obj && !upper.obj ? upper : lower;
  const other = target === upper ? lower : upper;
  const bothObj = !!(lower.obj && upper.obj);
  target.strokes = lower.strokes.concat(upper.strokes);
  target.embeds = lower.embeds.concat(upper.embeds);
  target.obj = false;
  delete target._auto;
  state.layers.splice(state.layers.indexOf(other), 1);
  if (bothObj) target.name = autoLayerName();
  return target;
}

function mergeLayerWithNeighbor(layer) {
  commitSelection();
  const i = state.layers.indexOf(layer);
  if (i < 1) return;
  const target = mergeLayerPair(state.layers[i - 1], layer);
  state.activeLayerId = target.id;
  renderLayerList(); render();
  pushHistory('Merge layers');
}

function flattenAllLayers() {
  commitSelection();
  if (state.layers.length < 2) return;
  let target = state.layers[0];
  while (state.layers.length > 1) target = mergeLayerPair(state.layers[0], state.layers[1]);
  state.activeLayerId = target.id;
  renderLayerList(); render();
  pushHistory('Merge all layers');
}

document.getElementById('flattenBtn').onclick = flattenAllLayers;

document.getElementById('addLayerBtn').onclick = () => {
  const l = makeLayer();
  state.layers.push(l);
  state.activeLayerId = l.id;
  renderLayerList(); render();
  pushHistory('Add layer');
};

/* =========================================================================
   RENDER
   ========================================================================= */
function render() {
  const r = wrap.getBoundingClientRect();
  ctx.fillStyle = state.bgColor;
  ctx.fillRect(0, 0, r.width, r.height);
  if (state.showGrid) drawGrid(r.width, r.height);

  // Render each layer onto the offscreen stroke canvas, then composite onto the main
  // canvas before moving to the next layer. This keeps eraser strokes (which use
  // destination-out) constrained to the layer they're drawn on — without this loop,
  // a single shared offscreen would let an eraser stroke on the top layer punch through
  // strokes on the layers below.
  const dpr = window.devicePixelRatio || 1;
  for (const layer of state.layers) {
    if (!layer.visible) continue;
    if (!layer.strokes.length && !(state.currentStroke && layer.id === state.activeLayerId)
        && !(state.selection && state.selection.lifted && state.selection.layerId === layer.id)) {
      continue;
    }
    strokeCtx.clearRect(0, 0, r.width, r.height);
    strokeCtx.save();
    strokeCtx.scale(state.view.scale, state.view.scale);
    strokeCtx.translate(-state.view.x, -state.view.y);
    const lifted = state.selection && state.selection.lifted && state.selection.layerId === layer.id ? state.selection : null;
    const order = lifted ? reinsertStrokes(layer.strokes, lifted.strokes, lifted.strokeIdx) : layer.strokes;
    const liftedSet = lifted ? new Set(lifted.strokes) : null;
    for (const stroke of order) {
      if (liftedSet && liftedSet.has(stroke)) {
        const cx = lifted.bbox.x + lifted.bbox.w / 2, cy = lifted.bbox.y + lifted.bbox.h / 2;
        const sc = lifted.scale || 1;
        strokeCtx.save();
        strokeCtx.translate(cx, cy);
        strokeCtx.rotate((lifted.rotation || 0) * Math.PI / 180);
        strokeCtx.scale(sc, sc);
        strokeCtx.translate(-lifted._origCx, -lifted._origCy);
        drawStroke(stroke, strokeCtx);
        strokeCtx.restore();
      } else {
        drawStroke(stroke, strokeCtx);
      }
    }
    if (state.currentStroke && layer.id === state.activeLayerId) {
      drawStroke(state.currentStroke, strokeCtx);
    }
    strokeCtx.restore();
    // Composite this layer onto the main canvas. setTransform(1,...) to draw at raw
    // device pixels matching the offscreen canvas dimensions.
    if (strokeCanvas.width > 0 && strokeCanvas.height > 0) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(strokeCanvas, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.restore();
    }
  }

  drawSelectionUI();
  drawShapeEditUI();
  updateSelectIndicator();
  drawImageHover();
  drawEraserCursor();
  positionEmbeds();
  syncDesmosOverlays();
  // Update the zoom readout unless the user is actively editing it (so their in-progress
  // typing isn't wiped by a render triggered mid-edit).
  const zoomEl = document.getElementById('zoomReadout');
  if (zoomEl && document.activeElement !== zoomEl) {
    zoomEl.value = Math.round(state.view.scale * 100) + '%';
  }
  syncZoomSlider();
}

function drawEraserCursor() {
  if (state.tool !== 'eraser' || !state.cursor.over) return;
  // Eraser stroke width on screen equals the eraser size, scaled by zoom since lock-time
  // when the size lock is on.
  const radius = state.eraserSize * state.view.scale / (state.sizeLockedScale ?? state.view.scale) / 2;
  ctx.save();
  // Outer dark ring
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, radius, 0, Math.PI * 2);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(20,20,20,0.85)';
  ctx.stroke();
  // Inner light ring for contrast against dark backgrounds
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, radius - 1, 0, Math.PI * 2);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.stroke();
  // Tiny center dot for precision
  ctx.beginPath();
  ctx.arc(state.cursor.x, state.cursor.y, 1, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(20,20,20,0.85)';
  ctx.fill();
  ctx.restore();
}

function drawGrid(w, h) {
  const v = state.view;
  const wx0 = v.x, wy0 = v.y;
  const wx1 = v.x + w / v.scale, wy1 = v.y + h / v.scale;
  ctx.save();
  ctx.lineWidth = 1;
  function lines(step, alpha) {
    ctx.strokeStyle = `rgba(40,40,30,${alpha})`;
    ctx.beginPath();
    const x0 = Math.floor(wx0 / step) * step, y0 = Math.floor(wy0 / step) * step;
    for (let wx = x0; wx <= wx1; wx += step) {
      const sx = (wx - v.x) * v.scale;
      ctx.moveTo(sx + 0.5, 0); ctx.lineTo(sx + 0.5, h);
    }
    for (let wy = y0; wy <= wy1; wy += step) {
      const sy = (wy - v.y) * v.scale;
      ctx.moveTo(0, sy + 0.5); ctx.lineTo(w, sy + 0.5);
    }
    ctx.stroke();
  }
  const k = Math.ceil(Math.log(15 / (25 * v.scale)) / Math.log(4));
  const minor = 25 * Math.pow(4, k);
  lines(minor, 0.06);
  lines(minor * 4, 0.14);
  ctx.restore();
}


function drawStroke(s, c) {
  c = c || ctx;
  if (s.kind === 'image') {
    if (s._dzHidden) return;
    // Canvas-rendered image. The HTMLImageElement is cached on the stroke object so we
    // don't recreate it every render frame. It loads asynchronously the first time, so
    // we re-trigger a render once it's ready.
    if (!s._img) {
      s._img = new Image();
      s._img.onload = () => render();
      s._img.src = s.src;
    }
    const live = s.desmos ? dzLiveCanvas(s) : null;
    const src = live || s._img;
    if (live || (s._img.complete && s._img.naturalWidth)) {
      c.save();
      if (typeof s.opacity === 'number') c.globalAlpha = s.opacity;
      if (s.rot) {
        c.translate(s.x + s.w / 2, s.y + s.h / 2);
        c.rotate(s.rot * Math.PI / 180);
        if (s.desmos) { c.fillStyle = '#fff'; c.fillRect(-s.w / 2, -s.h / 2, s.w, s.h); }
        c.drawImage(src, -s.w / 2, -s.h / 2, s.w, s.h);
      } else {
        if (s.desmos) { c.fillStyle = '#fff'; c.fillRect(s.x, s.y, s.w, s.h); }
        c.drawImage(src, s.x, s.y, s.w, s.h);
      }
      c.restore();
    }
    return;
  }
  if (s.kind === 'shape') {
    drawShape(c, s);
    return;
  }
  if (!s.points || !s.points.length) return;
  c.save();
  if (s.mode === 'eraser') c.globalCompositeOperation = 'destination-out';
  const solid = typeof s.opacity === 'number' && s.graphId && s.mode !== 'eraser' ? mixOverPaper(s.color, s.opacity) : null;
  if (!solid && typeof s.opacity === 'number') c.globalAlpha = s.opacity;
  c.strokeStyle = solid || s.color;
  c.fillStyle = solid || s.color;
  c.lineWidth = s.width;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  if (s.points.length === 1) {
    const p = s.points[0];
    c.beginPath(); c.arc(p.x, p.y, s.width / 2, 0, Math.PI * 2); c.fill();
  } else {
    c.beginPath();
    c.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) c.lineTo(s.points[i].x, s.points[i].y);
    c.stroke();
  }
  c.restore();
}

function drawSelectionUI() {
  const sel = state.selection;
  if (!sel) return;
  const corners = selectionCornersScreen();
  ctx.save();
  ctx.strokeStyle = '#6b8cce';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(corners.nw.x, corners.nw.y);
  ctx.lineTo(corners.ne.x, corners.ne.y);
  ctx.lineTo(corners.se.x, corners.se.y);
  ctx.lineTo(corners.sw.x, corners.sw.y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // Connector line from top-mid to rotate handle
  ctx.beginPath();
  ctx.moveTo(corners.rotate.attachX, corners.rotate.attachY);
  ctx.lineTo(corners.rotate.x, corners.rotate.y);
  ctx.stroke();

  // Corner handles (squares)
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#6b8cce';
  for (const k of ['nw', 'ne', 'se', 'sw']) {
    const c = corners[k];
    ctx.beginPath();
    ctx.rect(c.x - HANDLE_SIZE/2, c.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
    ctx.fill(); ctx.stroke();
  }
  if (singleTextSelection()) {
    for (const k of ['e', 'w']) {
      const c = corners[k];
      ctx.beginPath();
      ctx.rect(c.x - HANDLE_SIZE/2 + 1, c.y - HANDLE_SIZE, HANDLE_SIZE - 2, HANDLE_SIZE * 2);
      ctx.fill(); ctx.stroke();
    }
  }
  // Rotate handle (circle)
  ctx.beginPath();
  ctx.arc(corners.rotate.x, corners.rotate.y, HANDLE_SIZE / 2 + 1, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function selectionCornersScreen() {
  const sel = state.selection;
  const b = sel.bbox;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const sc = sel.scale || 1;
  const rot = (sel.rotation || 0) * Math.PI / 180;
  const hw = (b.w / 2) * sc, hh = (b.h / 2) * sc;
  const cos = Math.cos(rot), sin = Math.sin(rot);
  const corners = {};
  for (const [name, dx, dy] of [['nw',-hw,-hh],['ne',hw,-hh],['se',hw,hh],['sw',-hw,hh]]) {
    const wx = cx + dx*cos - dy*sin;
    const wy = cy + dx*sin + dy*cos;
    corners[name] = worldToScreen(wx, wy);
  }
  // Rotate handle: top-mid in screen coords, then offset 24px in the "up" direction of the rotated box
  const topMid = { x: (corners.nw.x + corners.ne.x) / 2, y: (corners.nw.y + corners.ne.y) / 2 };
  const centerScreen = worldToScreen(cx, cy);
  // "up" = direction from center to topMid, normalized
  const dxU = topMid.x - centerScreen.x, dyU = topMid.y - centerScreen.y;
  const len = Math.hypot(dxU, dyU) || 1;
  const ux = dxU / len, uy = dyU / len;
  corners.rotate = { x: topMid.x + ux * 24, y: topMid.y + uy * 24, attachX: topMid.x, attachY: topMid.y };
  corners.center = centerScreen;
  corners.e = { x: (corners.ne.x + corners.se.x) / 2, y: (corners.ne.y + corners.se.y) / 2 };
  corners.w = { x: (corners.nw.x + corners.sw.x) / 2, y: (corners.nw.y + corners.sw.y) / 2 };
  return corners;
}

/* =========================================================================
   POINTER EVENTS — main canvas
   ========================================================================= */
function toolCursor() {
  if (dz) return 'default';
  return { pen: 'crosshair', select: 'crosshair', eraser: 'none', text: 'text' }[state.tool] || 'default';
}

function gestureActive() {
  return !!(state.drawing || state.selDrag || state.panning || (state.shapeEdit && state.shapeEdit.drag));

function canvasPointerDown(e) {
  if (dz) {
    e.preventDefault();
    closeDesmosEditor();
    return;
  }
  if (gestureActive() && e.pointerId !== state.activePointerId) return;
  if (gestureActive()) canvasPointerUp(e);
  state.activePointerId = e.pointerId;
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);

  if (e.button === 2 || e.button === 1) {
    // Right-click (2) or middle-click (1) pans the canvas
    state.panning = { startSx: sp.x, startSy: sp.y, startVx: state.view.x, startVy: state.view.y };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
    return;
  }

  // instead of starting a new action (draw, select, etc.). The contenteditable's blur
  // handler will run exitTextEditMode automatically.
  const editingEmbed = document.querySelector('.embed.editing');
  if (editingEmbed) {
    editingEmbed.blur();
    return;
  }

  if (state.tool === 'select' && state.selection) {
    const handle = hitSelectionHandle(sp);
    if (handle === 'rotate') {
      const cs = selectionCornersScreen();
      const startAngle = Math.atan2(sp.y - cs.center.y, sp.x - cs.center.x);
      state.selDrag = {
        mode: 'rotate',
        centerSx: cs.center.x,
        centerSy: cs.center.y,
        startAngle,
        startRotation: state.selection.rotation || 0,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (handle === 'e' || handle === 'w') {
      state.selDrag = { mode: 'width-' + handle };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (handle) {
      const opposite = { nw: 'se', ne: 'sw', se: 'nw', sw: 'ne' }[handle];
      const cs = selectionCornersScreen();
      const anchor = cs[opposite];
      const origCorner = cs[handle];
      const sb = state.selection.bbox;
      state.selDrag = {
        mode: 'resize-' + handle,
        anchorSx: anchor.x, anchorSy: anchor.y,
        anchorW: screenToWorld(anchor.x, anchor.y),
        offX: (opposite === 'ne' || opposite === 'se' ? 1 : -1) * sb.w / 2,
        offY: (opposite === 'sw' || opposite === 'se' ? 1 : -1) * sb.h / 2,
        startCornerDist: Math.hypot(origCorner.x - anchor.x, origCorner.y - anchor.y),
        startScale: state.selection.scale || 1,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (pointInSelection(wp)) {
      state.selDrag = { mode: 'move', startWx: wp.x, startWy: wp.y, startBx: state.selection.bbox.x, startBy: state.selection.bbox.y };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    commitSelection();
  }

  if (state.tool === 'select') {
    const img = imageAtPoint(wp);
    if (img) { selectImageForMove(img, sp, wp, e); return; }
  }

  if (state.tool === 'select') {
    state.selDrag = { mode: 'creating', startWx: wp.x, startWy: wp.y };
    state.selection = { layerId: state.activeLayerId, bbox: { x: wp.x, y: wp.y, w: 0, h: 0 }, strokes: [], embeds: [], rotation: 0, scale: 1, lifted: false };
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  if (state.tool === 'text') {
    // Create an inline-editable text embed at click position and enter edit mode immediately
    placeInlineText(wp.x, wp.y);
    return;
  }

  const prevDown = state.lastDown;
  state.lastDown = { t: performance.now(), x: sp.x, y: sp.y, tap: false };
  if ((state.tool === 'pen' || state.tool === 'eraser') && prevDown && prevDown.tap && state.lastDown.t - prevDown.t < 450 && Math.hypot(sp.x - prevDown.x, sp.y - prevDown.y) < 6) {
    return;
  }

  if (state.tool === 'pen' || state.tool === 'eraser') {
    drawTarget();
    state.drawing = true;
    // When size is locked, the stroke's world-width is calibrated against the scale at
    // lock-time so its world thickness stays constant as the user zooms.
    const widthScale = state.sizeLockedScale != null ? state.sizeLockedScale : state.view.scale;

canvas.addEventListener('pointerdown', canvasPointerDown);

canvas.addEventListener('pointermove', (e) => {
  if (dz) { canvas.style.cursor = 'default'; return; }
  if (gestureActive() && e.pointerId !== state.activePointerId) return;
  if (gestureActive() && e.buttons === 0) canvasPointerUp(e);
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);

  // Track pointer position for custom cursor rendering (eraser circle)
  state.cursor.x = sp.x;
  state.cursor.y = sp.y;
  state.cursor.over = true;

  if (state.panning) {
    const p = state.panning;
    state.view.x = p.startVx + (p.startSx - sp.x) / state.view.scale;
    state.view.y = p.startVy + (p.startSy - sp.y) / state.view.scale;
    render();
    return;
  }

  if (state.shapeEdit) { shapeEditPointerMove(sp, wp, e); return; }

  if (state.drawing && state.currentStroke) {
    state.currentStroke.points.push({ x: wp.x, y: wp.y });
    render();
    return;
  }

  if (state.selDrag && state.selection) {
    const sd = state.selDrag;
    const sel = state.selection;
    if (sd.mode === 'creating') {
      sel.bbox.x = Math.min(sd.startWx, wp.x);
      sel.bbox.y = Math.min(sd.startWy, wp.y);
      sel.bbox.w = Math.abs(wp.x - sd.startWx);
      sel.bbox.h = Math.abs(wp.y - sd.startWy);
      render();
    } else if (sd.mode === 'move') {
      sel.bbox.x = sd.startBx + (wp.x - sd.startWx);
      sel.bbox.y = sd.startBy + (wp.y - sd.startWy);
      render();
    } else if (sd.mode === 'rotate') {
      const angle = Math.atan2(sp.y - sd.centerSy, sp.x - sd.centerSx);
      const delta = (angle - sd.startAngle) * 180 / Math.PI;
      let next = sd.startRotation + delta;
      // Hold Shift to snap to the nearest 45° increment
      if (e.shiftKey) next = Math.round(next / 45) * 45;
      sel.rotation = next;
      render();
    } else if (sd.mode.startsWith('width-')) {
      applyTextWidthDrag(sd.mode.slice(6), wp);
      render();
    } else if (sd.mode.startsWith('resize-')) {
      // factor = how much further the pointer is from the anchor than the original corner was
      const d1 = Math.hypot(sp.x - sd.anchorSx, sp.y - sd.anchorSy);
      if (sd.startCornerDist > 0) {
        const factor = Math.max(0.05, d1 / sd.startCornerDist);
        sel.scale = sd.startScale * factor;
        const rot = (sel.rotation || 0) * Math.PI / 180;
        const ox = sd.offX * sel.scale, oy = sd.offY * sel.scale;
        const ncx = sd.anchorW.x - (ox * Math.cos(rot) - oy * Math.sin(rot));
        const ncy = sd.anchorW.y - (ox * Math.sin(rot) + oy * Math.cos(rot));

        sel.bbox.y = ncy - sel.bbox.h / 2;

      render();
    }
    return;
  }

  // Hover cursor — change based on what's under the pointer
  if (state.tool === 'select' && state.selection) {
    const handle = hitSelectionHandle(sp);
    if (handle === 'rotate') canvas.style.cursor = 'grab';
    else if (handle === 'nw' || handle === 'se') canvas.style.cursor = 'nwse-resize';
    else if (handle === 'ne' || handle === 'sw') canvas.style.cursor = 'nesw-resize';
    else if (handle === 'e' || handle === 'w') canvas.style.cursor = 'ew-resize';
    else if (pointInSelection(wp)) canvas.style.cursor = 'move';
    else canvas.style.cursor = 'crosshair';
  }

  // For eraser tool, re-render so the custom circle cursor follows the pointer
  if (state.tool === 'eraser') render();
});

function canvasPointerUp(e) {
  if (gestureActive() && e.pointerId !== state.activePointerId) return;
  if (state.panning) {
    state.panning = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    canvas.style.cursor = toolCursor();
    return;
  }
  if (state.shapeEdit && state.shapeEdit.drag) {
    state.shapeEdit.drag = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    canvas.style.cursor = 'grab';
    renderLayerList();
    render();
    return;
  }
  if (state.drawing && state.currentStroke) {
    const layer = activeLayer();
    if (layer) {
      layer.strokes.push(state.currentStroke);
      const action = state.currentStroke.mode === 'eraser' ? 'Erase' : 'Draw';
      pushHistory(action);
      state.lastTap = state.currentStroke.points.length === 1
        ? { stroke: state.currentStroke, layerId: layer.id, histId: state.history[state.historyIndex].id, t: performance.now(), auto: !!layer._auto && layer.strokes.length === 1 && !layer.embeds.length }
        : null;
      delete layer._auto;
    }
    if (state.lastDown) state.lastDown.tap = state.currentStroke.points.length === 1;
    state.currentStroke = null;
    state.drawing = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    render();
    return;
  }
  if (state.selDrag) {
    const sd = state.selDrag;
    state.selDrag = null;
    if (sd.mode === 'creating' && !state.selection) {
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      render();
      return;
    }
    if (sd.mode === 'creating') {

      if (b.w < 4 || b.h < 4) {
        // Click without drag — revert to pen tool so the user can keep drawing
        cancelSelection();
        if (state.tool === 'select') setTool('pen');
      } else {
        liftSelection();
        ensureSelectionOrigin();
        if (!state.selection.strokes.length && !state.selection.embeds.length) cancelSelection();
      }
    } else if (sd.editOnClick) {
      // Second click on an already-selected text embed without drag → enter edit mode.
      const sp = eventScreenCoords(e);
      const moved = Math.hypot(sp.x - sd.startSx, sp.y - sd.startSy);
      if (moved < 4) {

        // re-attach the embed to its layer and enter edit mode.
        const targetEmbed = sd.editOnClick;
        commitSelection();
        enterTextEditMode(targetEmbed);

    render();
    return;

canvas.addEventListener('pointerup', canvasPointerUp);
canvas.addEventListener('pointercancel', canvasPointerUp);

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const sp = eventScreenCoords(e);
  const wp0 = screenToWorld(sp.x, sp.y);
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  const k = e.ctrlKey ? 0.012 : 0.004;
  const factor = Math.exp(-Math.max(-100, Math.min(100, dy)) * k);
  state.view.scale = Math.max(0.01, Math.min(40, state.view.scale * factor));
  const wp1 = screenToWorld(sp.x, sp.y);
  state.view.x += wp0.x - wp1.x;
  state.view.y += wp0.y - wp1.y;
  render();
}, { passive: false });

canvas.addEventListener('contextmenu', e => e.preventDefault());
wrap.addEventListener('contextmenu', e => e.preventDefault());

wrap.addEventListener('dblclick', (e) => {
  const sp = eventScreenCoords(e);
  const wp = screenToWorld(sp.x, sp.y);
  if (!dz) {
    if (state.selection) commitSelection();
    const g = desmosAtPoint(wp);
    if (g) {
      discardDoubleClickTap();
      openDesmosEditor(g, false);
      return;
    }
  }
  if (!dz && !state.shapeEdit) {
    const sh = shapeAtPoint(wp);
    if (sh && !document.querySelector('.embed.editing')) {
      discardDoubleClickTap();
      openShapeEditor(sh);
      return;
    }
  }

  // First, check if there's a text embed under the click. The embed's own dblclick handler
  // can be blocked when the embed has been auto-selected (pointer-events: none on .selected),
  // so we hit-test from the canvas as a fallback. Check both selected and unselected text embeds.
  // For selected embeds, em.x/y haven't been updated to reflect any move yet — apply the
  // selection's bbox-vs-original-center offset to find the embed's current visual position.
  const sel = state.selection;
  let selDx = 0, selDy = 0;
  if (sel) {
    selDx = (sel.bbox.x + sel.bbox.w/2) - sel._origCx;
    selDy = (sel.bbox.y + sel.bbox.h/2) - sel._origCy;
  }
  const selLayer = sel && state.layers.find(l => l.id === sel.layerId);
  const allEmbeds = [
    ...state.layers.filter(l => l.visible).flatMap(l => l.embeds).map(em => ({ em, dx: 0, dy: 0 })),
    ...(sel && (!selLayer || selLayer.visible) ? sel.embeds.map(em => ({ em, dx: selDx, dy: selDy })) : []),
  ];
  for (const { em, dx, dy } of allEmbeds) {
    if (em.type !== 'text') continue;
    const x = em.x + dx, y = em.y + dy;
    if (wp.x >= x && wp.x <= x + em.w && wp.y >= y && wp.y <= y + em.h) {
      // Commit any selection so the embed's current (possibly moved) position is preserved
      // and it re-attaches to its layer with normal pointer-events.
      if (state.selection) commitSelection();
      enterTextEditMode(em);
      return;
    }
  }
});

function discardDoubleClickTap() {
  const tap = state.lastTap;
  state.lastTap = null;
  if (!tap || performance.now() - tap.t > 900) return;
  const layer = state.layers.find(l => l.id === tap.layerId);
  if (layer) layer.strokes = layer.strokes.filter(st => st !== tap.stroke);
  if (layer && tap.auto && !layer.strokes.length && !layer.embeds.length) {
    const i = state.layers.indexOf(layer);
    state.layers.splice(i, 1);
    if (state.activeLayerId === layer.id) state.activeLayerId = state.layers[Math.max(0, i - 1)].id;
    renderLayerList();
  }
  const top = state.history[state.history.length - 1];
  if (top && top.id === tap.histId && state.historyIndex === state.history.length - 1) {
    state.history.pop();
    state.historyIndex = state.history.length - 1;
    renderHistoryPanel();
    syncUndoRedoButtons();
  }
  render();
}

function cloneStroke(s) {
  if (s.kind === 'shape') {
    return { kind: 'shape', type: s.type, pts: s.pts.map(q => ({ x: q.x, y: q.y })), color: s.color, width: s.width, fs: s.fs, opts: { ...s.opts }, names: s.names ? { ...s.names } : undefined };
  }
  if (s.kind === 'image') {
    return { kind: 'image', x: s.x, y: s.y, w: s.w, h: s.h, rot: s.rot || 0, src: s.src, opacity: s.opacity, desmos: s.desmos };
  }
  return { color: s.color, width: s.width, mode: s.mode, points: s.points.map(p => ({ x: p.x, y: p.y })), graphId: s.graphId, opacity: s.opacity };
}

function translateStroke(s, dx, dy) {
  const c = cloneStroke(s);
  if (c.kind === 'image') { c.x += dx; c.y += dy; }
  else if (c.kind === 'shape') c.pts = c.pts.map(q => ({ x: q.x + dx, y: q.y + dy }));
  else c.points = c.points.map(p => ({ x: p.x + dx, y: p.y + dy }));
  return c;
}

canvas.addEventListener('pointerleave', () => {
  state.cursor.over = false;
  if (state.hoverImage) { state.hoverImage = null; canvas.style.cursor = toolCursor(); render(); }
  else if (state.tool === 'eraser') render();
});
canvas.addEventListener('pointerenter', (e) => {
  const sp = eventScreenCoords(e);
  state.cursor.x = sp.x;
  state.cursor.y = sp.y;
  state.cursor.over = true;
  if (state.tool === 'eraser') render();
});

/* =========================================================================
   SELECTION OPS
   ========================================================================= */
function strokeBounds(s) {
  if (s.kind === 'shape') return shapeBounds(s);
  // Image strokes carry their own bbox directly.
  if (s.kind === 'image') {
    if (!s.rot) return { x: s.x, y: s.y, w: s.w, h: s.h };
    const a = s.rot * Math.PI / 180, ca = Math.abs(Math.cos(a)), sa = Math.abs(Math.sin(a));
    const bw = s.w * ca + s.h * sa, bh = s.w * sa + s.h * ca;
    return { x: s.x + s.w / 2 - bw / 2, y: s.y + s.h / 2 - bh / 2, w: bw, h: bh };
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of s.points) {
    if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
  }
  const pad = (s.width || 0) / 2;
  return { x: minX - pad, y: minY - pad, w: maxX - minX + 2 * pad, h: maxY - minY + 2 * pad };
}
function rectsIntersect(a, b) {
  return !(a.x + a.w < b.x || b.x + b.w < a.x || a.y + a.h < b.y || b.y + b.h < a.y);
}

function reinsertStrokes(strokes, items, idx) {
  const out = strokes.slice();
  items.forEach((st, k) => {
    const at = idx && idx[k] != null ? Math.min(idx[k], out.length) : out.length;
    out.splice(at, 0, st);
  });
  return out;
}

function selectAllInLayer() {
  commitSelection();
  const layer = activeLayer();
  if (!layer) return;
  if (state.tool !== 'select') setTool('select');
  const vr = wrap.getBoundingClientRect();
  const p0 = screenToWorld(0, 0), p1 = screenToWorld(vr.width, vr.height);
  state.selection = { layerId: layer.id, bbox: { x: Math.min(p0.x, p1.x), y: Math.min(p0.y, p1.y), w: Math.abs(p1.x - p0.x), h: Math.abs(p1.y - p0.y) }, strokes: [], embeds: [], rotation: 0, scale: 1, lifted: false };

  ensureSelectionOrigin();
  if (!state.selection.strokes.length && !state.selection.embeds.length) cancelSelection();
  render();

function liftSelection(only, onlyEmbeds) {

  sel.layerId = layer.id;
  const b = sel.bbox;
  const all = layer.strokes;
  const bounds = all.map(strokeBounds);
  const picked = new Set();
  all.forEach((s, i) => {
    if (only ? only.includes(s) : (s.mode !== 'eraser' && rectsIntersect(b, bounds[i]))) picked.add(i);
  });
  // Pick embeds whose center falls inside the drag rect
  const remEmbeds = [];
  const pickedEmbeds = [];
  for (const em of layer.embeds) {
    if (only ? (onlyEmbeds || []).includes(em) : rectsIntersect(b, { x: em.x, y: em.y, w: em.w, h: em.h })) {
      pickedEmbeds.push(em);
      em.el && em.el.classList.add('selected');
    } else remEmbeds.push(em);
  }

  // that graphId, even if they weren't directly under the drag rect. This keeps the
  // curve, axes, and tick-label numbers (which are tagged text strokes) as a single unit.
  const allGraphIds = new Set([...picked].map(i => all[i].graphId).filter(Boolean));
  if (allGraphIds.size) all.forEach((s, i) => { if (s.graphId && allGraphIds.has(s.graphId)) picked.add(i); });
  const firstPicked = picked.size ? Math.min(...picked) : Infinity;
  all.forEach((s, j) => {
    if (s.mode !== 'eraser' || j < firstPicked) return;
    let touchesPicked = false, touchesOther = false;
    for (let i = 0; i < j; i++) {
      if (all[i].mode === 'eraser' || !rectsIntersect(bounds[j], bounds[i])) continue;
      if (picked.has(i)) touchesPicked = true; else touchesOther = true;
    }
    if (touchesPicked && !touchesOther) picked.add(j);

  layer.embeds = remEmbeds;

  const idx = [...picked].sort((p, q) => p - q);
  const initialPicked = idx.map(i => all[i]);

  // Recompute bbox to tightly encompass all picked strokes AND embeds, so the visible
  // selection rectangle hugs the actual content rather than the user's drag area.
  if (initialPicked.length || pickedEmbeds.length) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    idx.forEach(i => {
      if (all[i].mode === 'eraser') return;
      const sb = bounds[i];
      if (sb.x < minX) minX = sb.x;
      if (sb.y < minY) minY = sb.y;
      if (sb.x + sb.w > maxX) maxX = sb.x + sb.w;
      if (sb.y + sb.h > maxY) maxY = sb.y + sb.h;
    });
    for (const em of pickedEmbeds) {
      if (em.x < minX) minX = em.x;
      if (em.y < minY) minY = em.y;
      if (em.x + em.w > maxX) maxX = em.x + em.w;
      if (em.y + em.h > maxY) maxY = em.y + em.h;
    }
    sel.bbox = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  for (const s of initialPicked) sel.strokes.push(s);
  sel.strokeIdx = idx;
  for (const em of pickedEmbeds) sel.embeds.push(em);
  layer.strokes = all.filter((_, i) => !picked.has(i));
  sel.lifted = true;
  sel._origCx = sel.bbox.x + sel.bbox.w/2;
  sel._origCy = sel.bbox.y + sel.bbox.h/2;
}

function imageHit(s, wp) {
  let dx = wp.x - (s.x + s.w / 2), dy = wp.y - (s.y + s.h / 2);
  if (s.rot) {
